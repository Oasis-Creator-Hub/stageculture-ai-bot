<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaelith Hollow — a crystal cave lit by your hand</title>
<meta name="description" content="A low-poly SVG crystal cavern. Move the pointer to carry a lantern through the dark: every facet is shaded, refracted and set glowing relative to the light.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060b;overflow:hidden}
  svg#cave{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
  .cap{position:fixed;right:clamp(16px,4vw,48px);bottom:clamp(18px,5vh,46px);text-align:right;color:#cfe6ee;pointer-events:none;
    font-family:"Optima","Candara","Gill Sans","Segoe UI",sans-serif;mix-blend-mode:screen}
  .cap h1{font-weight:300;font-size:clamp(26px,5vw,58px);letter-spacing:.2em;text-transform:uppercase;line-height:1}
  .cap p{font-size:12px;letter-spacing:.34em;text-transform:uppercase;opacity:.6;margin-top:12px}
  .cap em{display:block;font-style:normal;font-size:11px;letter-spacing:.2em;opacity:.5;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace}
  a.back{position:fixed;left:16px;top:14px;color:#8fb3c2;text-decoration:none;font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.24em;z-index:3;opacity:.7}
  a.back:hover{opacity:1}
</style>
</head>
<body>
<svg id="cave" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Low-poly crystal cave; facets respond to a pointer-controlled light">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".12" stop-color="#d6f6ff" stop-opacity=".5"/><stop offset=".45" stop-color="#7fd4ff" stop-opacity=".1"/><stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="dark" gradientUnits="userSpaceOnUse" cx="600" cy="375" r="560"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".92"/></radialGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1200" height="750" fill="#05070d"/>
  <g id="rock"></g>
  <g id="glow" filter="url(#bloom)" opacity=".75" style="mix-blend-mode:screen"></g>
  <g id="crystals"></g>
  <g id="motes" fill="#dff7ff"></g>
  <rect id="shade" width="1200" height="750" fill="url(#dark)" pointer-events="none"/>
  <circle id="lamp" r="150" fill="url(#halo)" style="mix-blend-mode:screen" pointer-events="none"/>
</svg>
<a class="back" href="index.html">← 100</a>
<div class="cap"><h1>Vaelith<br>Hollow</h1><p>Carry the light</p><em id="read">lumen 0.00 · facets 0</em></div>

<script>
(() => {
  const NS='http://www.w3.org/2000/svg', svg=document.getElementById('cave');
  const mk=(p,t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e; };
  let seed=20; const R=()=>{ seed=(seed*48271)%2147483647; return seed/2147483647; }; const rr=(a,b)=>a+R()*(b-a);
  const facets=[]; // {el, cx, cy, nx, ny, nz, hue, kind}
  const rock=document.getElementById('rock'), cg=document.getElementById('crystals'), gg=document.getElementById('glow');

  // ---- rock wall: jittered triangle grid, carved into a cave mouth
  const cols=17, rows=11, P=[];
  for(let j=0;j<=rows;j++){ P[j]=[]; for(let i=0;i<=cols;i++){ const e=(i===0||i===cols||j===0||j===rows);
    P[j][i]=[i/cols*1200+(e?0:rr(-26,26)), j/rows*750+(e?0:rr(-24,24)), rr(0,1)]; } }
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const a=P[j][i],b=P[j][i+1],c=P[j+1][i+1],d=P[j+1][i];
    (R()<.5?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]]).forEach(t=>{
      const cx=(t[0][0]+t[1][0]+t[2][0])/3, cy=(t[0][1]+t[1][1]+t[2][1])/3;
      const dc=Math.hypot((cx-600)/600,(cy-400)/380);            // 0 centre .. 1+ rim
      const ang=rr(0,6.283), tilt=rr(.25,.8);
      facets.push({el:mk(rock,'polygon',{points:t.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}),cx,cy,
        nx:Math.cos(ang)*tilt,ny:Math.sin(ang)*tilt,nz:Math.sqrt(1-tilt*tilt),hue:rr(205,250),kind:0,depth:Math.max(.12,Math.min(1,dc*1.15))});
    });
  }
  // ---- crystals: faceted prisms growing from floor, ceiling and walls
  function crystal(bx,by,len,wid,ang,hue){
    const g=mk(cg,'g',{}), ca=Math.cos(ang), sa=Math.sin(ang);
    const T=(u,v)=>[bx+u*ca-v*sa, by+u*sa+v*ca];              // u across, v along (negative = outward)
    const sh=len*rr(.72,.82), k=rr(-.25,.25)*wid;
    const L=T(-wid,0), Rr=T(wid,0), M=T(k,0), LS=T(-wid*.92,-sh), RS=T(wid*.92,-sh), MS=T(k,-sh*rr(.96,1.02)), TIP=T(k*.5,-len);
    const add=(pts,nx,ny,nz)=>{ const cx=pts.reduce((a,p)=>a+p[0],0)/pts.length, cy=pts.reduce((a,p)=>a+p[1],0)/pts.length;
      const wx=nx*ca-ny*sa, wy=nx*sa+ny*ca, s=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      const el=mk(g,'polygon',{points:s,'stroke-width':.6,'stroke-linejoin':'round'});
      facets.push({el,cx,cy,nx:wx,ny:wy,nz,hue,kind:1,glow:mk(gg,'polygon',{points:s})}); };
    add([L,M,MS,LS],-.62,.05,.78); add([M,Rr,RS,MS],.62,.05,.78);
    add([LS,MS,TIP],-.5,-.55,.67); add([MS,RS,TIP],.5,-.55,.67);
  }
  const spec=[];
  for(let i=0;i<15;i++) spec.push([rr(40,1160),750+rr(-6,20),rr(90,300),rr(-.45,.45)]);          // floor
  for(let i=0;i<11;i++) spec.push([rr(40,1160),rr(-20,6),rr(70,230),Math.PI+rr(-.4,.4)]);         // ceiling
  for(let i=0;i<5;i++) spec.push([rr(-10,20),rr(200,640),rr(80,200),Math.PI/2+rr(-.5,.3)]);       // left wall
  for(let i=0;i<5;i++) spec.push([rr(1180,1210),rr(200,640),rr(80,200),-Math.PI/2+rr(-.3,.5)]);   // right wall
  // central cluster
  for(let i=0;i<7;i++) spec.push([600+rr(-90,90),640+rr(-10,30),rr(120,330),rr(-.75,.75)]);
  spec.sort((a,b)=>b[2]-a[2]).reverse();
  const HUES=[188,196,172,205,268,286,330,48];
  spec.forEach(s=>{ const hue=HUES[Math.floor(R()*R()*HUES.length)]; crystal(s[0],s[1],s[2],s[2]*rr(.09,.16),s[3],hue+rr(-8,8));
    if(R()<.75) crystal(s[0]+rr(-30,30),s[1],s[2]*rr(.35,.6),s[2]*rr(.05,.08),s[3]+rr(-.5,.5),hue+rr(-14,14)); });
  // motes
  const motes=[], mg=document.getElementById('motes');
  for(let i=0;i<46;i++) motes.push({el:mk(mg,'circle',{r:rr(.6,1.9)}),x:rr(0,1200),y:rr(0,750),p:rr(0,6.28),s:rr(.1,.45)});

  // ---- lighting
  const lamp=document.getElementById('lamp'), shade=document.getElementById('dark'), read=document.getElementById('read');
  let lx=600, ly=380, tx=600, ty=380, auto=true, t=0, dirty=true;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function toSvg(e){ const m=svg.getScreenCTM(); if(!m) return; const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(m.inverse());
    tx=Math.max(0,Math.min(1200,q.x)); ty=Math.max(0,Math.min(750,q.y)); auto=false; }
  svg.addEventListener('pointermove',toSvg); svg.addEventListener('pointerdown',toSvg);
  addEventListener('keydown',e=>{ const d={ArrowLeft:[-40,0],ArrowRight:[40,0],ArrowUp:[0,-40],ArrowDown:[0,40]}[e.key]; if(d){ tx=Math.max(0,Math.min(1200,tx+d[0])); ty=Math.max(0,Math.min(750,ty+d[1])); auto=false; } });

  const LZ=150;
  function light(){
    let lit=0, sum=0;
    for(const f of facets){
      const dx=lx-f.cx, dy=ly-f.cy, d2=dx*dx+dy*dy+LZ*LZ, d=Math.sqrt(d2);
      const ndl=Math.max(0,(f.nx*dx+f.ny*dy+f.nz*LZ)/d);
      const att=1/(1+d2/(f.kind?90000:52000));
      if(f.kind){
        // specular: reflect light about normal, compare with viewer (0,0,1)
        const dot=(f.nx*dx+f.ny*dy+f.nz*LZ)/d, rz=2*dot*f.nz-LZ/d, spec=Math.pow(Math.max(0,rz),14);
        // refraction: hue slides with angle of incidence — crude dispersion
        const hue=f.hue+(1-ndl)*46*Math.sign(f.nx||1)+Math.atan2(dy,dx)*9;
        const I=Math.min(1,ndl*att*1.5);
        const lgt=7+I*56+spec*att*38, sat=78-spec*att*45;
        f.el.setAttribute('fill','hsl('+hue.toFixed(0)+','+sat.toFixed(0)+'%,'+Math.min(96,lgt).toFixed(1)+'%)');
        f.el.setAttribute('stroke','hsla('+hue.toFixed(0)+',90%,'+(30+I*55).toFixed(0)+'%,'+(.25+I*.6).toFixed(2)+')');
        const gl=Math.max(0,I-.42)*1.7+spec*att;
        f.glow.setAttribute('fill','hsla('+hue.toFixed(0)+',100%,62%,'+Math.min(.9,gl).toFixed(2)+')');
        if(I>.35) lit++; sum+=I;
      } else {
        const I=ndl*att*f.depth;
        f.el.setAttribute('fill','hsl('+f.hue.toFixed(0)+','+(22+I*20).toFixed(0)+'%,'+(2.5+f.depth*3+I*30).toFixed(1)+'%)');
      }
    }
    lamp.setAttribute('cx',lx); lamp.setAttribute('cy',ly);
    shade.setAttribute('cx',lx); shade.setAttribute('cy',ly);
    read.textContent='lumen '+(sum/facets.length*10).toFixed(2)+' · '+lit+' facets awake';
  }
  function frame(){
    t+=.016;
    if(auto&&!reduce){ tx=600+Math.cos(t*.42)*380; ty=390+Math.sin(t*.63)*190; }
    const ox=lx, oy=ly; lx+=(tx-lx)*.14; ly+=(ty-ly)*.14;
    if(dirty||Math.abs(lx-ox)+Math.abs(ly-oy)>.05){ light(); dirty=false; }
    if(!reduce||t<.05) for(const m of motes){ m.y-=m.s; m.x+=Math.sin(t+m.p)*.25; if(m.y<-5){ m.y=755; m.x=rr(0,1200); }
      const d=Math.hypot(m.x-lx,m.y-ly); m.el.setAttribute('cx',m.x.toFixed(1)); m.el.setAttribute('cy',m.y.toFixed(1)); m.el.setAttribute('opacity',Math.max(0,.85-d/330).toFixed(2)); }
    lamp.setAttribute('r',(150+Math.sin(t*9)*4+Math.sin(t*23)*2).toFixed(1));
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
