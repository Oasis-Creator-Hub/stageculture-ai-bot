<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hedgerow Oracle — a three-card reading</title>
<meta name="description" content="Draw three cards from a deck of twelve invented arcana. Flip them in 3D, read the root, stem and bloom, and receive a generated interpretation.">
<style>
  :root{--felt:#1d3a2c;--ivory:#efe5cc;--ink:#1d1a16;--verm:#c2402a;--gold:#c79a3c;--cw:min(27vw,210px)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#12261c}
  body{font-family:"Hoefler Text","Baskerville","Libre Baskerville","Palatino Linotype",Georgia,serif;color:var(--ivory);overflow-x:hidden;
    background:radial-gradient(ellipse 70% 55% at 50% 34%,#2c5a43 0,rgba(44,90,67,0) 70%),radial-gradient(ellipse at 50% 120%,#0a1710,transparent 60%),var(--felt)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(37deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),repeating-linear-gradient(-53deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px)}
  .candle{position:fixed;left:50%;top:-18vh;width:120vmax;height:80vh;transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,196,110,.16),transparent);animation:flick 5s ease-in-out infinite}
  @keyframes flick{0%,100%{opacity:.8}23%{opacity:1}31%{opacity:.7}58%{opacity:.95}77%{opacity:.75}}
  header{position:relative;text-align:center;padding:clamp(22px,4vh,44px) 16px 0}
  header p{margin:0;font-size:11px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold)}
  h1{margin:.2em 0 0;font-weight:400;font-size:clamp(30px,5.4vw,60px);letter-spacing:.02em;font-style:italic}
  h1::after{content:"";display:block;width:120px;height:9px;margin:12px auto 0;
    background:linear-gradient(var(--gold),var(--gold)) center/100% 1px no-repeat,radial-gradient(circle,var(--verm) 3.4px,transparent 4px) center/12px 9px no-repeat}
  .spread{position:relative;display:flex;justify-content:center;gap:clamp(8px,3vw,44px);padding:clamp(22px,4vh,44px) 10px 0}
  .slot{width:var(--cw);text-align:center}
  .slot h2{margin:0 0 10px;font-size:clamp(10px,1.2vw,13px);font-weight:400;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .slot h2 span{display:block;letter-spacing:.02em;text-transform:none;font-style:italic;color:rgba(239,229,204,.62);font-size:1.02em;margin-top:3px}
  .card{width:100%;aspect-ratio:200/340;perspective:1100px;cursor:pointer;border:0;padding:0;background:none;display:block;
    animation:deal .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*.16s);-webkit-tap-highlight-color:transparent}
  @keyframes deal{from{transform:translate(calc((1 - var(--i))*60%),-90vh) rotate(calc(18deg - var(--i)*14deg));opacity:0}to{transform:none;opacity:1}}
  .inner,.side{display:block}
  .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.5,-.2,.2,1.25)}
  .card:hover .inner,.card:focus-visible .inner{transform:translateY(-6px) rotateY(-8deg)}
  .card.up .inner{transform:rotateY(180deg)}
  .side{position:absolute;inset:0;border-radius:4.5%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 14px 26px rgba(0,0,0,.45),0 2px 3px rgba(0,0,0,.4)}
  .face{transform:rotateY(180deg);background:var(--ivory)}
  .side svg{display:block;width:100%;height:100%}
  .face.rev svg{transform:rotate(180deg)}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:8px}
  .ln{fill:none;stroke:#1d1a16;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .vf{fill:#c2402a}.gf{fill:#c79a3c}.kf{fill:#1d1a16}
  .tag{margin-top:10px;min-height:2.4em;font-size:clamp(11px,1.3vw,14px);font-style:italic;color:rgba(239,229,204,.8);opacity:0;transition:opacity .8s .5s}
  .card.up+.tag{opacity:1}
  .tag b{font-style:normal;font-weight:400;color:var(--verm);letter-spacing:.14em;text-transform:uppercase;font-size:.8em}
  .ledger{position:relative;max-width:660px;margin:clamp(22px,4vh,40px) auto 0;padding:0 22px;text-align:center;min-height:13em}
  .hint{font-style:italic;color:rgba(239,229,204,.62);font-size:15px;transition:opacity .5s}
  .reading{text-align:left;background:linear-gradient(#f1e8d1,#e6dabc);color:#2a241c;padding:26px clamp(20px,4vw,38px) 24px;
    box-shadow:0 18px 40px rgba(0,0,0,.4);position:relative;border-radius:2px}
  .reading::before{content:"";position:absolute;inset:7px;border:1px solid rgba(160,110,40,.5);pointer-events:none}
  .reading p{margin:0 0 .85em;font-size:clamp(14.5px,1.5vw,17px);line-height:1.55;opacity:0;transform:translateY(8px);animation:ink .9s ease forwards;animation-delay:calc(var(--n)*.55s)}
  .reading p b{font-weight:400;font-variant:small-caps;letter-spacing:.08em;color:#a8321f}
  .reading p.last{font-style:italic;border-top:1px solid rgba(160,110,40,.45);padding-top:.85em;margin-bottom:0}
  @keyframes ink{to{opacity:1;transform:none}}
  .bar{display:flex;justify-content:center;gap:22px;align-items:center;padding:26px 16px 34px;position:relative}
  button.again{font:inherit;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ivory);background:none;border:1px solid var(--gold);padding:11px 20px 10px;cursor:pointer;border-radius:99px}
  button.again:hover{background:var(--gold);color:#1a1509}
  .bar a{color:rgba(239,229,204,.6);font-size:12px;letter-spacing:.2em;text-decoration:none}
  .bar a:hover{color:var(--ivory)}
  @media (max-width:520px){:root{--cw:29vw}.slot h2{letter-spacing:.18em}.slot h2 span{display:none}}
  @media (prefers-reduced-motion:reduce){.candle,.card{animation:none}.inner{transition:none}.reading p{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="candle"></div>
<header><p>Twelve invented arcana</p><h1>The Hedgerow Oracle</h1></header>
<main>
  <div class="spread" id="spread"></div>
  <div class="ledger" id="ledger" aria-live="polite"><p class="hint" id="hint">Hold a question loosely. Turn the cards, left to right or as you please.</p></div>
  <div class="bar"><button class="again" id="again" type="button">Gather &amp; redraw</button><a href="index.html">← 100</a></div>
</main>
<script>
(() => {
  const rays = (cx, cy, r1, r2, n, o = 0) => Array.from({ length: n }, (_, i) => { const a = o + i / n * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    return `M${(cx + c * r1).toFixed(1)} ${(cy + s * r1).toFixed(1)}L${(cx + c * r2).toFixed(1)} ${(cy + s * r2).toFixed(1)}`; }).join('');
  const waves = (y, c = 'ln') => `<path class="${c}" d="M2 ${y}q9-10 19 0t19 0 19 0 19 0 19 0 19 0"/>`;
  const DECK = [
    { n: '0', name: 'The Lamplighter', theme: 'tending small lights', up: 'You kept something burning that others had written off, and it is still giving light.', rev: 'You have been lighting other people’s windows and leaving your own dark.',
      art: `<circle class="gf" cx="60" cy="42" r="30" opacity=".28"/><path class="ln" d="${rays(60, 42, 34, 44, 12)}"/><path class="ln" d="M60 150V58M44 150h32M52 150l8-14 8 14"/><path class="gf ln" d="M47 58h26l-5-30H52z"/><path class="kf" d="M44 28h32L60 12z"/><path class="vf" d="M60 34q7 9 0 18-7-9 0-18z"/><path class="ln" d="M60 96h20M80 92v8"/>` },
    { n: 'I', name: 'The Salt Road', theme: 'the long way round', up: 'The slow route is the one that actually arrives; trust the distance already under your feet.', rev: 'You keep to this road mostly because you have walked so much of it already.',
      art: `<circle class="vf" cx="60" cy="42" r="17"/><path class="ln" d="${rays(60, 42, 22, 30, 16)}"/><path class="ln" d="M0 74Q30 54 60 74T120 74"/><path class="gf ln" d="M54 74C30 96 84 104 56 122S24 140 36 150H92C64 140 110 124 86 108S60 88 66 74z"/><path class="ln" stroke-dasharray="1 7" d="M60 78C44 98 92 106 70 124S50 142 62 150"/><path class="kf" d="M14 100l5-12 5 12zM100 96l4-10 4 10z"/>` },
    { n: 'II', name: 'The Empty Chair', theme: 'room being made', up: 'A place is being held for you. It is yours to take without asking twice.', rev: 'You are waiting for an invitation that was never going to be written down.',
      art: `<path class="ln" d="M38 34v70M82 34v70M38 34Q60 22 82 34M38 52h44M38 70h44"/><path class="gf ln" d="M30 104h60l7 13H23z"/><path class="ln" d="M27 117v33M93 117v33M42 117v22M78 117v22"/><path class="vf" d="M60 4l3.5 7.5 8 .8-6 5.4 1.8 8L60 21.6l-7.3 4.1 1.8-8-6-5.4 8-.8z"/><path class="ln" stroke-dasharray="2 5" d="M60 30v62"/>` },
    { n: 'III', name: 'The Ninth Wave', theme: 'the surge that breaks the pattern', up: 'What feels like too much is the very thing that carries you over the bar.', rev: 'You are still bracing against a wave that passed some time ago.',
      art: `<circle class="gf" cx="26" cy="26" r="10"/><path class="kf" d="${Array.from({ length: 9 }, (_, i) => `M${44 + i * 8} 14a1.6 1.6 0 1 0 .01 0z`).join('')}"/><path class="vf" d="M8 118C16 54 70 30 98 54 72 46 44 72 48 118z"/><path class="ln" stroke-width="3" d="M8 118C16 54 70 30 98 54c11 10 5 27-10 25-11-2-13-15-4-19"/><path class="ln" d="M22 110c4-24 18-42 38-50M34 114c2-18 10-32 24-40"/>${waves(128)}${waves(141)}` },
    { n: 'IV', name: 'The Orchard Key', theme: 'patient access', up: 'The gate opens in season, and the season is nearer than it looks.', rev: 'You are forcing a lock that only ripeness will turn.',
      art: `<circle class="gf ln" cx="60" cy="42" r="30"/><circle class="ln" cx="60" cy="42" r="17" fill="#efe5cc"/><circle class="vf" cx="42" cy="26" r="5"/><circle class="vf" cx="80" cy="30" r="5"/><circle class="vf" cx="60" cy="68" r="5"/><path class="ln" stroke-width="5" d="M60 72v72"/><path class="ln" stroke-width="4" d="M60 112h14M60 126h22M60 140h16"/><path class="kf" d="M60 30q-10 6-8 16 10-4 8-16zM60 30q10 6 8 16-10-4-8-16z"/>` },
    { n: 'V', name: 'The Moth', theme: 'honest wanting', up: 'Your longing is a compass. Follow it without apology.', rev: 'Be honest about which flames you circle, and what the circling costs.',
      art: `<path class="vf" d="M60 2q9 11 0 22-9-11 0-22z"/><g id="w"><path class="gf ln" d="M58 64C30 22 0 42 12 74c7 15 30 14 46 4z"/><path class="vf ln" d="M56 84C36 88 22 108 34 122c11 9 21-9 23-25z"/><circle class="ln" cx="30" cy="58" r="7"/><circle class="kf" cx="30" cy="58" r="3"/><path class="ln" d="M60 56q-8-17-19-19"/></g><use href="#w" transform="translate(120 0) scale(-1 1)"/><ellipse class="kf" cx="60" cy="80" rx="4.5" ry="24"/><path class="ln" stroke-dasharray="1 6" d="M60 110v36"/>` },
    { n: 'VI', name: 'The Cartographer', theme: 'naming the ground', up: 'Draw the map of what is actually there, not of what was promised.', rev: 'You have been studying the map to avoid setting foot on the land.',
      art: `<circle class="ln" cx="60" cy="78" r="50"/><circle class="ln" cx="60" cy="78" r="40" stroke-dasharray="2 4"/><path class="vf ln" d="M60 78l24-24-10 24 10 24-24-10-24 10 10-24-10-24z"/><path class="gf ln" d="M60 26l9 43 43 9-43 9-9 43-9-43-43-9 43-9z"/><circle class="kf" cx="60" cy="78" r="4"/><path class="ln" d="M56 18V4l8 9V4"/>` },
    { n: 'VII', name: 'The Sleeping Bell', theme: 'the unrung truth', up: 'Something unsaid is ready to be rung — quietly, and once.', rev: 'Your silence has stopped being peace and become storage.',
      art: `<path class="vf" d="M96 12a13 13 0 1 0 10 22 16 16 0 0 1-10-22z"/><path class="ln" d="M50 34q10-18 20 0"/><path class="gf ln" d="M60 32c-23 0-29 26-29 52 0 14-8 20-11 28h80c-3-8-11-14-11-28 0-26-6-52-29-52z"/><path class="ln" d="M44 78q16 12 32 0M47 83l-3 6M60 86v7M73 83l3 6M24 112h72"/><circle class="kf" cx="60" cy="124" r="7"/><path class="ln" d="M14 40h8l-8 9h8M22 20h6l-6 7h6"/>${waves(146)}` },
    { n: 'VIII', name: 'The Weaver’s Knot', theme: 'visible mending', up: 'The mend will show, and it will be stronger than the cloth around it.', rev: 'You are re-tying a knot that wants, kindly, to be cut.',
      art: `<path class="ln" d="M4 20Q30 50 42 62M116 20Q90 50 78 62M4 136q26-28 38-42M116 136Q90 108 78 94"/><circle cx="46" cy="78" r="27" fill="none" stroke="#c2402a" stroke-width="7"/><circle cx="74" cy="78" r="27" fill="none" stroke="#c79a3c" stroke-width="7"/><path d="M47 51a27 27 0 0 1 26 27" fill="none" stroke="#c2402a" stroke-width="7"/><path class="ln" d="M60 38l40 40-40 40-40-40z"/><path class="ln" stroke-width="3" d="M90 132L30 22"/><circle class="ln" cx="33" cy="27" r="2.5"/>` },
    { n: 'IX', name: 'The Tide Clock', theme: 'another clock', up: 'You are not late. You are simply keeping different hours.', rev: 'Waiting for the perfect hour has become its own way of refusing.',
      art: `<circle class="ln" cx="60" cy="70" r="44"/><path class="ln" d="${rays(60, 70, 37, 44, 12)}"/><path class="ln" stroke-width="3.5" d="M60 70V40M60 70l20 12"/><circle class="vf" cx="60" cy="70" r="5"/>${[0, 1, 2, 3, 4].map(i => { const a = Math.PI * (1.18 + i * .16), x = 60 + Math.cos(a) * 58, y = 70 + Math.sin(a) * 58; return `<circle class="ln" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="#efe5cc"/><path class="gf" d="M${x.toFixed(1)} ${(y - 6).toFixed(1)}a${[6, 3, .01, 3, 6][i]} 6 0 0 ${i < 2 ? 0 : 1} 0 12a6 6 0 0 ${i < 2 ? 1 : 0} 0-12z"/>`; }).join('')}<path class="vf" d="M2 150v-18q9-10 19 0t19 0 19 0 19 0 19 0 19 0v18z"/>${waves(132)}` },
    { n: 'X', name: 'The Hollow Oak', theme: 'shelter in what was struck', up: 'The place that was damaged is exactly where something can now live.', rev: 'You have made a home inside an old injury. It may be time to step out.',
      art: `<path class="ln" fill="#efe5cc" d="M22 74C4 48 26 18 50 26 56 4 92 6 94 30c26 0 30 40 6 48z"/><path class="vf" d="${[[34, 44], [52, 36], [70, 26], [84, 46], [62, 54], [42, 62], [92, 62], [74, 66]].map(p => `M${p[0]} ${p[1]}q6-7 12 0-6 7-12 0z`).join('')}"/><path class="gf ln" d="M42 150c6-30 2-52-6-76h48c-8 24-12 46-6 76z"/><ellipse class="kf" cx="60" cy="112" rx="9" ry="15"/><circle class="gf" cx="60" cy="116" r="3.5"/><path class="ln" d="M42 150q-10-6-22-4M78 150q10-6 22-4"/>` },
    { n: 'XI', name: 'The Second Sun', theme: 'unreasonable hope', up: 'Allow the unlikely good thing to be possible. It has not asked your permission.', rev: 'A borrowed brightness is keeping you from seeing by your own.',
      art: `<path class="ln" d="${rays(46, 60, 31, 42, 14)}"/><circle class="gf ln" cx="46" cy="60" r="26"/><path class="ln" d="${rays(92, 30, 16, 23, 10, .3)}"/><circle class="vf" cx="92" cy="30" r="13"/><path class="ln" d="M36 56q4-5 8 0M50 56q4-5 8 0M38 68q8 7 16 0"/><path class="ln" d="M0 112h120"/><path class="ln" stroke-dasharray="8 6" d="M20 124h80M34 136h52M46 148h28"/><path class="kf" d="M60 112l-3-16h6z"/><path class="ln" d="M60 112l-26 30M60 112l8 34"/>` }
  ];
  const corner = `<path class="ln" stroke-width="1.4" d="M20 46V30q0-10 10-10h16M20 34q8 0 8-8M26 46q0-14 14-14"/><circle class="vf" cx="31" cy="31" r="2.6"/>`;
  const faceSVG = c => `<svg viewBox="0 0 200 340" role="img" aria-label="${c.name}">
    <rect width="200" height="340" fill="#efe5cc"/><rect x="8" y="8" width="184" height="324" rx="7" class="ln" stroke-width="2.4"/><rect x="13" y="13" width="174" height="314" rx="4" class="ln" stroke-width=".8"/>
    ${corner}<g transform="translate(200 0) scale(-1 1)">${corner}</g><g transform="translate(0 340) scale(1 -1)">${corner}</g><g transform="translate(200 340) scale(-1 -1)">${corner}</g>
    <text x="100" y="42" text-anchor="middle" font-size="19" font-family="Georgia,serif" fill="#c2402a" letter-spacing="3">${c.n}</text>
    <path class="ln" stroke-width="1" d="M64 50h72"/>
    <g transform="translate(28 62) scale(1.2)">${c.art}</g>
    <path class="gf" d="M22 262h156l-9 11 9 11H22l9-11z"/><path class="ln" stroke-width="1" d="M22 262h156l-9 11 9 11H22l9-11z"/>
    <text x="100" y="278.5" text-anchor="middle" font-size="13.5" font-family="Georgia,serif" fill="#1d1a16" letter-spacing="1.3" textLength="${Math.min(128, c.name.length * 8.4)}" lengthAdjust="spacingAndGlyphs">${c.name.toUpperCase()}</text>
    <text x="100" y="306" text-anchor="middle" font-size="11" font-style="italic" font-family="Georgia,serif" fill="#5b4a2e">${c.theme}</text></svg>`;
  const backSVG = `<svg viewBox="0 0 200 340" aria-hidden="true"><defs><pattern id="lat" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M10 0l10 10-10 10L0 10z" fill="none" stroke="#c79a3c" stroke-width=".9"/><circle cx="10" cy="10" r="1.5" fill="#c79a3c"/></pattern></defs>
    <rect width="200" height="340" fill="#8f2a1d"/><rect x="14" y="14" width="172" height="312" fill="url(#lat)" opacity=".8"/>
    <rect x="8" y="8" width="184" height="324" rx="7" fill="none" stroke="#c79a3c" stroke-width="2.4"/><rect x="14" y="14" width="172" height="312" rx="3" fill="none" stroke="#c79a3c" stroke-width="1"/>
    <circle cx="100" cy="170" r="52" fill="#8f2a1d" stroke="#c79a3c" stroke-width="2"/><path d="${rays(100, 170, 34, 48, 24)}" stroke="#c79a3c" stroke-width="1.6"/>
    <path d="M66 170q34-30 68 0-34 30-68 0z" fill="#efe5cc" stroke="#c79a3c" stroke-width="1.6"/><circle cx="100" cy="170" r="11" fill="#1d3a2c"/><circle cx="100" cy="170" r="4.5" fill="#c79a3c"/>
    <path d="M100 40l9 16-9 16-9-16zM100 268l9 16-9 16-9-16z" fill="#c79a3c"/></svg>`;

  const POS = [['Root', 'what brought you here'], ['Stem', 'what holds you now'], ['Bloom', 'what is opening']];
  const ACTS = ['Write the question on paper and put it somewhere you will find it in a month.', 'Leave one thing unfinished on purpose tonight, and notice that the roof stays on.', 'Tell one person the true version, the short one.',
    'Walk the long way home once this week and decide nothing while you do.', 'Return something borrowed — an object, a favour, an opinion.', 'Light a real candle for an ordinary dinner.'];
  const spread = document.getElementById('spread'), ledger = document.getElementById('ledger'), hint = document.getElementById('hint');
  let draw = [], busy = false;

  function deal() {
    const pool = DECK.map((_, i) => i).sort(() => Math.random() - .5).slice(0, 3);
    draw = pool.map(i => ({ c: DECK[i], rev: Math.random() < .3, up: false }));
    spread.innerHTML = draw.map((d, i) => `<div class="slot"><h2>${POS[i][0]}<span>${POS[i][1]}</span></h2>
      <button class="card" style="--i:${i}" data-i="${i}" type="button" aria-label="${POS[i][0]} card, face down. Turn it over.">
        <span class="inner"><span class="side back">${backSVG}</span><span class="side face${d.rev ? ' rev' : ''}">${faceSVG(d.c)}</span></span></button>
      <div class="tag">${d.c.name}${d.rev ? '<br><b>reversed</b>' : ''}</div></div>`).join('');
    ledger.innerHTML = ''; ledger.appendChild(hint); hint.style.opacity = 1;
  }

  function interpret() {
    const lead = ['What brought you here', 'What holds you now', 'What is opening'];
    const revs = draw.filter(d => d.rev), key = draw.reduce((s, d) => s + DECK.indexOf(d.c) * 7 + (d.rev ? 3 : 0), 0);
    const tally = [
      'All three stand upright: nothing in this spread is asking to be fixed, only followed.',
      `One card arrives reversed — ${revs[0] && revs[0].c.name}. That is the place where the reading asks for honesty rather than effort.`,
      'Two reversals. The deck suggests less pushing and more setting down.',
      'Every card reversed. Consider turning the question over too; you may be asking it upside down.'][revs.length];
    const ps = draw.map((d, i) => `<p style="--n:${i}"><b>${lead[i]} — ${d.c.name}${d.rev ? ', reversed' : ''}.</b> ${d.rev ? d.c.rev : d.c.up}</p>`);
    ps.push(`<p style="--n:3">Read as one sentence, the spread moves from ${draw[0].c.theme}, through ${draw[1].c.theme}, toward ${draw[2].c.theme}. ${tally}</p>`);
    ps.push(`<p class="last" style="--n:4">A small act for today: ${ACTS[key % ACTS.length]}</p>`);
    ledger.innerHTML = `<div class="reading">${ps.join('')}</div>`;
  }

  spread.addEventListener('click', e => {
    const btn = e.target.closest('.card'); if (!btn || busy) return;
    const d = draw[+btn.dataset.i]; if (d.up) return;
    d.up = true; btn.classList.add('up');
    btn.setAttribute('aria-label', `${POS[+btn.dataset.i][0]}: ${d.c.name}${d.rev ? ', reversed' : ''}`);
    hint.style.opacity = 0;
    if (draw.every(x => x.up)) setTimeout(interpret, 900);
  });
  document.getElementById('again').addEventListener('click', () => {
    if (busy) return; busy = true;
    spread.querySelectorAll('.card').forEach(c => c.classList.remove('up'));
    setTimeout(() => { busy = false; deal(); }, draw.some(d => d.up) ? 700 : 0);
  });
  deal();
})();
</script>
</body>
</html>
