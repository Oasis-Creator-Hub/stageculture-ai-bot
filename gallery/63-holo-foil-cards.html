<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prismfolk — Series One Holo Rares</title>
<meta name="description" content="Six iridescent holographic foil collector cards of original abstract creatures. Tilt them in 3D with your pointer, finger or device gyroscope and watch the foil shift.">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#17181d;min-height:100vh;
  background:linear-gradient(180deg,#f4f2f7 0,#dcdbe4 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 1px,transparent 1px 3px);opacity:.5}
header{position:relative;padding:clamp(28px,6vw,72px) clamp(16px,5vw,64px) 0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;max-width:1240px;margin:0 auto}
h1{font-family:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;font-weight:800;font-size:clamp(52px,11vw,150px);line-height:.82;margin:0;letter-spacing:-.03em;text-transform:uppercase;
  background:linear-gradient(100deg,#ff5d8f,#ffb23e 22%,#6fe38c 44%,#39c6f2 66%,#8d6bff 88%,#ff5d8f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 9s linear infinite}
@keyframes slide{to{background-position:200% 0}}
.sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;border-top:2px solid #17181d;padding-top:10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.sub span:last-child{color:#6a6b78}
#gyro{font:inherit;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:2px solid #17181d;background:#17181d;color:#fff;border-radius:99px;padding:10px 16px;cursor:pointer;align-self:end;margin-bottom:6px}
#gyro[hidden]{display:none}
main{max-width:1240px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,5vw,64px) 90px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(28px,4.5vw,60px);justify-items:center}
.slot{perspective:900px;width:100%;max-width:310px}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--o:.35;--px:50%;--py:50%;position:relative;aspect-ratio:5/7;border-radius:4.2% / 3%;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .4s;will-change:transform;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:var(--c1);padding:4.5%;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 22px 30px -14px rgba(30,20,60,.45),0 2px 4px rgba(0,0,0,.3);overflow:hidden;color:#fff}
.card.live{transition:none;box-shadow:0 40px 50px -20px rgba(30,20,60,.5),0 2px 4px rgba(0,0,0,.3)}
.inner{position:relative;height:100%;border-radius:3%/2.2%;background:linear-gradient(160deg,var(--c2),var(--c3));display:flex;flex-direction:column;padding:5% 5% 4%;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.name{font-family:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;font-weight:800;font-size:clamp(20px,6.6cqw,26px);letter-spacing:.01em;text-transform:uppercase}
.slot{container-type:inline-size}
.lus{font-size:11px;font-weight:800;letter-spacing:.06em;white-space:nowrap}.lus b{font-size:19px}
.art{position:relative;margin:4% 0 3%;aspect-ratio:4/3;border-radius:6px;background:radial-gradient(circle at 50% 60%,var(--c4),#0b0c14 85%);box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 0 4px rgba(0,0,0,.35);overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.type{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;background:rgba(0,0,0,.35);border-radius:99px;padding:3px 10px;align-self:flex-start}
.trait{margin-top:5%;font-size:12px;line-height:1.3}
.trait b{display:flex;justify-content:space-between;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em}
.trait+.trait{margin-top:3.5%;padding-top:3.5%;border-top:1px solid rgba(255,255,255,.3)}
.flav{margin-top:auto;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:11px;line-height:1.35;opacity:.92;border-left:2px solid rgba(255,255,255,.6);padding-left:8px}
.foot{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.12em;margin-top:3%;opacity:.85;font-weight:700}
.foil,.glare{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.foil{mix-blend-mode:color-dodge;opacity:var(--o);background-position:var(--px) var(--py);background-size:300% 300%;transition:opacity .4s;
  background-image:repeating-linear-gradient(112deg,#ff2d6f 0,#ffc93e 9%,#4dff8a 18%,#28d7ff 27%,#6a4dff 36%,#ff2de1 45%,#ff2d6f 54%)}
.card[data-f=cosmos] .foil{background-image:radial-gradient(circle,#fff 0 6%,transparent 7%),radial-gradient(circle,#fff 0 4%,transparent 5%),repeating-linear-gradient(60deg,#ff4d9a 0,#ffe24d 12%,#3dffd0 24%,#4d7bff 36%,#ff4d9a 48%);
  background-size:38px 38px,23px 23px,260% 260%;background-position:var(--px) var(--py),calc(100% - var(--px)) var(--py),var(--px) var(--py)}
.card[data-f=weave] .foil{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(0,0,0,.6) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,#00e5ff 0,#b84dff 14%,#ff4d6a 28%,#ffd34d 42%,#00e5ff 56%);
  background-size:auto,auto,300% 300%;background-position:0 0,0 0,var(--px) var(--py)}
.card[data-f=rings] .foil{background-image:repeating-radial-gradient(circle at var(--mx) var(--my),#ff3d81 0,#ffd23d 6%,#3dff9e 12%,#3db8ff 18%,#a03dff 24%,#ff3d81 30%);background-size:100% 100%}
.glare{background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.75),rgba(255,255,255,.12) 28%,transparent 60%);mix-blend-mode:overlay;opacity:calc(var(--o)*1.5)}
.rar{position:absolute;right:6%;bottom:11%;width:26px;height:26px;transform:translateZ(30px)}
footer{max-width:1240px;margin:0 auto;padding:0 clamp(16px,5vw,64px) 40px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6a6b78;font-weight:700;gap:16px;flex-wrap:wrap}
footer a{color:#17181d;text-decoration:none;border-bottom:2px solid}
@media(prefers-reduced-motion:reduce){h1{animation:none}.card{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Prism&shy;folk</h1>
  <button id="gyro" hidden>Enable tilt sensor</button>
  <div class="sub"><span>Series One · Holo Rares · 6 of 6</span><span>Tilt a card — pointer, finger or gyroscope</span></div>
</header>
<main id="deck"></main>
<footer><a href="index.html">← 100</a><span>Printed on light. Not for resale in the Umbral Reaches.</span></footer>
<script>
(function(){
const C=[
 {n:'Lumoth',l:70,f:'linear',c:['#f3c14b','#b0562d','#5a1f3c','#e8793a'],t:'Dusk · Winged',a:['Lantern Drift','Circles the nearest light source and refuses to explain why.'],b:['Powder Veil','Leaves a soft gold fog on everything you own.'],q:'It mistook the moon for a porch lamp, and has been embarrassed ever since.',
  s:'<g fill="none" stroke="#ffe9a8" stroke-width="2"><path d="M96 52q-10-26-24-22M104 52q10-26 24-22"/></g><g stroke="#2a0f1e" stroke-width="2"><path d="M98 62L30 30 22 78 70 86Z" fill="#ffcf5a"/><path d="M102 62l68-32 8 48-48 8Z" fill="#ffcf5a"/><path d="M96 84L48 96l14 34 34-22Z" fill="#ff8a4d"/><path d="M104 84l48 12-14 34-34-22Z" fill="#ff8a4d"/><ellipse cx="100" cy="84" rx="9" ry="34" fill="#5a1f3c"/><circle cx="46" cy="58" r="11" fill="#5a1f3c"/><circle cx="154" cy="58" r="11" fill="#5a1f3c"/><circle cx="46" cy="58" r="4" fill="#fff"/><circle cx="154" cy="58" r="4" fill="#fff"/></g>'},
 {n:'Quartzel',l:90,f:'cosmos',c:['#8de0ff','#2a6bb0','#162a5c','#39b6e8'],t:'Deep · Crystalline',a:['Facet Coil','Wraps a problem seven times and squeezes until it clarifies.'],b:['Cold Refraction','Splits one bad idea into a spectrum of worse ones.'],q:'Found in flooded mines, humming one long note the rock remembers.',
  s:'<g stroke="#0c1a3a" stroke-width="2" stroke-linejoin="round"><path d="M20 108l12-12 12 12-12 12Z" fill="#bff0ff"/><path d="M40 92l14-14 14 14-14 14Z" fill="#8de0ff"/><path d="M64 74l16-16 16 16-16 16Z" fill="#bff0ff"/><path d="M92 62l17-17 17 17-17 17Z" fill="#6ac8f5"/><path d="M122 70l18-18 18 18-18 18Z" fill="#bff0ff"/><path d="M146 92l24-30 22 30-22 26Z" fill="#fff"/><circle cx="174" cy="88" r="4" fill="#0c1a3a"/><path d="M80 58v32M109 45v34M140 52v36M170 62v56" opacity=".35"/></g>'},
 {n:'Tidewisp',l:60,f:'rings',c:['#9af0d2','#1f8f8a','#0d3b4f','#34c7a6'],t:'Brine · Drifting',a:['Slack Water','Does nothing, beautifully, for one full turn.'],b:['Thousand Threads','Each tentacle signs a different apology.'],q:'Sailors steer by them. Sailors are frequently lost.',
  s:'<g stroke="#062431" stroke-width="2"><path d="M52 78a48 44 0 0 1 96 0q-12 10-24 0-12 10-24 0-12 10-24 0-12 10-24 0Z" fill="#b6ffe6"/><g fill="none" stroke="#b6ffe6" stroke-width="3" stroke-linecap="round"><path d="M66 90q-10 16 0 28t-4 26M88 90q8 18-2 30t4 24M112 90q-8 18 2 30t-4 24M134 90q10 16 0 28t4 26"/></g><circle cx="84" cy="62" r="5" fill="#062431"/><circle cx="116" cy="62" r="5" fill="#062431"/><circle cx="100" cy="46" r="3" fill="#fff" stroke="none"/><circle cx="72" cy="52" r="2" fill="#fff" stroke="none"/><circle cx="130" cy="54" r="2.5" fill="#fff" stroke="none"/></g>'},
 {n:'Emberhorn',l:110,f:'weave',c:['#ff8f6b','#b3263c','#3b0f24','#ff5a3c'],t:'Cinder · Armoured',a:['Kiln Charge','Runs in a straight line. The line is always through something.'],b:['Slag Plate','Wears yesterday’s damage as today’s armour.'],q:'Its horn is warm to the touch. So, briefly, are you.',
  s:'<g stroke="#26060f" stroke-width="2" stroke-linejoin="round"><path d="M92 54Q70 14 44 30q22 2 32 30ZM108 54q22-40 48-24-22 2-32 30Z" fill="#ffd27a"/><path d="M100 46l34 20v40l-34 22-34-22V66Z" fill="#ff6a45"/><path d="M100 46v82M66 86h68" fill="none" opacity=".5"/><g fill="none" stroke="#ffd27a" stroke-width="3" stroke-linecap="round"><path d="M66 72L40 64M66 90l-30 4M68 106l-24 18M134 72l26-8M134 90l30 4M132 106l24 18"/></g><circle cx="88" cy="68" r="4" fill="#fff"/><circle cx="112" cy="68" r="4" fill="#fff"/></g>'},
 {n:'Mossling',l:50,f:'cosmos',c:['#cfe86a','#5c8a2d','#1f3a1c','#8fc23f'],t:'Loam · Patient',a:['Take Root','Sits on the objective until the objective gives up.'],b:['Spore Rumour','Spreads to adjacent cards overnight. Check your binder.'],q:'Grows one millimetre a year and considers this reckless.',
  s:'<g stroke="#12240f" stroke-width="2"><path d="M100 46q-4-22 14-30-2 20-14 30ZM96 48Q78 34 74 16q20 8 22 32Z" fill="#e4ff7a"/><path d="M44 110a56 50 0 0 1 112 0q0 22-56 22T44 110Z" fill="#9bd14a"/><circle cx="70" cy="86" r="9" fill="#5c8a2d" stroke="none"/><circle cx="128" cy="78" r="7" fill="#5c8a2d" stroke="none"/><circle cx="106" cy="68" r="5" fill="#5c8a2d" stroke="none"/><circle cx="84" cy="104" r="6" fill="#12240f"/><circle cx="116" cy="104" r="6" fill="#12240f"/><circle cx="86" cy="102" r="2" fill="#fff" stroke="none"/><circle cx="118" cy="102" r="2" fill="#fff" stroke="none"/><path d="M92 118q8 6 16 0" fill="none"/></g>'},
 {n:'Gloamkite',l:80,f:'linear',c:['#c9b3ff','#5b3fb5','#1c1445','#8a63ff'],t:'Aether · Tethered',a:['Long String','Attacks from very far away, and from slightly above.'],b:['Updraft','Lifts one ally out of consequences.'],q:'Nobody holds the other end. It prefers not to think about that.',
  s:'<g stroke="#0e0930" stroke-width="2" stroke-linejoin="round"><path d="M100 16l44 46-44 62-44-62Z" fill="#e2d6ff"/><path d="M100 16v108M56 62h88" fill="none"/><path d="M100 16L56 62l44 20Z" fill="#a98bff"/><path d="M144 62l-44 62V82Z" fill="#7a55f0"/><path d="M100 124q-16 8-6 16t-10 8" fill="none" stroke="#e2d6ff" stroke-width="2.5"/><path d="M90 136l-8-4 2 9ZM94 146l-9 1 6 6Z" fill="#ffb2e6"/><circle cx="86" cy="58" r="4" fill="#0e0930"/><circle cx="114" cy="58" r="4" fill="#0e0930"/></g>'}
];
const deck=document.getElementById('deck');
deck.innerHTML=C.map((d,i)=>`<div class="slot"><article class="card" data-f="${d.f}" tabindex="0" aria-label="${d.n}, holo rare card" style="--c1:${d.c[0]};--c2:${d.c[1]};--c3:${d.c[2]};--c4:${d.c[3]}">
<div class="inner"><div class="top"><span class="name">${d.n}</span><span class="lus">LUSTRE <b>${d.l}</b></span></div>
<div class="art"><svg viewBox="0 0 200 150" aria-hidden="true">${d.s}</svg></div><span class="type">${d.t}</span>
<div class="trait"><b><span>${d.a[0]}</span><span>${20+i*10}</span></b>${d.a[1]}</div><div class="trait"><b><span>${d.b[0]}</span><span>${i%2?'✦✦':'✦'}</span></b>${d.b[1]}</div>
<p class="flav">${d.q}</p><div class="foot"><span>PF1 · 00${i+1}/006</span><span>HOLO RARE ◆</span></div></div>
<div class="foil"></div><div class="glare"></div></article></div>`).join('');
const cards=[...deck.querySelectorAll('.card')];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function pose(c,nx,ny,o){ // nx,ny in 0..1
  c.style.setProperty('--ry',((nx-.5)*34).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-ny)*30).toFixed(2)+'deg');
  c.style.setProperty('--mx',(nx*100).toFixed(1)+'%');c.style.setProperty('--my',(ny*100).toFixed(1)+'%');
  c.style.setProperty('--px',(20+nx*60).toFixed(1)+'%');c.style.setProperty('--py',(20+ny*60).toFixed(1)+'%');
  c.style.setProperty('--o',o);
}
let active=null,gyroOn=false;
cards.forEach(c=>{
  const mv=e=>{const r=c.getBoundingClientRect();active=c;c.classList.add('live');
    pose(c,Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)),.78)};
  const end=()=>{if(active===c)active=null;c.classList.remove('live');pose(c,.5,.5,.35)};
  c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);
  c.addEventListener('pointerleave',end);c.addEventListener('pointercancel',end);c.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')end()});
  c.addEventListener('focus',()=>pose(c,.25,.3,.75));c.addEventListener('blur',end);
});
// idle shimmer
let t0=performance.now();
function idle(t){
  if(!reduce&&!gyroOn){const s=(t-t0)/1000;cards.forEach((c,i)=>{if(c===active||c===document.activeElement)return;
    const nx=.5+Math.sin(s*.7+i*1.3)*.16,ny=.5+Math.cos(s*.55+i*.9)*.12;pose(c,nx,ny,.45)})}
  requestAnimationFrame(idle)}
requestAnimationFrame(idle);
// gyroscope
function onTilt(e){if(e.gamma==null)return;gyroOn=true;const nx=Math.min(1,Math.max(0,.5+e.gamma/50)),ny=Math.min(1,Math.max(0,.5+(e.beta-40)/60));
  cards.forEach(c=>{if(c!==active){c.classList.add('live');pose(c,nx,ny,.75)}})}
const gb=document.getElementById('gyro');
if(window.DeviceOrientationEvent){
  if(typeof DeviceOrientationEvent.requestPermission==='function'){gb.hidden=false;
    gb.onclick=()=>DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted'){addEventListener('deviceorientation',onTilt);gb.hidden=true}}).catch(()=>{gb.hidden=true})}
  else addEventListener('deviceorientation',onTilt);
}
})();
</script>
</body>
</html>
