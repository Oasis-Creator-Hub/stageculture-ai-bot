<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDNIGHT MERIDIAN — an endless synthwave night drive</title>
<meta name="description" content="Midnight Meridian: an endless night drive down a CSS 3D perspective grid road toward a striped sun. Control the throttle with the slider, arrow keys, or by dragging.">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#090014}
body{font-family:Eurostile,"Bank Gothic","Microgramma D",Orbitron,"Arial Black","Helvetica Neue",Arial,sans-serif;color:#ffe9fb;
  touch-action:none;user-select:none;-webkit-user-select:none}
.world{position:fixed;inset:0;overflow:hidden;--hz:56%;--rw:min(250px,33vw)}
.sky{position:absolute;inset:0 0 auto 0;height:var(--hz);overflow:hidden;
  background:linear-gradient(#070012 0%,#1b0440 38%,#5a0f7a 66%,#c3247f 88%,#ff7a4d 100%)}
.stars{position:absolute;inset:0;opacity:.9;
  background-image:radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#ffd6f6,transparent),
    radial-gradient(1.6px 1.6px at 150px 60px,#bff,transparent),radial-gradient(1px 1px at 210px 170px,#fff,transparent),radial-gradient(1.3px 1.3px at 60px 200px,#fff,transparent);
  background-size:260px 240px;-webkit-mask-image:linear-gradient(#000 30%,transparent 80%);mask-image:linear-gradient(#000 30%,transparent 80%);animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.55}}
.sunwrap{position:absolute;left:50%;bottom:-7%;width:min(58vh,74vw);aspect-ratio:1;transform:translateX(-50%);filter:drop-shadow(0 0 46px rgba(255,70,150,.75))}
.sun{width:100%;height:100%;border-radius:50%;background:linear-gradient(#fff56e 4%,#ffb23e 38%,#ff4f7b 66%,#d81b9c 92%);
  -webkit-mask-image:linear-gradient(#000 0 47%,transparent 47% 49%,#000 49% 56.5%,transparent 56.5% 59.5%,#000 59.5% 65.5%,transparent 65.5% 70%,#000 70% 75%,transparent 75% 81%,#000 81% 85%,transparent 85% 100%);
  mask-image:linear-gradient(#000 0 47%,transparent 47% 49%,#000 49% 56.5%,transparent 56.5% 59.5%,#000 59.5% 65.5%,transparent 65.5% 70%,#000 70% 75%,transparent 75% 81%,#000 81% 85%,transparent 85% 100%)}
.peaks{position:absolute;left:0;bottom:-1px;width:100%;height:34%}
.peaks path{fill:#12032b;stroke:#3ff0ff;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.peaks .w{fill:none;stroke:rgba(63,240,255,.45);stroke-width:1}
.ground{position:absolute;left:0;right:0;bottom:0;top:var(--hz);overflow:hidden;perspective:300px;perspective-origin:50% 0;background:#0d0221}
.plane{position:absolute;left:50%;bottom:0;width:3200px;height:2600px;margin-left:-1600px;transform-origin:50% 100%;transform:rotateX(90deg);transform-style:preserve-3d}
.grid{position:absolute;left:0;right:0;top:-160px;bottom:-160px;will-change:transform;
  background:
   linear-gradient(90deg,transparent calc(50% - var(--rw) - 9px),#ff4fb6 calc(50% - var(--rw) - 9px),#fff calc(50% - var(--rw) - 4px),#ff4fb6 calc(50% - var(--rw)),#0c0118 calc(50% - var(--rw)),#170530 50%,#0c0118 calc(50% + var(--rw)),#ff4fb6 calc(50% + var(--rw)),#fff calc(50% + var(--rw) + 4px),#ff4fb6 calc(50% + var(--rw) + 9px),transparent calc(50% + var(--rw) + 9px)),
   repeating-linear-gradient(0deg,#35e6ff 0 3px,transparent 3px 80px),
   repeating-linear-gradient(90deg,#ff3fb0 0 3px,transparent 3px 80px),#12022c}
.grid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:repeating-linear-gradient(0deg,#fff7c2 0 74px,transparent 74px 160px)}
.post{position:absolute;bottom:0;left:50%;width:8px;height:150px;margin-left:-4px;transform-origin:50% 100%;background:linear-gradient(#fff,#37e8ff 14%,#1b6cff);
  box-shadow:0 0 18px 4px rgba(55,232,255,.75);will-change:transform}
.post::before{content:"";position:absolute;top:-10px;left:-9px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 30px 12px #ff4fb6}
.haze{position:absolute;inset:0 0 auto 0;height:42%;background:linear-gradient(#ff7a4d,rgba(216,27,156,.75) 22%,rgba(60,8,90,.35) 62%,transparent);pointer-events:none}
.car{position:absolute;left:50%;bottom:3.5%;width:min(330px,56vw);transform:translateX(-50%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.7));will-change:transform}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.title{position:absolute;top:clamp(.9rem,3vh,2rem);left:0;right:0;text-align:center;pointer-events:none}
.title h1{font-size:clamp(1.7rem,6.6vw,4.8rem);font-style:italic;font-weight:900;letter-spacing:.04em;line-height:1;text-transform:uppercase;
  background:linear-gradient(#fff 0%,#9af4ff 34%,#1a2cff 49%,#12003a 50%,#ff48c4 62%,#ffe66b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.55);filter:drop-shadow(0 0 14px rgba(255,72,196,.55))}
.title span{display:block;font:italic 400 clamp(1.2rem,3.6vw,2.5rem) "Brush Script MT","Segoe Script","Snell Roundhand","Lucida Handwriting",cursive;color:#ff6ad5;
  text-shadow:0 0 10px #ff2e9a,0 0 26px #ff2e9a;transform:rotate(-5deg) translateY(-.35em)}
.home{position:absolute;top:.9rem;left:1rem;font-size:.7rem;letter-spacing:.2em;color:#9af4ff;text-decoration:none;z-index:5;text-shadow:0 0 8px #35e6ff}
.hud{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(.8rem,3vw,2rem) clamp(.8rem,2.4vh,1.6rem);display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;pointer-events:none}
.gauge,.dash{pointer-events:auto;background:rgba(9,0,20,.62);border:1px solid rgba(53,230,255,.6);box-shadow:0 0 18px rgba(53,230,255,.25),inset 0 0 18px rgba(255,63,176,.15);padding:.7rem .9rem;backdrop-filter:blur(4px)}
.lab{font-size:.56rem;letter-spacing:.3em;color:#35e6ff;text-transform:uppercase}
.num{font-size:clamp(2rem,6vw,3.5rem);font-style:italic;font-weight:900;line-height:1;color:#fff56e;text-shadow:0 0 14px #ff8a3c;font-variant-numeric:tabular-nums;min-width:3ch;display:inline-block;text-align:right}
.num+small{font-size:.6rem;letter-spacing:.25em;color:#ff6ad5}
.thr{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.thr button{width:34px;height:34px;border:1px solid #ff4fb6;background:rgba(255,79,182,.12);color:#ffe9fb;font:900 1.1rem inherit;cursor:pointer}
.thr button:active{background:#ff4fb6;color:#090014}
input[type=range]{-webkit-appearance:none;appearance:none;width:clamp(90px,22vw,180px);height:28px;background:none;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,#35e6ff,#ff4fb6,#fff56e)}
input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,#35e6ff,#ff4fb6,#fff56e)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:26px;margin-top:-10px;background:#fff;box-shadow:0 0 12px #fff}
input[type=range]::-moz-range-thumb{width:14px;height:26px;border:0;border-radius:0;background:#fff;box-shadow:0 0 12px #fff}
.dash{text-align:right;max-width:46vw}
.dash p{font-size:clamp(.62rem,1.5vw,.78rem);letter-spacing:.14em;margin-top:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash b{color:#fff56e;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:0;right:0;top:calc(var(--hz) + 10px);text-align:center;font-size:.58rem;letter-spacing:.34em;color:rgba(255,233,251,.75);pointer-events:none;text-shadow:0 0 6px #090014}
@media(max-width:560px){.dash p.opt{display:none}}
@media(prefers-reduced-motion:reduce){.stars{animation:none}}
</style>
</head>
<body>
<div class="world" id="world">
  <div class="sky"><div class="stars"></div>
    <div class="sunwrap"><div class="sun"></div></div>
    <svg class="peaks" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 200V120L60 70L110 110L170 40L230 105L290 80L340 140L400 170L440 200Z"/>
      <path class="w" d="M60 70L80 200M170 40L150 200M170 40L215 200M290 80L300 200M110 110L115 200M230 105L255 200"/>
      <path d="M560 200L610 165L660 130L720 60L770 115L830 30L890 100L940 75L1000 125V200Z"/>
      <path class="w" d="M720 60L700 200M720 60L750 200M830 30L805 200M830 30L870 200M940 75L945 200M660 130L650 200"/>
    </svg>
  </div>
  <div class="ground"><div class="plane" id="plane"><div class="grid" id="grid"></div></div><div class="haze"></div></div>
  <svg class="car" id="car" viewBox="0 0 330 150" aria-hidden="true">
    <defs><linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1466"/><stop offset=".5" stop-color="#16062e"/><stop offset="1" stop-color="#05010c"/></linearGradient>
      <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#3a0d63"/></linearGradient></defs>
    <rect x="34" y="112" width="52" height="34" rx="6" fill="#030106"/><rect x="244" y="112" width="52" height="34" rx="6" fill="#030106"/>
    <path d="M92 44Q165 30 238 44L262 76H68Z" fill="url(#bd)" stroke="#ff4fb6" stroke-width="1.5"/>
    <path d="M102 49Q165 38 228 49L246 74H84Z" fill="url(#gl)" opacity=".85"/>
    <path d="M26 82Q28 72 68 72H262Q302 72 304 82L310 122Q310 132 298 132H32Q20 132 20 122Z" fill="url(#bd)" stroke="#35e6ff" stroke-width="1.5"/>
    <rect x="36" y="88" width="258" height="12" rx="3" fill="#ff2a5f"/><rect x="36" y="88" width="258" height="12" rx="3" fill="#ff2a5f" opacity=".7" style="filter:blur(7px)"/>
    <rect x="44" y="91" width="242" height="2.5" fill="#ffd0dc"/>
    <rect x="132" y="108" width="66" height="16" rx="2" fill="#0a0314" stroke="#35e6ff" stroke-width=".8"/>
    <text x="165" y="120" text-anchor="middle" font-size="10" font-weight="900" fill="#fff56e" letter-spacing="1.5">MRDN 86</text>
    <rect x="62" y="128" width="26" height="7" rx="3" fill="#777"/><rect x="242" y="128" width="26" height="7" rx="3" fill="#777"/>
  </svg>
  <div class="scan"></div>
  <a class="home" href="index.html">← 100</a>
  <div class="title"><h1>Midnight Meridian</h1><span>drive until sunrise</span></div>
  <div class="hint" id="hint">↑ ↓ · DRAG · OR THROTTLE</div>
  <div class="hud">
    <div class="gauge"><div class="lab">Velocity</div><span class="num" id="spd">0</span> <small>KM/H</small>
      <div class="thr"><button id="dn" aria-label="Slower">−</button><input id="thr" type="range" min="0" max="280" value="120" aria-label="Throttle"><button id="up" aria-label="Faster">+</button></div></div>
    <div class="dash"><div class="lab">Coast Highway 9 · Southbound</div>
      <p>ODO <b id="odo">000.00</b> KM</p><p class="opt">CLOCK <b id="clk">23:47</b></p><p id="radio">♪ GLASS COAST FM — tuning…</p></div>
  </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),grid=$('grid'),plane=$('plane'),car=$('car'),thr=$('thr');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const L=2600,N=12,posts=[];
for(let i=0;i<N;i++){const p=document.createElement('i');p.className='post';plane.appendChild(p);posts.push(p)}
let target=still?0:120,v=0,dist=0,km=0,last=0,clock=23*60+47,roadW=250;
if(still){thr.value=0;$('hint').textContent='MOTION PAUSED · RAISE THROTTLE TO DRIVE'}
const measure=()=>{roadW=Math.min(250,innerWidth*.33)};measure();addEventListener('resize',measure);
const set=x=>{target=Math.max(0,Math.min(280,x));thr.value=target};
thr.addEventListener('input',()=>target=+thr.value);
$('up').addEventListener('click',()=>set(target+20));$('dn').addEventListener('click',()=>set(target-20));
addEventListener('keydown',e=>{if(e.target===thr)return;if(e.key==='ArrowUp'||e.key==='w'){set(target+10);e.preventDefault()}if(e.key==='ArrowDown'||e.key==='s'){set(target-10);e.preventDefault()}if(e.key===' '){set(target?0:120);e.preventDefault()}});
addEventListener('wheel',e=>set(target-Math.sign(e.deltaY)*10),{passive:true});
let drag=null;const w=$('world');
w.addEventListener('pointerdown',e=>{if(e.target.closest('.gauge,.dash,a'))return;drag={y:e.clientY,t:target}});
addEventListener('pointermove',e=>{if(drag)set(drag.t+(drag.y-e.clientY)*.9)});
addEventListener('pointerup',()=>drag=null);addEventListener('pointercancel',()=>drag=null);
const tracks=['VELA CORSAIR — “NEON CAUSEWAY”','THE PALM CIRCUIT — “TAIL LIGHTS, NO MAP”','ORCHID DRIVE — “SODIUM SUMMER”','KASSETTE NOIR — “LAST EXIT TO LUMEN BAY”','JUNO HARBOUR — “CHROME HEART, SLOW FADE”'];
let ti=0;const tune=()=>{$('radio').textContent='♪ GLASS COAST FM — '+tracks[ti++%tracks.length]};tune();setInterval(tune,9000);
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  v+=(target-v)*Math.min(1,dt*1.6);if(Math.abs(target-v)<.3)v=target;
  dist+=v*8.5*dt;km+=v*dt/3600*40;clock+=dt*v/900;
  grid.style.transform='translate3d(0,'+(dist%160).toFixed(1)+'px,0)';
  for(let i=0;i<N;i++){const side=i%2?1:-1,d=((i>>1)*(L/(N/2))+dist)%L;
    posts[i].style.transform='translate3d('+(side*(roadW+70))+'px,'+(d-L+150).toFixed(1)+'px,0) rotateX(-90deg)';
    posts[i].style.opacity=Math.min(1,d/500)}
  const bob=Math.sin(now/90)*v/280*1.6,sway=Math.sin(now/1700)*v/280*10;
  car.style.transform='translateX(calc(-50% + '+sway.toFixed(1)+'px)) translateY('+bob.toFixed(2)+'px) rotate('+(sway*.06).toFixed(2)+'deg)';
  $('spd').textContent=Math.round(v);$('odo').textContent=km.toFixed(2).padStart(6,'0');
  const m=Math.floor(clock)%1440;$('clk').textContent=String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
