<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALCYON-9 — Deepwater Station Mainframe</title>
<meta name="description" content="A green phosphor CRT terminal for the fictional Meridian Deepwater Station. Type help: read crew logs, ping the sea floor, change the phosphor, and play a tiny text adventure.">
<style>
*{box-sizing:border-box;margin:0}
:root{--p:#49ff8a;--pd:#1c7a3d;--bg:#031207;--glow:rgba(73,255,138,.55)}
:root[data-ph=amber]{--p:#ffb347;--pd:#8a5510;--bg:#140b02;--glow:rgba(255,179,71,.55)}
:root[data-ph=ice]{--p:#cfe9ff;--pd:#5f7f99;--bg:#050b12;--glow:rgba(207,233,255,.5)}
html,body{height:100%}
body{background:#0b0b0a radial-gradient(ellipse at 50% 20%,#24221e,#070707 75%);display:grid;place-items:center;padding:clamp(6px,2vw,26px);overflow:hidden;
  font-family:"IBM Plex Mono","Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono","Courier New",monospace}
.case{width:min(100%,1040px);height:min(100%,780px);display:flex;flex-direction:column;border-radius:26px;padding:clamp(10px,2.2vw,26px) clamp(10px,2.2vw,26px) 0;
  background:linear-gradient(160deg,#cfc7b2,#a59c86 55%,#8a826f);box-shadow:inset 0 2px 0 #eee7d4,inset 0 -6px 14px rgba(0,0,0,.35),0 40px 80px rgba(0,0,0,.7)}
.tube{flex:1;min-height:0;position:relative;border-radius:5% / 7%;background:#000;padding:10px;box-shadow:inset 0 0 0 3px #1a1a18,inset 0 0 30px #000,0 0 0 2px #6f6858}
.screen{position:absolute;inset:10px;border-radius:4.5% / 6.5%;overflow:hidden;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--pd) 26%,var(--bg)) 0%,var(--bg) 72%,#000 130%);
  animation:hum 9s infinite}
@keyframes hum{0%,100%{filter:brightness(1)}47%{filter:brightness(1)}48%{filter:brightness(1.12)}49%{filter:brightness(.96)}50%{filter:brightness(1)}}
#scroll{position:absolute;inset:0;overflow-y:auto;padding:clamp(18px,4.5%,44px) clamp(16px,5%,52px);color:var(--p);font-size:clamp(12.5px,1.9vw,17px);line-height:1.42;
  text-shadow:0 0 2px var(--p),0 0 11px var(--glow);scrollbar-width:none;transform:perspective(900px) scale(1.012)}
#scroll::-webkit-scrollbar{display:none}
#out{white-space:pre-wrap;word-break:break-word}
#out .d{color:var(--pd);text-shadow:0 0 6px var(--glow)}
#out .b{font-weight:700;color:#fff;text-shadow:0 0 4px var(--p),0 0 16px var(--p)}
.line{display:flex;align-items:baseline}
.line span{white-space:pre}
#cmd{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;text-shadow:inherit;caret-color:var(--p);padding:0;font-size:max(1em,16px)}
.fx{position:absolute;inset:0;pointer-events:none}
.scan{background:repeating-linear-gradient(rgba(0,0,0,.34) 0 1px,transparent 1px 3px)}
.roll{background:linear-gradient(transparent,rgba(255,255,255,.045) 50%,transparent);height:28%;animation:roll 7s linear infinite}
@keyframes roll{from{transform:translateY(-110%)}to{transform:translateY(460%)}}
.vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);box-shadow:inset 0 0 60px rgba(0,0,0,.8)}
.glare{background:radial-gradient(60% 40% at 28% 14%,rgba(255,255,255,.09),transparent 70%)}
.deck{display:flex;align-items:center;gap:10px;padding:10px 4px 12px;flex-wrap:wrap}
.plate{font:700 10px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.28em;color:#3b372e;margin-right:auto;text-shadow:0 1px 0 #ddd5c0}
.plate a{color:inherit;text-decoration:none;border-bottom:1px solid #3b372e55;margin-left:1em}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{font:700 10px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#f0ead8;background:#3d3a33;border:0;border-radius:4px;padding:9px 10px;
  box-shadow:0 3px 0 #1c1a16,inset 0 1px 0 #6a665b;cursor:pointer}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #1c1a16}
.led{width:9px;height:9px;border-radius:50%;background:var(--p);box-shadow:0 0 8px var(--p);animation:led 1.8s steps(2) infinite}
@keyframes led{50%{opacity:.35}}
@media(max-width:560px){.case{border-radius:16px}.plate span{display:none}}
@media(prefers-reduced-motion:reduce){.screen,.roll,.led{animation:none}.roll{display:none}}
</style>
</head>
<body>
<div class="case">
  <div class="tube"><div class="screen" id="screen">
    <div id="scroll"><div id="out" aria-live="polite"></div>
      <label class="line"><span id="ps1">HALCYON-9&gt; </span><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal command input" enterkeyhint="send"></label></div>
    <div class="fx scan"></div><div class="fx roll"></div><div class="fx vig"></div><div class="fx glare"></div>
  </div></div>
  <div class="deck"><i class="led"></i><div class="plate">HALCYON-9 <span>· MERIDIAN DEEPWATER · UNIT 04</span><a href="index.html">← 100</a></div>
    <div class="keys"><button data-c="help">Help</button><button data-c="status">Status</button><button data-c="log">Log</button><button data-c="descend">Play</button></div></div>
</div>
<script>
(()=>{
const out=document.getElementById('out'),cmd=document.getElementById('cmd'),scroll=document.getElementById('scroll'),ps1=document.getElementById('ps1');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let queue=[],typing=false,hist=[],hp=0,game=null,t0=Date.now();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
// print(text, cls): typed out character by character through a queue
function print(text='',cls=''){String(text).split('\n').forEach(l=>queue.push([l,cls]));if(!typing)pump()}
function pump(){
  if(!queue.length){typing=false;return}typing=true;
  const [text,cls]=queue.shift(),el=document.createElement('div');if(cls)el.className=cls;el.innerHTML='&#8203;';out.appendChild(el);
  if(still||queue.length>40){el.textContent=text||'\u200b';scroll.scrollTop=1e9;return pump()}
  let i=0;(function step(){i+=5;el.textContent=text.slice(0,i)||'\u200b';scroll.scrollTop=1e9;i<text.length?requestAnimationFrame(step):setTimeout(pump,14)})();
}
const bar=(v,n=20)=>'['+'#'.repeat(Math.round(v*n)).padEnd(n,'.')+'] '+Math.round(v*100)+'%';
const pick=a=>a[Math.floor(Math.random()*a.length)];
const logs=[
 'DAY 212 — Pump three is singing again. Okoro says it is a bearing. I say it is lonely.',
 'DAY 219 — Supply sub delayed by weather topside. We are rationing coffee. Morale: structural.',
 'DAY 224 — Something large passed the east viewport at 03:10. It did not hurry. Neither did I.',
 'DAY 231 — Calibrated the tide table by hand. HALCYON was off by eleven seconds and sulked about it.',
 'DAY 240 — Vesna grew a tomato in hydroponics. We held a small ceremony. Nobody ate it.',
 'DAY 247 — The lights on sublevel two flickered in a pattern. Tried typing DESCEND. Regretting nothing.'];
const C={
 help(){print('AVAILABLE DIRECTIVES','b');print(
`  status          station vitals
  crew            who is aboard
  log [n]         read the station log (1-${logs.length})
  sonar           sweep the sea floor
  tide            tide table, hand-corrected
  ping <node>     knock on a subsystem (pumps, galley, surface, kelp)
  whisper <text>  encode a message for the hydrophone
  phosphor <c>    green | amber | ice
  descend         play THE SUBLEVEL (a small adventure)
  clear           wipe the glass
  about           what am I`)},
 status(){const up=((Date.now()-t0)/1000|0);print('MERIDIAN DEEPWATER STATION — DEPTH 412 M','b');
  print('  hull integrity   '+bar(.97)+'\n  oxygen reserve   '+bar(.71+Math.random()*.05)+'\n  battery bank     '+bar(.58)+'\n  coffee           '+bar(.08)+'  << CRITICAL\n  outside temp     3.9 C\n  session uptime   '+up+' s\n  mood (HALCYON)   '+pick(['attentive','faintly nostalgic','humming','suspicious of pump three']))},
 crew(){print('ABOARD (4)','b');print('  V. Marchetti-Lund   station chief      asleep, officially\n  T. Okoro            mechanic           arguing with pump three\n  Vesna Halloran      botanist           talking to a tomato\n  HALCYON-9           mainframe          you are speaking to it')},
 log(a){const n=parseInt(a[0],10);if(!a.length){print('STATION LOG — '+logs.length+' ENTRIES. Use: log <n>','b');logs.forEach((l,i)=>print('  '+(i+1)+'  '+l.slice(0,l.indexOf('—')+1)+' …','d'));return}
  if(!(n>=1&&n<=logs.length))return print('No such entry. The log has '+logs.length+' pages and a coffee ring.');print(logs[n-1])},
 sonar(){print('SWEEPING 360°  RANGE 800 M','b');const g=' .·:+*#';let s='';
  for(let y=0;y<9;y++){let r='  ';for(let x=0;x<38;x++){const d=Math.hypot((x-19)/2,y-4.5),v=Math.sin(x*.7+y)*Math.cos(y*1.3-x*.2)+Math.random()*.7-d*.12;r+=x==19&&y==4?'@':g[Math.max(0,Math.min(6,Math.round(v*3)))]}s+=r+'\n'}
  print(s+'  @ station   # ridge   contacts: '+pick(['1 (slow, large, unbothered)','0 — the sea is keeping to itself','3 (a school of something silver)','1 (matches no catalogue; filed under "friend")']))},
 tide(){const h=new Date().getHours();print('TIDE TABLE (surface, 412 m up)','b');for(let i=0;i<4;i++){const hr=(h+i*6+2)%24;print('  '+String(hr).padStart(2,'0')+':'+pick(['04','17','31','48'])+'   '+(i%2?'LOW ':'HIGH')+'   '+(i%2?'0.'+pick([3,4,6]):'2.'+pick([1,5,8]))+' m')}print('  corrected by hand, +11 s. You are welcome.','d')},
 ping(a){const n=(a[0]||'').toLowerCase(),r={pumps:'pump one: ok. pump two: ok. pump three: ok, but singing.',galley:'galley responds: kettle is on. It is always on.',surface:'surface relay… … … 2740 ms. "Still raining up here."',kelp:'the kelp farm does not have a network address. It waved anyway.'};
  print(r[n]||'ping: unknown node "'+(n||'?')+'". Try pumps, galley, surface or kelp.')},
 whisper(a){if(!a.length)return print('Usage: whisper <text>');const t=a.join(' ').toLowerCase();print('HYDROPHONE ENCODING','b');print('  '+[...t].map(c=>c===' '?' / ':/[a-z]/.test(c)?(c.charCodeAt(0)-96).toString(2).padStart(5,'0').replace(/0/g,'·').replace(/1/g,'—'):'').join(' '));print('  sent into the dark. Replies take a while. Whales are thorough.','d')},
 phosphor(a){const c=(a[0]||'').toLowerCase();if(!['green','amber','ice'].includes(c))return print('Usage: phosphor green | amber | ice');c==='green'?document.documentElement.removeAttribute('data-ph'):document.documentElement.dataset.ph=c;print('Tube re-coated: '+c+'. Mind your eyes.')},
 clear(){queue=[];out.innerHTML=''},
 about(){print('HALCYON-9','b');print('Installed 1979, forty fathoms below good sense. 64 kilobytes of core, one green tube, and a long memory for people who say please.\nI keep the pumps turning and the log honest.')},
 please(){print('Noted, and appreciated.')},hello(){print('Hello. It is quiet down here; thank you for typing.')},
 descend(){game={room:'airlock',inv:[],lit:false,open:false};ps1.textContent='SUBLEVEL> ';print('\nTHE SUBLEVEL','b');print('A small adventure. Commands: look, go <n/s/e/w>, take <thing>, use <thing>, inv, quit.\n');look()}
};
C.play=C.descend;C.logs=C.log;C.ls=C.help;C['?']=C.help;
// --- tiny text adventure ---
const R={
 airlock:{d:'AIRLOCK. Wet suits hang like sleeping bats. A dented locker stands open. A ladder goes NORTH into the station.',x:{n:'hall'},it:'lamp'},
 hall:{d:'CORRIDOR. Emergency lights tick. Doors EAST (laboratory) and WEST (pump room). To the NORTH, a bulkhead marked CORE.',x:{s:'airlock',e:'lab',w:'pumps',n:'core'}},
 lab:{d:'LABORATORY. Jars of patient sea-things. On the bench, among the pipettes, sits a ceramic fuse the size of a thumb.',x:{w:'hall'},it:'fuse'},
 pumps:{d:'PUMP ROOM.',x:{e:'hall'},it:'keycard'},
 core:{d:'THE CORE. HALCYON\'s oldest cabinet, dark and cold. One socket in the panel stands empty, scorched at the edges.',x:{s:'hall'}}};
function look(){const g=game,r=R[g.room];
  if(g.room==='pumps'){print(g.lit?'PUMP ROOM. Your lamp finds three pumps; the third hums a tune.'+(g.inv.includes('keycard')?'':' A keycard glints on a hook by the valve wheel.'):'PUMP ROOM. It is completely dark. Something hums. You should not walk further without a light.')}
  else print(r.d.replace(/ A dented locker stands open\./,g.inv.includes('lamp')?'':' Inside a dented locker: a hand lamp.').replace(/ On the bench.*$/,g.inv.includes('fuse')||g.done?'':'$&'));
  print('Exits: '+Object.keys(r.x).map(k=>({n:'north',s:'south',e:'east',w:'west'}[k])).join(', '),'d')}
function adventure(v,a){const g=game,r=R[g.room],o=(a[0]||'').toLowerCase();
  if(['n','s','e','w','north','south','east','west'].includes(v)){o_go(v[0]);return}
  if(v==='go'||v==='walk')return o?o_go(o[0]):print('Go where?');
  function o_go(d){const to=r.x[d];if(!to)return print('Steel wall. The sea is on the other side of it.');
    if(to==='core'&&!g.open)return print('The CORE bulkhead is locked. A card reader blinks red, unimpressed.');g.room=to;look()}
  if(v==='look'||v==='l')return look();
  if(v==='inv'||v==='i'||v==='inventory')return print(g.inv.length?'You carry: '+g.inv.join(', ')+'.':'You carry nothing but a mild sense of dread.');
  if(v==='take'||v==='get'){if(!r.it||r.it!==o||g.inv.includes(o))return print('There is no '+(o||'such thing')+' to take here.');if(o==='keycard'&&!g.lit)return print('You grope in the dark and find only cold pipe.');g.inv.push(o);return print('Taken: '+o+'.')}
  if(v==='use'){if(!g.inv.includes(o))return print('You do not have '+(o?'a '+o:'that')+'.');
    if(o==='lamp'){g.lit=true;print('The lamp buzzes awake. A cone of yellow light.');if(g.room==='pumps')look();return}
    if(o==='keycard'){if(g.room!=='hall')return print('Nothing here reads cards.');g.open=true;return print('The reader chirps green. The CORE bulkhead unseals with a sigh of old air.')}
    if(o==='fuse'){if(g.room!=='core')return print('It is a fuse. It wants a socket.');g.done=true;
      print('You press the fuse home. Deep in the cabinet, relays clatter like applause.\nLights climb the walls, deck by deck. Somewhere above, a kettle starts.\n');print('  HALCYON-9: "Oh. There you are. Thank you."','b');print('\nTHE END — you restored the core in true deepwater fashion.\n');return quit()}}
  if(v==='quit'||v==='exit'||v==='surface'){print('You climb back up toward the green glow.');return quit()}
  if(v==='help')return print('look, go <n/s/e/w>, take <thing>, use <thing>, inv, quit');
  print('The sublevel does not understand "'+v+'".')}
function quit(){game=null;ps1.textContent='HALCYON-9> '}
function run(raw){const line=raw.trim();print(ps1.textContent+line,'d');if(!line)return;hist.push(line);hp=hist.length;
  const [v,...a]=line.split(/\s+/),verb=v.toLowerCase();
  if(game)return adventure(verb,a);
  (C[verb]||(()=>print('Unknown directive "'+verb+'". Type HELP. I will not judge.')))(a)}
cmd.addEventListener('keydown',e=>{
  if(e.key==='Enter'){run(cmd.value);cmd.value=''}
  else if(e.key==='ArrowUp'){if(hp>0)cmd.value=hist[--hp];e.preventDefault()}
  else if(e.key==='ArrowDown'){cmd.value=hp<hist.length-1?hist[++hp]:(hp=hist.length,'');e.preventDefault()}});
document.getElementById('screen').addEventListener('click',()=>{if(!String(getSelection()))cmd.focus({preventScroll:true})});
document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.c)));
print(`MERIDIAN DEEPWATER SYSTEMS  ·  HALCYON-9  ·  ROM 4.11
64K CORE OK  ·  DRUM STORE OK  ·  HYDROPHONE OK  ·  PUMP 3 ...SINGING
`,'d');
print(` _  _   _   _    ___ __   __ ___  _  _
| || | /_\\ | |  / __|\\ \\ / // _ \\| \\| |
| __ |/ _ \\| |_| (__  \\ V /| (_) | .\` |
|_||_/_/ \\_\\___|\\___|  |_|  \\___/|_|\\_|  9
`,'b');
print('Good evening. Depth 412 metres. All four of us are well.\nType HELP for directives, or DESCEND if you are feeling brave.\n');
if(matchMedia('(pointer:fine)').matches)cmd.focus({preventScroll:true});
})();
</script>
</body>
</html>
