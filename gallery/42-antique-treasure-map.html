<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Chart of the Isle — Antique Treasure Map</title>
<meta name="description" content="A procedurally drawn antique treasure map: every chart has a new island coastline, mountains, sea monsters, a dotted route and a place where X marks the spot.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;background:#1d140d;
    background-image:radial-gradient(ellipse at 50% 30%,#4a3220 0,#1d140d 70%),repeating-linear-gradient(8deg,rgba(255,255,255,.015) 0 3px,transparent 3px 11px);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
    color:#3b2614;display:flex;flex-direction:column;align-items:center;padding:26px 10px 34px;overflow-x:hidden;
  }
  a.back{position:fixed;left:12px;top:10px;font-style:italic;color:#c9a876;text-decoration:none;font-size:14px;z-index:4;opacity:.8}
  a.back:hover{opacity:1}
  .sheet{position:relative;width:min(1020px,100%);filter:drop-shadow(0 24px 30px rgba(0,0,0,.65))}
  svg#map{display:block;width:100%;height:auto}
  .bar{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px}
  button{
    font:italic 600 17px/1 "Palatino Linotype",Palatino,Georgia,serif;color:#f1dfb8;background:#6b2618;border:1px solid #c79a5a;
    padding:12px 22px;border-radius:2px;cursor:pointer;letter-spacing:.04em;box-shadow:0 0 0 3px #3a140c,0 6px 14px rgba(0,0,0,.5);
  }
  button:hover{background:#82301f}
  button:active{transform:translateY(1px)}
  .seed{color:#b89a6c;font-style:italic;font-size:14px}
  text{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
  .route{stroke-dasharray:2 9;animation:draw 0s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .monster{animation:bob 6s ease-in-out infinite;transform-box:fill-box}
  .ship{animation:bob 4s ease-in-out infinite;transform-box:fill-box}
  @media (prefers-reduced-motion:reduce){.monster,.ship{animation:none}}
</style>
</head>
<body>
<a class="back" href="index.html">← 100</a>
<div class="sheet">
<svg id="map" viewBox="0 0 1000 700" role="img" aria-label="Procedurally generated antique treasure map">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="5" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .36  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .9 -.28" result="stain"/>
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 .25  0 0 0 0 .15  0 0 0 0 .05  0 0 0 .22 0" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="stain"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="2"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
    <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <radialGradient id="vig" cx="50%" cy="48%" r="62%"><stop offset=".55" stop-color="#3a2108" stop-opacity="0"/><stop offset="1" stop-color="#2a1503" stop-opacity=".62"/></radialGradient>
    <clipPath id="sheetclip"><rect x="14" y="14" width="972" height="672" rx="6"/></clipPath>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5b3a1c" stroke-width=".8" opacity=".35"/></pattern>
  </defs>
  <g filter="url(#rough)"><rect x="14" y="14" width="972" height="672" rx="6" fill="#e4cd9c"/></g>
  <g clip-path="url(#sheetclip)">
    <rect x="0" y="0" width="1000" height="700" fill="#e7d2a2" filter="url(#paper)"/>
    <g id="rhumb" stroke="#7a5630" stroke-width=".5" opacity=".33"></g>
    <g id="waves" fill="none" stroke="#6b4a26" stroke-width="1" opacity=".5" stroke-linecap="round"></g>
    <g id="land" filter="url(#ink)"></g>
    <g id="feat" filter="url(#ink)"></g>
    <g id="creatures"></g>
    <g id="rose"></g>
    <g id="cart"></g>
    <rect x="34" y="34" width="932" height="632" fill="none" stroke="#4a2e14" stroke-width="2.2"/>
    <rect x="42" y="42" width="916" height="616" fill="none" stroke="#4a2e14" stroke-width=".7"/>
    <g id="ticks" stroke="#4a2e14" stroke-width="1"></g>
    <rect width="1000" height="700" fill="url(#vig)"/>
  </g>
</svg>
</div>
<div class="bar">
  <button id="regen" type="button">Unroll another chart</button>
  <span class="seed" id="seed"></span>
</div>

<script>
(() => {
  const NS='http://www.w3.org/2000/svg';
  const $=id=>document.getElementById(id);
  const el=(parent,tag,attrs,text)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; parent.appendChild(e); return e; };
  let s=1; const R=()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const rr=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
  const A=['Saint','Cape','Isla','Great','Little','Old','Fair','Black','Sunken','Gilded'],
        B=['Marrow','Quill','Thimble','Corvane','Peregrine','Osprey','Brindle','Mistral','Sable','Vesper','Halcyon','Tamarind'],
        C=['Cay','Key','Reach','Atoll','Isle','Hook','Shoal'],
        SEA=['The Mumbling Deep','Sea of Late Regrets','The Brass Shallows','Widow’s Current','The Unhurried Ocean','Straits of Mild Peril'],
        FEAT=['Gallows Palm','Tooth Rock','The Sleeping Friar','Parrot’s Chapel','Dry Well','Cutlass Ridge','Lantern Cove','Old Anchor','Mutineer’s Rest','Fever Marsh','The Three Sisters','Pelican Stair'],
        NOTE=['Here be modest dangers','Soundings doubtful','No fresh water after Michaelmas','Trust not the northern beacon','Whales, or islands resembling whales'];

  function coast(cx,cy,rad,n){
    const harm=[]; for(let k=1;k<=7;k++) harm.push([rr(.08,.5)/k,rr(0,6.28)]);
    const pts=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; let r=1; harm.forEach(([am,ph],k)=>r+=am*Math.sin(a*(k+1)+ph)); r=Math.max(.42,r)+rr(-.03,.03);
      pts.push([cx+Math.cos(a)*rad*r*1.25,cy+Math.sin(a)*rad*r*.86]); }
    return pts;
  }
  const smooth=p=>{ let d=''; const n=p.length; for(let i=0;i<n;i++){ const a=p[i],b=p[(i+1)%n],m=[(a[0]+b[0])/2,(a[1]+b[1])/2]; d+=(i?'Q'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' ':'M')+m[0].toFixed(1)+' '+m[1].toFixed(1)+' '; }
    return d+'Q'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1)+' '+((p[0][0]+p[1][0])/2).toFixed(1)+' '+((p[0][1]+p[1][1])/2).toFixed(1)+'Z'; };
  const inside=(pt,poly)=>{ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i],b=poly[j]; if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; };
  const scale=(p,c,f)=>p.map(q=>[c[0]+(q[0]-c[0])*f,c[1]+(q[1]-c[1])*f]);

  function build(seed){
    s=seed; $('seed').textContent='Folio № '+seed+' of the Admiralty of Nowhere';
    ['rhumb','waves','land','feat','creatures','rose','cart','ticks'].forEach(id=>$(id).innerHTML='');
    const cx=rr(430,540), cy=rr(330,380), c=[cx,cy];
    const poly=coast(cx,cy,rr(165,195),90), d=smooth(poly);
    const land=$('land'), feat=$('feat');
    // shoreline ripples
    [1.16,1.1,1.05].forEach((f,i)=>el(land,'path',{d:smooth(scale(poly,c,f)),fill:'none',stroke:'#5b3a1c','stroke-width':.8,opacity:.22+i*.12,'stroke-dasharray':i==0?'14 10':i==1?'30 8':''}));
    el(land,'path',{d,fill:'#d9bb7e',stroke:'#3b2410','stroke-width':2.4,'stroke-linejoin':'round'});
    el(land,'path',{d,fill:'url(#hatch)',opacity:.55});
    el(land,'path',{d:smooth(scale(poly,c,.9)),fill:'#e2c98f',opacity:.85});
    // islets
    for(let i=0;i<rr(2,5);i++){ const a=rr(0,6.28), r=rr(250,300); const p=[cx+Math.cos(a)*r*1.3,cy+Math.sin(a)*r*.82];
      if(p[0]<80||p[0]>920||p[1]<90||p[1]>610) continue; el(land,'path',{d:smooth(coast(p[0],p[1],rr(9,22),14)),fill:'#d9bb7e',stroke:'#3b2410','stroke-width':1.6}); }
    // inland points
    const spots=[]; let guard=0;
    while(spots.length<9&&guard++<900){ const p=[cx+rr(-260,260),cy+rr(-170,170)]; if(inside(p,scale(poly,c,.8))&&spots.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>62)) spots.push(p); }
    // mountains near first spots
    spots.slice(0,2).forEach(p=>{ for(let i=0;i<6;i++){ const x=p[0]+rr(-34,34), y=p[1]+rr(-14,14), h=rr(16,30), w=h*.8; if(!inside([x,y],poly)) continue;
      el(feat,'path',{d:`M${x-w} ${y}L${x} ${y-h}L${x+w} ${y}`,fill:'#e2c98f',stroke:'#3b2410','stroke-width':1.4,'stroke-linejoin':'round'});
      el(feat,'path',{d:`M${x} ${y-h}L${x+w*.25} ${y-h*.45}L${x+w*.05} ${y-h*.3}L${x+w*.4} ${y}M${x+w*.5} ${y-h*.4}L${x+w*.7} ${y-2}`,fill:'none',stroke:'#3b2410','stroke-width':.8}); } });
    // trees/palms
    spots.slice(2,5).forEach(p=>{ for(let i=0;i<8;i++){ const x=p[0]+rr(-30,30), y=p[1]+rr(-18,18); if(!inside([x,y],poly)) continue;
      el(feat,'path',{d:`M${x} ${y}v-9M${x-5} ${y-8}q5-7 10 0M${x-4} ${y-11}q4-6 8 0`,fill:'none',stroke:'#3d4a22','stroke-width':1.2,'stroke-linecap':'round'}); } });
    // labels
    const names=[...FEAT].sort(()=>R()-.5);
    spots.slice(0,6).forEach((p,i)=>el(feat,'text',{x:p[0],y:p[1]+(i<2?18:16),'text-anchor':'middle','font-size':11,'font-style':'italic',fill:'#3b2410'},names[i]));
    // route: from sea landing through spots to X
    let ang=rr(0,6.28), land0; for(let r=120;r<400;r+=4){ land0=[cx+Math.cos(ang)*r*1.25,cy+Math.sin(ang)*r*.86]; if(!inside(land0,poly)) break; }
    const sea0=[Math.max(110,Math.min(890,cx+Math.cos(ang)*330*1.3)),Math.max(110,Math.min(590,cy+Math.sin(ang)*330*.82))];
    const stops=spots.slice(5).sort((a,b)=>Math.hypot(a[0]-land0[0],a[1]-land0[1])-Math.hypot(b[0]-land0[0],b[1]-land0[1]));
    const X=stops[stops.length-1]||c, path=[sea0,land0,...stops];
    let rd='M'+path[0].map(v=>v.toFixed(1)).join(' ');
    for(let i=1;i<path.length;i++){ const a=path[i-1],b=path[i],mx=(a[0]+b[0])/2+rr(-28,28),my=(a[1]+b[1])/2+rr(-28,28); rd+=`Q${mx.toFixed(1)} ${my.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }
    el(feat,'path',{d:rd,fill:'none',stroke:'#8c1f12','stroke-width':2.6,'stroke-linecap':'round','stroke-dasharray':'1 9'});
    el(feat,'path',{d:`M${X[0]-10} ${X[1]-10}l20 20m0-20l-20 20`,stroke:'#8c1f12','stroke-width':4.5,'stroke-linecap':'round',fill:'none'});
    el(feat,'text',{x:X[0],y:X[1]-16,'text-anchor':'middle','font-size':11,'font-style':'italic',fill:'#8c1f12'},pick(['dig here, seven paces','beneath the flat stone','what the Captain owed']));
    // ship at start
    const sh=el($('creatures'),'g',{class:'ship',transform:`translate(${sea0[0]-18} ${sea0[1]-30})`});
    el(sh,'path',{d:'M2 24h34l-6 9H8zM18 24V2M18 4c9 3 11 10 12 17H18zM16 7c-6 3-9 8-10 14h10z',fill:'#e9d7ab',stroke:'#3b2410','stroke-width':1.4,'stroke-linejoin':'round'});
    el(sh,'path',{d:'M18 2l8 2-8 2z',fill:'#8c1f12'});
    // waves
    const wv=$('waves'); for(let i=0;i<150;i++){ const x=rr(60,940), y=rr(60,640); if(inside([x,y],scale(poly,c,1.2))) continue; el(wv,'path',{d:`M${x} ${y}q4-5 8 0t8 0`}); }
    // monsters
    const cr=$('creatures'); let placed=[];
    const freeSpot=()=>{ for(let t=0;t<200;t++){ const p=[rr(120,880),rr(120,580)]; if(!inside(p,scale(poly,c,1.45))&&placed.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>150)&&Math.hypot(p[0]-rose[0],p[1]-rose[1])>130&&!(p[0]<360&&p[1]<170)){ placed.push(p); return p; } } return null; };
    const corner=pick([[850,570],[150,570],[850,150]]); const rose=corner;
    // serpent
    let p=freeSpot(); if(p){ const m=el(cr,'g',{class:'monster',transform:`translate(${p[0]-60} ${p[1]-20}) scale(${R()<.5?1:-1} 1)`,style:'transform-origin:60px 20px'});
      el(m,'path',{d:'M0 30c6-28 26-28 30 0M36 30c6-24 24-24 28 0M70 30c4-18 18-22 24-34c5-10 16-8 20-2c-8-2-12 2-13 8c-2 10-8 20-10 28',fill:'#7f9a7a',stroke:'#2e3b24','stroke-width':1.8,'stroke-linejoin':'round'});
      el(m,'path',{d:'M6 22l4-6M14 14l3-6M22 18l4-5M42 18l3-6M52 16l3-5M96-2l-4-7M103-6l-1-8',stroke:'#2e3b24','stroke-width':1.3,fill:'none'});
      el(m,'circle',{cx:108,cy:-3,r:1.6,fill:'#2e3b24'}); el(m,'path',{d:'M114-4l10-3l-8 6',fill:'#8c1f12'});
      el(m,'path',{d:'M-8 32q6-5 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0',fill:'none',stroke:'#3b2410','stroke-width':1}); }
    // kraken
    p=freeSpot(); if(p){ const m=el(cr,'g',{class:'monster',transform:`translate(${p[0]} ${p[1]})`,style:'animation-delay:-2s'});
      for(let i=0;i<5;i++){ const x=-40+i*20, h=rr(18,38), b=R()<.5?8:-8; el(m,'path',{d:`M${x-4} 14C${x-6} ${-h*.4} ${x+b} ${-h*.7} ${x+b*1.6} ${-h}c${b*.6} -6 ${b*1.6} 2 ${b*.4} 8C${x+b*.4} ${-h*.3} ${x+5} 0 ${x+4} 14z`,fill:'#b0705a',stroke:'#3b2410','stroke-width':1.4}); }
      el(m,'path',{d:'M-56 16q6-5 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0',fill:'none',stroke:'#3b2410','stroke-width':1}); }
    // whale spout
    p=freeSpot(); if(p){ const m=el(cr,'g',{class:'monster',transform:`translate(${p[0]} ${p[1]})`,style:'animation-delay:-4s'});
      el(m,'path',{d:'M-34 10c0-22 44-26 62-4c6-2 10-8 12-12c2 8 0 16-8 20z',fill:'#74858a',stroke:'#26323a','stroke-width':1.6,'stroke-linejoin':'round'});
      el(m,'path',{d:'M-10-12c-2-10-10-12-14-8M-10-12c0-12 8-14 13-9M-10-12v-14',fill:'none',stroke:'#26323a','stroke-width':1.2,'stroke-linecap':'round'});
      el(m,'circle',{cx:-22,cy:2,r:1.5,fill:'#26323a'}); }
    // rhumb lines + rose
    const rh=$('rhumb'); for(let i=0;i<32;i++){ const a=i/32*6.283; el(rh,'line',{x1:rose[0],y1:rose[1],x2:rose[0]+Math.cos(a)*1400,y2:rose[1]+Math.sin(a)*1400}); }
    const rg=el($('rose'),'g',{transform:`translate(${rose[0]} ${rose[1]})`});
    el(rg,'circle',{r:58,fill:'#e7d2a2',opacity:.8,stroke:'#3b2410','stroke-width':1.2}); el(rg,'circle',{r:52,fill:'none',stroke:'#3b2410','stroke-width':.6});
    for(let i=0;i<72;i++){ const a=i/72*6.283, r1=i%9?55:52; el(rg,'line',{x1:Math.cos(a)*r1,y1:Math.sin(a)*r1,x2:Math.cos(a)*58,y2:Math.sin(a)*58,stroke:'#3b2410','stroke-width':.6}); }
    [[16,22,'#b08a4a'],[8,34,'#6b2618'],[4,50,'#23303a']].forEach(([n,len,col],ri)=>{ for(let i=0;i<n;i++){ if(ri&&n==8&&i%2==0) continue; if(ri==0&&i%2==0) continue;
      const g=el(rg,'g',{transform:`rotate(${i/n*360})`}); el(g,'path',{d:`M0 ${-len}L${len*.14} 0H0z`,fill:col,stroke:'#3b2410','stroke-width':.6}); el(g,'path',{d:`M0 ${-len}L${-len*.14} 0H0z`,fill:'#efe0b8',stroke:'#3b2410','stroke-width':.6}); } });
    el(rg,'circle',{r:4,fill:'#b08a4a',stroke:'#3b2410'});
    el(rg,'path',{d:'M0-78l5 10h-10zM0-70v8',fill:'#3b2410',stroke:'#3b2410'});
    el(rg,'text',{y:-84,'text-anchor':'middle','font-size':15,'font-weight':700,fill:'#3b2410'},'N');
    // cartouche
    const ct=$('cart'), isle=pick(A)+' '+pick(B)+(R()<.6?' '+pick(C):'');
    el(ct,'path',{d:'M64 70q-10 30 0 60q10-6 20 0h250q10-6 20 0q10-30 0-60q-10 6-20 0H84q-10 6-20 0z',fill:'#ecdcb0',stroke:'#3b2410','stroke-width':1.6});
    el(ct,'text',{x:209,y:98,'text-anchor':'middle','font-size':11,'letter-spacing':4,fill:'#6b2618'},'A TRUE & FAITHFUL CHART OF');
    el(ct,'text',{x:209,y:122,'text-anchor':'middle','font-size':isle.length>20?19:23,'font-weight':700,'font-style':'italic',fill:'#2c1a0a'},isle);
    const sp=[rose[0]<500?700:300, rose[1]<350?620:90];
    el(ct,'text',{x:sp[0],y:sp[1],'text-anchor':'middle','font-size':19,'letter-spacing':6,'font-style':'italic',fill:'#4a2e14',opacity:.75},pick(SEA).toUpperCase());
    el(ct,'text',{x:sp[0],y:sp[1]+18,'text-anchor':'middle','font-size':11,'font-style':'italic',fill:'#4a2e14',opacity:.75},pick(NOTE));
    // scale bar
    const sb=el(ct,'g',{transform:`translate(${rose[0]<500?690:70} 628)`});
    for(let i=0;i<6;i++) el(sb,'rect',{x:i*36,y:0,width:36,height:6,fill:i%2?'#ecdcb0':'#3b2410',stroke:'#3b2410','stroke-width':.8});
    el(sb,'text',{x:108,y:-6,'text-anchor':'middle','font-size':10,'font-style':'italic',fill:'#3b2410'},'Leagues, as walked by a tired man');
    const tk=$('ticks'); for(let x=34;x<=966;x+=23.3){ el(tk,'line',{x1:x,y1:34,x2:x,y2:42}); el(tk,'line',{x1:x,y1:658,x2:x,y2:666}); } for(let y=34;y<=666;y+=22.57){ el(tk,'line',{x1:34,y1:y,x2:42,y2:y}); el(tk,'line',{x1:958,y1:y,x2:966,y2:y}); }
  }
  $('regen').addEventListener('click',()=>build(1000+Math.floor(Math.random()*8999)));
  build(1764);
})();
</script>
</body>
</html>
