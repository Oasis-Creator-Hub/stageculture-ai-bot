<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth — Soft UI Home Panel</title>
<meta name="description" content="A neumorphic smart-home control panel in a single soft tone, with a working thermostat dial, room toggles, light sliders and scenes.">
<style>
  :root{--bg:#e4e8ee;--hi:#ffffff;--lo:#b9c0cc;--ink:#56607a;--soft:#8c95aa;--acc:#f08a5d;--r:26px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
    padding:clamp(16px,4vw,44px);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .out{background:var(--bg);border-radius:var(--r);box-shadow:9px 9px 20px var(--lo),-9px -9px 20px var(--hi)}
  .in{background:var(--bg);border-radius:var(--r);box-shadow:inset 6px 6px 12px var(--lo),inset -6px -6px 12px var(--hi)}
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:30px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .back{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--soft);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.04em}
  h1{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.01em}
  h1 small{display:block;font-size:13px;font-weight:500;color:var(--soft);letter-spacing:.02em;margin-top:2px}
  .clock{padding:12px 22px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;border-radius:40px;color:var(--soft)}
  .clock b{color:var(--ink)}
  .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px}
  .card{padding:26px}
  h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:18px}
  /* dial */
  .thermo{display:flex;flex-direction:column;align-items:center}
  .dial{position:relative;width:min(290px,74vw);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;outline:none}
  .dial:focus-visible{box-shadow:9px 9px 20px var(--lo),-9px -9px 20px var(--hi),0 0 0 3px rgba(240,138,93,.5)}
  .dial svg{position:absolute;inset:0;width:100%;height:100%}
  .dial .well{position:absolute;inset:17%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .temp{font-size:clamp(46px,9vw,64px);font-weight:300;letter-spacing:-.04em;line-height:1;color:var(--ink)}
  .temp sup{font-size:.34em;font-weight:600;vertical-align:top;margin-left:2px;position:relative;top:.5em}
  .mode{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:8px;font-weight:700}
  .now{display:flex;gap:14px;width:100%;margin-top:26px}
  .now div{flex:1;padding:14px 10px;text-align:center;border-radius:18px;font-size:12px;color:var(--soft);font-weight:600}
  .now b{display:block;font-size:19px;color:var(--ink);font-weight:600;margin-bottom:2px}
  /* rooms */
  .rooms{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .room{padding:18px;border-radius:22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .3s}
  .room .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .room svg{width:26px;height:26px;fill:none;stroke:var(--soft);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
  .room.on svg{stroke:var(--acc)}
  .room strong{font-size:16px;font-weight:700}
  .room span{font-size:12px;color:var(--soft);font-weight:600}
  .tog{appearance:none;-webkit-appearance:none;width:52px;height:28px;border-radius:20px;border:0;cursor:pointer;position:relative;background:var(--bg);flex:none;
    box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
  .tog::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--bg);
    box-shadow:2px 2px 5px var(--lo),-2px -2px 5px var(--hi);transition:transform .3s cubic-bezier(.4,1.6,.5,1),background .3s}
  .tog:checked::after{transform:translateX(24px);background:var(--acc)}
  .tog:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
  input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:12px;border-radius:10px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,var(--acc) var(--p,50%),transparent var(--p,50%)),var(--bg);
    box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);transition:opacity .3s}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:0;box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--bg);border:0;box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}
  input[type=range]:disabled{opacity:.4;cursor:default}
  /* scenes */
  .scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .scene{border:0;font:inherit;color:var(--soft);font-weight:700;font-size:12px;letter-spacing:.05em;cursor:pointer;padding:16px 6px;border-radius:20px;background:var(--bg);
    box-shadow:6px 6px 13px var(--lo),-6px -6px 13px var(--hi);display:flex;flex-direction:column;align-items:center;gap:8px;transition:box-shadow .2s,color .2s}
  .scene svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .scene[aria-pressed=true]{box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi);color:var(--acc)}
  .scene:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
  .energy{display:flex;align-items:flex-end;gap:10px;height:110px;padding:16px;border-radius:20px}
  .energy i{flex:1;border-radius:8px;background:var(--bg);box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi);transition:height .6s cubic-bezier(.3,1.3,.5,1);min-height:8px}
  .energy i.hot{background:var(--acc);box-shadow:3px 3px 8px rgba(240,138,93,.45),-3px -3px 6px var(--hi)}
  .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);font-weight:600;margin-top:12px}
  .foot b{color:var(--ink)}
  .stack{display:flex;flex-direction:column;gap:28px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  @media (max-width:420px){.rooms{grid-template-columns:1fr}.scenes{grid-template-columns:1fr 1fr}.card{padding:20px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <a class="back out" href="index.html" aria-label="Back to index">←100</a>
      <h1>Hearth<small>Number 9, Linden Row · everyone is home</small></h1>
    </div>
    <div class="clock in"><b id="time">--:--</b> · <span id="day"></span></div>
  </header>

  <div class="grid">
    <section class="card out thermo">
      <h2 style="align-self:flex-start">Climate</h2>
      <div class="dial out" id="dial" tabindex="0" role="slider" aria-label="Target temperature" aria-valuemin="14" aria-valuemax="28">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <g id="ticks"></g>
          <path id="arc" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round"/>
          <circle id="nub" r="7" fill="var(--bg)" stroke="var(--acc)" stroke-width="3"/>
        </svg>
        <div class="well in"><div class="temp"><span id="tv">21.0</span><sup>°C</sup></div><div class="mode" id="mode">Holding</div></div>
      </div>
      <div class="now">
        <div class="in"><b id="inside">20.4°</b>Inside</div>
        <div class="in"><b>7.1°</b>Outside</div>
        <div class="in"><b>46%</b>Humidity</div>
      </div>
    </section>

    <div class="stack">
      <section class="card out">
        <h2>Rooms</h2>
        <div class="rooms" id="rooms"></div>
      </section>
      <section class="card out">
        <h2>Scenes</h2>
        <div class="scenes" id="scenes"></div>
      </section>
    </div>
  </div>

  <section class="card out" style="margin-top:28px">
    <h2>Today’s draw</h2>
    <div class="energy in" id="energy"></div>
    <div class="foot"><span>06:00</span><span>Now using <b id="kw">1.2 kW</b></span><span>24:00</span></div>
  </section>
</div>

<script>
(() => {
  const $=id=>document.getElementById(id);
  const ICON={
    lamp:'<path d="M9 3h6l3 9H6zM12 12v8M8 21h8"/>',
    sofa:'<path d="M5 11V8a3 3 0 013-3h8a3 3 0 013 3v3M3 12a2 2 0 014 0v3h10v-3a2 2 0 014 0v6H3zM6 18v2M18 18v2"/>',
    pot:'<path d="M4 10h16v6a4 4 0 01-4 4H8a4 4 0 01-4-4zM2 10h20M9 6c0-2 2-2 2-4M14 6c0-2 2-2 2-4"/>',
    bed:'<path d="M3 18V6M3 14h18v4M21 18v-6a3 3 0 00-3-3h-7v5M7 11.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>',
    leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 14zM5 19c3-5 6-8 10-10"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
    film:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
    moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
    door:'<path d="M6 21V4a1 1 0 011-1h10a1 1 0 011 1v17M4 21h16M14 12v1"/>'
  };
  const svg=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';
  const rooms=[{n:'Living room',i:'sofa',on:true,v:70},{n:'Kitchen',i:'pot',on:true,v:85},{n:'Bedroom',i:'bed',on:false,v:30},{n:'Conservatory',i:'leaf',on:false,v:55}];
  const scenes=[{n:'Morning',i:'sun',t:21,s:[[1,60],[1,90],[1,40],[0,55]]},{n:'Film',i:'film',t:22,s:[[1,18],[0,85],[0,30],[0,55]]},{n:'Night',i:'moon',t:17.5,s:[[0,70],[0,85],[1,12],[0,55]]},{n:'Away',i:'door',t:15,s:[[0,70],[0,85],[0,30],[0,55]]}];
  let target=21, inside=20.4; const bars=[];

  // dial
  const A0=135, SW=270, MIN=14, MAX=28, dial=$('dial');
  const pol=(deg,r)=>{ const a=deg*Math.PI/180; return [100+Math.cos(a)*r,100+Math.sin(a)*r]; };
  let tk=''; for(let i=0;i<=56;i++){ const d=A0+i/56*SW,[x1,y1]=pol(d,i%4?90:87),[x2,y2]=pol(d,94); tk+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--soft)" stroke-width="${i%4?.8:1.6}" opacity="${i%4?.45:.9}" stroke-linecap="round"/>`; }
  $('ticks').innerHTML=tk;
  function drawDial(){
    const f=(target-MIN)/(MAX-MIN), end=A0+f*SW,[sx,sy]=pol(A0,78),[ex,ey]=pol(end,78);
    $('arc').setAttribute('d',`M${sx} ${sy}A78 78 0 ${f*SW>180?1:0} 1 ${ex} ${ey}`);
    $('nub').setAttribute('cx',ex); $('nub').setAttribute('cy',ey);
    $('tv').textContent=target.toFixed(1); dial.setAttribute('aria-valuenow',target);
    const d=target-inside; $('mode').textContent=Math.abs(d)<.3?'Holding':d>0?'Warming':'Cooling';
    energy();
  }
  function fromPointer(e){
    const r=dial.getBoundingClientRect(); let a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI;
    let rel=(a-A0+360)%360; if(rel>SW) rel=rel>SW+45?0:SW;
    target=Math.round((MIN+rel/SW*(MAX-MIN))*2)/2; clearScene(); drawDial();
  }
  let dragging=false;
  dial.addEventListener('pointerdown',e=>{ dragging=true; dial.setPointerCapture(e.pointerId); fromPointer(e); e.preventDefault(); });
  dial.addEventListener('pointermove',e=>dragging&&fromPointer(e));
  dial.addEventListener('pointerup',()=>dragging=false); dial.addEventListener('pointercancel',()=>dragging=false);
  dial.addEventListener('keydown',e=>{ const d={ArrowUp:.5,ArrowRight:.5,ArrowDown:-.5,ArrowLeft:-.5}[e.key]; if(d){ target=Math.max(MIN,Math.min(MAX,target+d)); clearScene(); drawDial(); e.preventDefault(); } });
  setInterval(()=>{ inside+=Math.sign(target-inside)*Math.min(.1,Math.abs(target-inside)); $('inside').textContent=inside.toFixed(1)+'°'; drawDial(); },1500);

  // rooms
  const rw=$('rooms');
  rooms.forEach((r,i)=>{
    const d=document.createElement('div'); d.className='room'; r.el=d;
    d.innerHTML=`<div class="hd">${svg(r.i)}<input type="checkbox" class="tog" aria-label="${r.n} lights"></div><div><strong>${r.n}</strong><br><span></span></div><input type="range" min="1" max="100" aria-label="${r.n} brightness">`;
    r.tog=d.querySelector('.tog'); r.rng=d.querySelector('[type=range]'); r.lab=d.querySelector('span');
    r.tog.addEventListener('change',()=>{ r.on=r.tog.checked; clearScene(); paint(r); });
    r.rng.addEventListener('input',()=>{ r.v=+r.rng.value; clearScene(); paint(r); });
    rw.appendChild(d); paint(r);
  });
  function paint(r){
    r.tog.checked=r.on; r.rng.value=r.v; r.rng.disabled=!r.on; r.rng.style.setProperty('--p',(r.on?r.v:0)+'%');
    r.el.className='room '+(r.on?'in on':'out'); r.lab.textContent=r.on?'Lights at '+r.v+'%':'Lights off';
    energy();
  }
  // scenes
  const sw=$('scenes');
  scenes.forEach(sc=>{
    const b=document.createElement('button'); b.className='scene'; b.type='button'; b.setAttribute('aria-pressed','false'); b.innerHTML=svg(sc.i)+sc.n; sc.el=b;
    b.addEventListener('click',()=>{ scenes.forEach(x=>x.el.setAttribute('aria-pressed',x===sc)); target=sc.t; sc.s.forEach(([on,v],i)=>{ rooms[i].on=!!on; rooms[i].v=v; paint(rooms[i]); }); drawDial(); });
    sw.appendChild(b);
  });
  function clearScene(){ scenes.forEach(x=>x.el&&x.el.setAttribute('aria-pressed','false')); }
  // energy
  const en=$('energy'), base=[.2,.25,.5,.7,.45,.3,.28,.35,.4,.55,.8,.9,.6,.4,.3,.2,.15,.12];
  const nowIdx=Math.max(0,Math.min(17,new Date().getHours()-6));
  base.forEach((v,i)=>{ const b=document.createElement('i'); en.appendChild(b); bars.push(b); });
  function energy(){
    if(!bars.length||!rooms[3].tog) return;
    const load=rooms.reduce((a,r)=>a+(r.on?r.v/100*.18:0),0)+Math.max(0,target-inside)*.35+.25;
    bars.forEach((b,i)=>{ const v=i<nowIdx?base[i]:i===nowIdx?Math.min(1,load/2.4):.06; b.style.height=Math.max(8,v*100)+'%'; b.className=i===nowIdx?'hot':''; b.style.opacity=i>nowIdx?.5:1; });
    $('kw').textContent=load.toFixed(1)+' kW';
  }
  function clock(){ const d=new Date(); $('time').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); $('day').textContent=d.toLocaleDateString([], {weekday:'long'}); }
  clock(); setInterval(clock,20000); drawDial();
})();
</script>
</body>
</html>
