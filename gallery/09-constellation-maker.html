<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Coelestis Novus — draw and name your own constellations</title>
<meta name="description" content="An interactive star chart with no names yet. Click or tap stars to join them into figures, christen your constellations, and keep them in your own celestial atlas.">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#1c2545;--sepia:#6b5636;--paper:#eadfc6;--gold:#b98a2e;
  --serif:"Hoefler Text",Baskerville,"Baskerville Old Face","Libre Baskerville",Garamond,"EB Garamond","URW Bookman",Georgia,serif}
body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--serif);overflow-x:hidden;
  background-image:radial-gradient(120% 80% at 50% 30%,transparent 50%,rgba(107,86,54,.28)),repeating-linear-gradient(92deg,rgba(107,86,54,.035) 0 2px,transparent 2px 7px)}
.plate{max-width:1240px;margin:0 auto;padding:clamp(.8rem,2.5vw,2rem);display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);gap:clamp(1rem,3vw,2.6rem);align-items:start}
.chart{position:relative;width:100%;max-width:min(100%,calc(100vh - 2rem));aspect-ratio:1;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:50%;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px var(--sepia),0 0 0 7px var(--paper),0 0 0 8px var(--sepia),0 18px 40px rgba(60,40,10,.35)}
aside{padding-top:clamp(0rem,3vh,2rem)}
.home{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sepia);text-decoration:none}
.tab{font-variant:small-caps;letter-spacing:.3em;font-size:.86rem;color:var(--gold);margin-top:1.4rem}
h1{font-weight:400;font-size:clamp(2rem,4vw,3rem);line-height:1;margin:.5rem 0 .3rem;letter-spacing:.01em}
h1 em{display:block;font-size:.5em;margin-top:.6rem;color:var(--sepia)}
.rule{height:9px;border-block:1px solid var(--sepia);margin:1.2rem 0;position:relative}
.rule::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);background:var(--paper);padding:0 .7rem;color:var(--gold);font-size:.9rem}
p{line-height:1.55;font-size:1.02rem}
#state{font-style:italic;color:var(--sepia);margin-top:.8rem;min-height:3.1em}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
button{font:inherit;font-variant:small-caps;letter-spacing:.12em;font-size:.95rem;color:var(--ink);background:none;border:1px solid var(--ink);padding:.42rem .8rem;cursor:pointer;transition:.2s}
button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
button:disabled{opacity:.3;cursor:default}
button kbd{font:inherit;font-size:.72em;opacity:.6;margin-left:.3em}
form{display:none;margin-top:1rem;gap:.5rem}
form.on{display:flex}
input{flex:1;min-width:0;font:italic 1.1rem var(--serif);color:var(--ink);background:rgba(255,255,255,.35);border:0;border-bottom:1px solid var(--ink);padding:.4rem .3rem;outline:0}
input:focus{background:rgba(255,255,255,.7)}
form button{background:var(--ink);color:var(--paper)}
h2{font-weight:400;font-variant:small-caps;letter-spacing:.24em;font-size:1rem;color:var(--sepia);margin-top:1.6rem}
ol{list-style:none;padding:0;margin-top:.5rem;counter-reset:c}
li{counter-increment:c;display:flex;align-items:baseline;gap:.6rem;padding:.5rem 0;border-bottom:1px dotted var(--sepia);cursor:default}
li::before{content:counter(c,upper-roman) ".";font-size:.8rem;color:var(--gold);min-width:2.2em}
li b{font-weight:400;font-style:italic;font-size:1.12rem;flex:1;overflow-wrap:anywhere}
li small{color:var(--sepia);white-space:nowrap}
li button{border:0;padding:0 .3rem;font-size:1.1rem;line-height:1}
.empty{font-style:italic;color:var(--sepia);padding:.6rem 0}
.wipe{margin-top:1rem;border:0;border-bottom:1px solid var(--sepia);color:var(--sepia);padding:0 0 .1rem;font-size:.85rem}
@media(max-width:820px){.plate{grid-template-columns:1fr}aside{padding-top:0}.chart{max-width:min(100%,78vh)}}
</style>
</head>
<body>
<div class="plate">
  <div class="chart"><canvas id="sky" aria-label="Star chart. Click stars to join them into a constellation."></canvas></div>
  <aside>
    <a class="home" href="index.html">← 100</a>
    <p class="tab">Tabula I · Northern sky</p>
    <h1>Atlas Coelestis Novus<em>being a chart of the heavens on which nothing has yet been named</em></h1>
    <div class="rule"></div>
    <p>Touch a star to set down your pen, then another to rule a line between them. When the figure pleases you, christen it.</p>
    <p id="state"></p>
    <div class="tools"><button id="undo" type="button">Undo<kbd>Z</kbd></button><button id="lift" type="button">Lift pen<kbd>Esc</kbd></button><button id="done" type="button">Christen…</button></div>
    <form id="form"><input id="name" maxlength="36" aria-label="Constellation name" autocomplete="off"><button>Inscribe</button></form>
    <h2>Figures inscribed</h2>
    <ol id="list"></ol>
    <button class="wipe" id="wipe" type="button">Scrape the plate clean</button>
  </aside>
</div>
<script>
(()=>{
const cv=document.getElementById('sky'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
// fixed star catalogue (seeded so saved figures keep their stars)
let s=20260;const rnd=()=>(s=s*16807%2147483647)/2147483647;
const stars=[];while(stars.length<250){const r=Math.sqrt(rnd())*.9,a=rnd()*6.2832,x=r*Math.cos(a),y=r*Math.sin(a);
  if(stars.some(q=>Math.hypot(q.x-x,q.y-y)<.042))continue;const m=Math.pow(rnd(),2.4);
  stars.push({x,y,m,ph:rnd()*6.28,sp:.6+rnd()*1.8,c:rnd()<.12?'#ffd9a8':rnd()<.14?'#cfe0ff':'#f7eed6'})}
let figs=[],cur={segs:[],pen:null},hover=-1,ptr=null,hot=-1,W=0,R=0,bg=null,dirty=true;
try{const v=JSON.parse(localStorage.getItem('atlas-novus-v1')||'[]');if(Array.isArray(v))figs=v.filter(f=>f&&typeof f.name==='string'&&Array.isArray(f.segs)&&f.segs.every(q=>stars[q[0]]&&stars[q[1]]))}catch(e){}
const save=()=>{try{localStorage.setItem('atlas-novus-v1',JSON.stringify(figs))}catch(e){}};
const P=i=>[W/2+stars[i].x*R,W/2+stars[i].y*R];
function resize(){const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth;if(!w)return;W=w;R=W/2*.93;cv.width=cv.height=Math.round(W*dpr);g.setTransform(dpr,0,0,dpr,0,0);
  bg=document.createElement('canvas');bg.width=bg.height=cv.width;const b=bg.getContext('2d');b.setTransform(dpr,0,0,dpr,0,0);const c=W/2;
  const gr=b.createRadialGradient(c*.9,c*.8,0,c,c,c);gr.addColorStop(0,'#1d2f5c');gr.addColorStop(.6,'#132043');gr.addColorStop(1,'#0a1229');b.fillStyle=gr;b.fillRect(0,0,W,W);
  // a milky band
  b.save();b.translate(c,c);b.rotate(-.6);for(let i=0;i<70;i++){const x=(rnd()-.5)*W*1.1,y=(rnd()-.5)*W*.16,r=W*(.04+rnd()*.07);const m=b.createRadialGradient(x,y,0,x,y,r);m.addColorStop(0,'rgba(190,205,240,.05)');m.addColorStop(1,'rgba(190,205,240,0)');b.fillStyle=m;b.fillRect(x-r,y-r,2*r,2*r)}b.restore();
  b.strokeStyle='rgba(226,208,160,.13)';b.lineWidth=1;
  for(let i=1;i<=4;i++){b.beginPath();b.arc(c,c,R*i/4.15,0,6.2832);b.stroke()}
  for(let i=0;i<24;i++){const a=i*Math.PI/12;b.beginPath();b.moveTo(c+Math.cos(a)*R*.06,c+Math.sin(a)*R*.06);b.lineTo(c+Math.cos(a)*R*.965,c+Math.sin(a)*R*.965);b.stroke()}
  b.strokeStyle='rgba(226,208,160,.75)';b.beginPath();b.arc(c,c,R*.965,0,6.2832);b.stroke();
  b.fillStyle='rgba(226,208,160,.8)';b.font='italic '+Math.max(8,W*.018)+'px Georgia,serif';b.textAlign='center';b.textBaseline='middle';
  for(let i=0;i<360;i+=3){const a=i*Math.PI/180,l=i%15?(.018):.035;b.beginPath();b.moveTo(c+Math.cos(a)*R*.965,c+Math.sin(a)*R*.965);b.lineTo(c+Math.cos(a)*R*(.965+l),c+Math.sin(a)*R*(.965+l));b.stroke();
    if(i%30==0&&W>420){b.save();b.translate(c+Math.cos(a)*R*1.045,c+Math.sin(a)*R*1.045);b.rotate(a+Math.PI/2);b.fillText((i/15)+'h',0,0);b.restore()}}
  dirty=true}
function line(segs,style,w,dash){g.strokeStyle=style;g.lineWidth=w;g.setLineDash(dash||[]);g.lineCap='round';g.beginPath();for(const[a,b]of segs){const p=P(a),q=P(b);g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1])}g.stroke();g.setLineDash([])}
function draw(t){
  g.drawImage(bg,0,0,W,W);const k=W/700;
  figs.forEach((f,i)=>{const on=i===hot;line(f.segs,on?'rgba(255,236,170,.95)':'rgba(233,214,160,.6)',on?2:1.2);
    const ids=[...new Set(f.segs.flat())];let x=0,y=0,top=1e9;ids.forEach(j=>{const p=P(j);x+=p[0];y+=p[1];top=Math.min(top,p[1])});x/=ids.length;
    g.font='italic '+Math.max(11,15*k)+'px "Hoefler Text",Baskerville,Garamond,Georgia,serif';g.textAlign='center';g.textBaseline='alphabetic';
    const yy=Math.max(24,top-12*k);g.lineWidth=4;g.strokeStyle='rgba(10,18,41,.85)';g.strokeText(f.name,x,yy);g.fillStyle=on?'#fff3c4':'#ead9a6';g.fillText(f.name,x,yy)});
  line(cur.segs,'#f3cf6b',1.6,[6,5]);
  if(cur.pen!==null&&ptr&&ptr.mouse){const p=P(cur.pen),q=hover>=0?P(hover):[ptr.x,ptr.y];g.strokeStyle='rgba(243,207,107,.45)';g.lineWidth=1;g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
  const used=new Set(cur.segs.flat());if(cur.pen!==null)used.add(cur.pen);
  for(let i=0;i<stars.length;i++){const st=stars[i],p=P(i),tw=still?1:.78+.22*Math.sin(t*st.sp+st.ph),r=(.7+st.m*2.9)*Math.max(.75,k)*tw;
    if(st.m>.35){g.globalAlpha=.16*tw;g.fillStyle=st.c;g.beginPath();g.arc(p[0],p[1],r*3.4,0,6.2832);g.fill()}
    g.globalAlpha=.55+.45*tw;g.fillStyle=st.c;g.beginPath();g.arc(p[0],p[1],r,0,6.2832);g.fill();g.globalAlpha=1;
    if(used.has(i)){g.strokeStyle='#f3cf6b';g.lineWidth=1;g.beginPath();g.arc(p[0],p[1],r+4,0,6.2832);g.stroke()}}
  if(hover>=0){const p=P(hover);g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.arc(p[0],p[1],9*Math.max(.8,k),0,6.2832);g.stroke()}
  if(cur.pen!==null){const p=P(cur.pen);g.strokeStyle='#f3cf6b';g.lineWidth=1.5;g.beginPath();g.arc(p[0],p[1],12*Math.max(.8,k),0,6.2832);g.stroke()}
}
function loop(now){if(!still||dirty){draw(now/1000);dirty=false}requestAnimationFrame(loop)}
const near=(x,y,tol)=>{let best=-1,bd=tol;for(let i=0;i<stars.length;i++){const p=P(i),d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=i}}return best};
const at=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,mouse:e.pointerType==='mouse'}};
cv.addEventListener('pointermove',e=>{ptr=at(e);hover=ptr.mouse?near(ptr.x,ptr.y,18):-1;dirty=true});
cv.addEventListener('pointerleave',()=>{hover=-1;ptr=null;dirty=true});
cv.addEventListener('pointerdown',e=>{const q=at(e),i=near(q.x,q.y,q.mouse?18:30);if(i<0)return;e.preventDefault();
  if(cur.pen===null)cur.pen=i;else if(i!==cur.pen){if(!cur.segs.some(([a,b])=>(a===cur.pen&&b===i)||(a===i&&b===cur.pen)))cur.segs.push([cur.pen,i]);cur.pen=i}ui()});
const names=()=>{const a=['The Lesser','The Sleeping','The Drowned','Old','The Patient','The Unfinished','The Borrowed','The Northern'],b=['Kettle','Heron','Ladder','Fox','Loom','Anchor','Moth','Bell','Staircase','Glove','Orchard','Lantern'];return a[Math.random()*a.length|0]+' '+b[Math.random()*b.length|0]};
function ui(){dirty=true;const n=cur.segs.length;
  $('state').textContent=cur.pen===null&&!n?'The pen is lifted. Choose any star to begin.':cur.pen===null?'Pen lifted — '+n+' line'+(n>1?'s':'')+' ruled. Touch a star to start another stroke, or christen the figure.':n?n+' line'+(n>1?'s':'')+' ruled. Carry on, or christen it.':'Pen set down. Now choose a second star.';
  $('undo').disabled=!n&&cur.pen===null;$('lift').disabled=cur.pen===null;$('done').disabled=!n;if(!n)$('form').classList.remove('on');
  const ol=$('list');ol.innerHTML='';if(!figs.length){const d=document.createElement('div');d.className='empty';d.textContent='None yet. The sky is waiting on you.';ol.appendChild(d)}
  figs.forEach((f,i)=>{const li=document.createElement('li'),b=document.createElement('b'),sm=document.createElement('small'),x=document.createElement('button');
    b.textContent=f.name;sm.textContent=new Set(f.segs.flat()).size+' stars';x.textContent='×';x.type='button';x.setAttribute('aria-label','Erase '+f.name);
    x.onclick=()=>{figs.splice(i,1);hot=-1;save();ui()};li.onpointerenter=()=>{hot=i;dirty=true};li.onpointerleave=()=>{hot=-1;dirty=true};li.append(b,sm,x);ol.appendChild(li)});
  $('wipe').style.display=figs.length?'':'none'}
const undo=()=>{if(cur.segs.length){const sgm=cur.segs.pop();cur.pen=sgm[0]}else cur.pen=null;ui()};
const lift=()=>{cur.pen=null;ui()};
const christen=()=>{if(!cur.segs.length)return;const f=$('form'),i=$('name');f.classList.add('on');i.value='';i.placeholder=names();i.focus()};
$('undo').onclick=undo;$('lift').onclick=lift;$('done').onclick=christen;
$('form').addEventListener('submit',e=>{e.preventDefault();if(!cur.segs.length)return;const i=$('name');figs.push({name:(i.value.trim()||i.placeholder).slice(0,36),segs:cur.segs});cur={segs:[],pen:null};save();ui()});
$('wipe').onclick=()=>{figs=[];save();ui()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Escape')$('form').classList.remove('on');return}
  if(e.key==='z'||e.key==='Z')undo();else if(e.key==='Escape')lift();else if(e.key==='Enter'&&e.target.tagName!=='BUTTON')christen()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,100)});
resize();ui();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
