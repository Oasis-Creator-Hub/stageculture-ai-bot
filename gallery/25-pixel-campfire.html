<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERWATCH — Night at Loon Hollow</title>
<meta name="description" content="A pixel-art night campsite on a low-res canvas: a living fire, drifting sparks, twinkling stars and an 8-bit conversation by the embers. Tap the fire to stoke it.">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:#05060f; }
  body { font-family:"Courier New","Lucida Console",Monaco,monospace; color:#f4f1de; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; left:0; top:0; display:block; image-rendering:pixelated; image-rendering:crisp-edges; cursor:pointer; touch-action:manipulation; }
  .hud { position:fixed; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; z-index:3; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  .chip { font:700 12px/1 "Courier New",monospace; letter-spacing:.1em; text-transform:uppercase; color:#f4f1de; background:#10122a; text-decoration:none;
    padding:7px 9px; border:0; box-shadow:0 0 0 2px #f4f1de, 0 0 0 4px #10122a; cursor:pointer; }
  .chip:hover, .chip:focus-visible { background:#e07a2f; color:#10122a; outline:none; }
  .title { text-align:center; font-weight:700; font-size:12px; letter-spacing:.3em; color:#ffd166; text-shadow:2px 2px 0 #10122a; padding-top:6px; }
  .title small { display:block; color:#8fa3d8; letter-spacing:.18em; font-size:10px; margin-top:4px; }
  .dlg { position:fixed; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(600px,calc(100vw - 28px)); z-index:3;
    background:#0b0c1e; padding:14px 16px 16px; cursor:pointer; text-align:left; border:0; color:inherit; font:inherit;
    box-shadow: 0 -4px 0 0 #f4f1de, 0 4px 0 0 #f4f1de, -4px 0 0 0 #f4f1de, 4px 0 0 0 #f4f1de, 0 0 0 4px #0b0c1e, 0 -8px 0 0 #0b0c1e, 0 8px 0 0 #0b0c1e, -8px 0 0 0 #0b0c1e, 8px 0 0 0 #0b0c1e; }
  .dlg:focus-visible { outline:2px dashed #ffd166; outline-offset:10px; }
  .who { display:inline-block; font-weight:700; font-size:12px; letter-spacing:.2em; padding:3px 8px; margin:-26px 0 8px -4px; background:#ffd166; color:#0b0c1e; position:relative; top:-10px; }
  .who.b { background:#7bdff2; } .who.f { background:#e07a2f; }
  .line { font-weight:700; font-size:clamp(14px,2.4vw,17px); line-height:1.5; letter-spacing:.04em; text-transform:uppercase; min-height:4.5em; white-space:pre-wrap; }
  .more { position:absolute; right:12px; bottom:8px; color:#ffd166; animation:blink .9s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .more { animation:none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Pixel-art campsite at night with an animated fire"></canvas>
<div class="hud">
  <a class="chip" href="index.html">← 100</a>
  <div class="title">EMBERWATCH<small>LOON HOLLOW · NIGHT 3</small></div>
  <button class="chip" id="snd" aria-pressed="false">♪ OFF</button>
</div>
<button class="dlg" id="dlg" aria-live="polite">
  <span class="who" id="who">MOSS</span>
  <div class="line" id="line"></div>
  <span class="more" id="more">▼</span>
</button>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let LW = 180, LH = 110, S = 4, GY = 0, CX = 0, stars = [], hills = [], trees = [], sparks = [], flies = [];
  let stoke = 0, tick = 0, shoot = null;

  // doom-style fire buffer
  const FW = 30, FH = 34, fire = new Uint8Array(FW * FH);
  const FP = ['', '#3a0d12', '#5c1414', '#7d1c14', '#a02a12', '#c0400f', '#d95a12', '#e87a1c', '#f29a2a', '#f8b93c', '#fcd458', '#fee98a', '#fff7c8', '#ffffff'];
  function stepFire() {
    const heat = Math.min(13, 10 + Math.round(stoke * 3));
    for (let x = 0; x < FW; x++) { const d = Math.abs(x - FW / 2 + .5) / (FW / 2); fire[(FH - 1) * FW + x] = d < .62 + stoke * .2 ? heat - ((Math.random() * 3) | 0) : d < .8 ? 4 + ((Math.random() * 4) | 0) : 0; }
    for (let y = 0; y < FH - 1; y++) for (let x = 0; x < FW; x++) {
      const r = (Math.random() * 3) | 0, src = (y + 1) * FW + Math.min(FW - 1, Math.max(0, x + r - 1));
      const edge = Math.abs(x - FW / 2 + .5) / (FW / 2);
      const decay = (Math.random() < .42 + edge * .5 - stoke * .12) ? 1 : 0;
      fire[y * FW + x] = Math.max(0, fire[src] - decay);
    }
  }

  let s = 12345; const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  function layout() {
    S = Math.max(2, Math.round(Math.min(innerWidth / 150, innerHeight / 108)));
    LW = Math.ceil(innerWidth / S); LH = Math.ceil(innerHeight / S);
    cv.width = LW; cv.height = LH; cv.style.width = LW * S + 'px'; cv.style.height = LH * S + 'px';
    const dlgH = Math.ceil(document.getElementById('dlg').offsetHeight / S) + 10;
    GY = LH - Math.max(30, dlgH + 14); CX = Math.round(LW / 2);
    s = 4242; stars = [];
    const n = Math.min(260, Math.round(LW * GY / 90));
    for (let i = 0; i < n; i++) stars.push({ x: (rnd() * LW) | 0, y: (rnd() * rnd() * (GY - 8)) | 0, p: rnd() * 6.28, b: rnd(), c: rnd() < .12 ? '#ffd9a0' : rnd() < .2 ? '#a9c7ff' : '#ffffff' });
    hills = [[], []];
    for (let x = 0; x < LW; x++) {
      hills[0][x] = Math.round(GY - 20 - Math.sin(x * .045 + 1) * 9 - Math.sin(x * .11) * 4 - Math.abs(Math.sin(x * .02 + 2)) * 14);
      hills[1][x] = Math.round(GY - 8 - Math.sin(x * .07 + 4) * 5 - Math.sin(x * .19) * 2);
    }
    trees = [];
    for (let x = 2; x < LW; x += 5 + ((rnd() * 7) | 0)) { if (Math.abs(x - CX) < 46) continue; trees.push({ x, h: 16 + ((rnd() * 20) | 0), d: rnd() }); }
    flies = []; for (let i = 0; i < 7; i++) flies.push({ x: rnd() * LW, y: GY - 4 - rnd() * 22, p: rnd() * 6.28 });
  }

  const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); };
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); };
  function sprite(rows, pal, x, y, flip) {
    for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
      const ch = rows[j][i]; if (ch === '.') continue; px(x + (flip ? rows[j].length - 1 - i : i), y + j, pal[ch]);
    }
  }
  const CAMPER = ['..hhhh....', '.hhhhhhh..', '..ssss....', '..ssse....', '..ssss....', '.jjjjj....', '.jjjjjj...', '.jjjjjjss.', '.jjjjj....', '.pppppp...', '.ppppppp..', '......bb..'];
  const PAL_A = { h: '#c8553d', s: '#e9b68a', e: '#1a1423', j: '#3d6b5a', p: '#2b3a67', b: '#1a1423' };
  const PAL_B = { h: '#f2c14e', s: '#c98d62', e: '#1a1423', j: '#7b4b94', p: '#34435e', b: '#1a1423' };
  const TENT = ['.........a.........', '........aab........', '.......aaabb.......', '......aaaabbb......', '.....aaaadbbbb.....', '....aaaaaddbbbb....', '...aaaaadddbbbbb...', '..aaaaaaddddbbbbb..', '.aaaaaaadddddbbbbb.', 'aaaaaaaaddddddbbbbb'];
  const PAL_T = { a: '#d1603d', b: '#8f3b2b', d: '#2a1220' };
  const SKY = ['#070818', '#0a0d24', '#0e1332', '#131b42', '#192552', '#20315f', '#2a3f6b', '#345074'];

  function draw(t) {
    // banded, dithered sky
    const bandH = GY / SKY.length;
    for (let i = 0; i < SKY.length; i++) rect(0, Math.floor(i * bandH), LW, Math.ceil(bandH) + 1, SKY[i]);
    for (let i = 1; i < SKY.length; i++) { const y = Math.floor(i * bandH); ctx.fillStyle = SKY[i];
      for (let x = 0; x < LW; x += 2) { ctx.fillRect(x, y - 1, 1, 1); if (x % 4 === 0) ctx.fillRect(x + 1, y - 3, 1, 1); } }
    // stars
    for (const st of stars) { const tw = reduce ? 1 : Math.sin(t * (1 + st.b * 2) + st.p); if (tw < -.55) continue; px(st.x, st.y, tw > .8 || st.b > .9 ? st.c : '#8f9cc9');
      if (st.b > .965 && tw > .5) { px(st.x - 1, st.y, '#6f7fb8'); px(st.x + 1, st.y, '#6f7fb8'); px(st.x, st.y - 1, '#6f7fb8'); px(st.x, st.y + 1, '#6f7fb8'); } }
    // moon
    const mx = Math.round(LW * .8), my = Math.round(Math.max(22, GY * .22));
    ctx.fillStyle = '#f4f1de'; for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) if (x * x + y * y <= 50 && (x - 4) * (x - 4) + (y + 2) * (y + 2) > 42) ctx.fillRect(mx + x, my + y, 1, 1);
    // shooting star
    if (shoot) { for (let i = 0; i < 7; i++) px(shoot.x - i * 2, shoot.y - i, i < 2 ? '#fff' : i < 4 ? '#a9c7ff' : '#4a5a94'); shoot.x += 3; shoot.y += 1.5; if (--shoot.l < 0) shoot = null; }
    else if (!reduce && Math.random() < .002) shoot = { x: Math.random() * LW * .7, y: 6 + Math.random() * GY * .3, l: 16 };
    // hills
    for (let x = 0; x < LW; x++) { rect(x, hills[0][x], 1, GY - hills[0][x], '#16213f'); }
    for (let x = 0; x < LW; x++) { rect(x, hills[1][x], 1, GY - hills[1][x], '#0f1730'); }
    // pines
    for (const tr of trees) { const c = tr.d > .5 ? '#0a1322' : '#0c1a26';
      for (let k = 0; k < tr.h; k++) { const w = 1 + ((k % 5) + Math.floor(k / 5) * 2); rect(tr.x - (w >> 1), GY - tr.h + k - 2, w, 1, c); } rect(tr.x, GY - 3, 1, 4, '#0a0f18'); }
    // ground
    rect(0, GY, LW, LH - GY, '#0d1a1c'); rect(0, GY, LW, 1, '#18302c');
    for (let i = 0; i < LW; i += 3) { const gx = (i * 37) % LW; px(gx, GY + 2 + (i * 13) % Math.max(4, LH - GY - 3), '#132624'); if (i % 9 === 0) px(gx, GY - 1, '#18302c'); }
    // firelight: dithered warm pool
    const fl = 26 + stoke * 12 + (reduce ? 0 : Math.sin(t * 9) * 1.5 + Math.sin(t * 23) * 1);
    const fy = GY + 6;
    for (let y = GY; y < Math.min(LH, GY + 22); y++) for (let x = Math.max(0, CX - 60); x < Math.min(LW, CX + 60); x++) {
      const dx = (x - CX) / 2.2, dy = (y - fy) * 1.6, d = Math.sqrt(dx * dx + dy * dy);
      if (d < fl * .45) px(x, y, (x + y) % 2 ? '#6b3a22' : '#5a2f1e'); else if (d < fl * .7) { if ((x + y) % 2) px(x, y, '#3d2a20'); } else if (d < fl) { if ((x + y * 2) % 4 === 0) px(x, y, '#2a2420'); }
    }
    // tent, logs, campers
    const tx = Math.min(LW - 22, CX + 34);
    sprite(TENT, PAL_T, tx, GY - 9, false); rect(tx - 1, GY + 1, 21, 1, '#0a1214');
    const ax = CX - 28, bx = CX + 16;
    rect(ax - 2, GY + 2, 14, 3, '#4a2f1d'); rect(ax - 2, GY + 2, 14, 1, '#6a4428'); rect(bx - 1, GY + 2, 14, 3, '#4a2f1d'); rect(bx - 1, GY + 2, 14, 1, '#6a4428');
    const bob = reduce ? 0 : (Math.sin(t * 1.3) > .92 ? 1 : 0);
    sprite(CAMPER, PAL_A, ax, GY - 9 + (speaker === 0 ? bob : 0), false);
    sprite(CAMPER, PAL_B, bx, GY - 9 + (speaker === 1 ? bob : 0), true);
    // warm rim light on campers
    ctx.fillStyle = 'rgba(255,170,80,.55)'; ctx.fillRect(ax + 7, GY - 4, 1, 4); ctx.fillRect(bx + 2, GY - 4, 1, 4);
    // marshmallow stick
    for (let i = 0; i < 9; i++) px(ax + 9 + i, GY - 2 - (i >> 2), '#8a6a44'); rect(ax + 17, GY - 5, 2, 2, stoke > .5 ? '#c98d62' : '#f4f1de');
    // stones + logs + fire
    for (let i = -7; i <= 7; i += 2) { rect(CX + i * 1.6 - 1, fy + 2 + (Math.abs(i) < 5 ? 1 : 0), 3, 2, '#3b4252'); px(CX + i * 1.6 - 1, fy + 2 + (Math.abs(i) < 5 ? 1 : 0), '#59627a'); }
    rect(CX - 9, fy, 18, 2, '#2c1a12'); rect(CX - 7, fy - 1, 14, 1, '#402416');
    const ox = CX - FW / 2, oy = fy - FH + 1;
    for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) { const v = fire[y * FW + x]; if (v > 1) px(ox + x, oy + y, FP[v]); }
    for (let i = -6; i <= 6; i += 3) px(CX + i, fy, tick % 6 < 3 ? '#f29a2a' : '#c0400f');
    // sparks
    if (!reduce && sparks.length < 70 && Math.random() < .25 + stoke) sparks.push({ x: CX + (Math.random() - .5) * 10, y: fy - 10, vx: (Math.random() - .5) * .5, vy: -.4 - Math.random() * .7 - stoke * .5, l: 30 + Math.random() * 50 });
    for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.x += p.vx + Math.sin(p.l * .3) * .25; p.y += p.vy; p.vy *= .992; p.l--;
      if (p.l < 0 || p.y < 0) { sparks.splice(i, 1); continue; } px(p.x, p.y, p.l > 45 ? '#fff7c8' : p.l > 22 ? '#f8b93c' : '#c0400f'); }
    // fireflies
    for (const f of flies) { if (!reduce) { f.x += Math.sin(t * .7 + f.p) * .15; f.y += Math.cos(t * .9 + f.p * 2) * .08; } if (Math.abs(f.x - CX) > 30 && Math.sin(t * 2 + f.p) > 0) px(f.x, f.y, '#d8f08a'); }
  }

  // dialogue
  const SCRIPT = [
    [0, 'You ever notice the fire only talks when nobody is listening?'],
    [1, 'It is talking right now. It says you burned the last marshmallow.'],
    [0, 'That was a sacrifice. To the fire. For good weather.'],
    [2, '* crackle *  ...  * pop *'],
    [1, 'See? It accepts. Clear skies until the ridge, at least.'],
    [0, 'Forty-one stars over the lake tonight. I counted twice.'],
    [1, 'There are more than forty-one stars, Moss.'],
    [0, 'Not over the lake. The rest are over other people.'],
    [2, '( Tap the fire to give it another log. )'],
    [1, 'Bank the coals. We walk at first light, and the map is mostly guesses.'],
    [0, 'Best kind of map.']
  ];
  const NAMES = ['MOSS', 'JUNIPER', 'THE FIRE'], CLS = ['', 'b', 'f'];
  const who = document.getElementById('who'), line = document.getElementById('line'), more = document.getElementById('more'), dlg = document.getElementById('dlg');
  let idx = -1, chars = 0, speaker = 0, typing = false, typeT = 0;
  function next() {
    if (typing) { chars = SCRIPT[idx][1].length; typing = false; line.textContent = SCRIPT[idx][1]; more.style.visibility = 'visible'; return; }
    idx = (idx + 1) % SCRIPT.length; speaker = SCRIPT[idx][0]; chars = 0; typing = true; more.style.visibility = 'hidden';
    who.textContent = NAMES[speaker]; who.className = 'who ' + CLS[speaker]; line.textContent = ''; blip(speaker === 2 ? 110 : speaker ? 520 : 330, .06);
    if (reduce) next();
  }
  function typeStep() {
    if (!typing) return; const full = SCRIPT[idx][1]; chars++; line.textContent = full.slice(0, chars);
    if (chars % 3 === 0 && full[chars - 1] !== ' ') blip(speaker === 2 ? 90 + Math.random() * 60 : speaker ? 620 : 410, .025);
    if (chars >= full.length) { typing = false; more.style.visibility = 'visible'; }
  }
  dlg.addEventListener('click', next);
  addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && document.activeElement !== dlg && document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'A') { e.preventDefault(); next(); } });

  // sound (opt-in)
  let ac = null, sound = false; const sndBtn = document.getElementById('snd');
  function blip(f, d) { if (!sound || !ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.value = .03;
    g.gain.exponentialRampToValueAtTime(.0005, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); }
  sndBtn.addEventListener('click', () => { sound = !sound; if (sound) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) { sound = false; } }
    sndBtn.textContent = sound ? '♪ ON' : '♪ OFF'; sndBtn.setAttribute('aria-pressed', sound); blip(660, .08); });

  // stoke the fire
  cv.addEventListener('pointerdown', e => {
    const x = e.clientX / S, y = e.clientY / S;
    if (Math.abs(x - CX) < 24 && y > GY - 36 && y < GY + 16) { stoke = 1; blip(140, .12);
      if (!reduce) for (let i = 0; i < 26; i++) sparks.push({ x: CX + (Math.random() - .5) * 14, y: GY - 4, vx: (Math.random() - .5) * 1.4, vy: -1 - Math.random() * 1.6, l: 40 + Math.random() * 50 }); }
    else next();
  });

  let last = 0, acc = 0;
  function frame(now) {
    const dt = Math.min(100, now - last); last = now; acc += dt; typeT += dt;
    if (typeT > 34) { typeT = 0; typeStep(); }
    const stepMs = reduce ? 260 : 55;
    if (acc >= stepMs) { acc = 0; tick++; stepFire(); stoke = Math.max(0, stoke - .012); draw(now / 1000); }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { layout(); draw(performance.now() / 1000); });
  layout(); for (let i = 0; i < 40; i++) stepFire(); next(); layout(); draw(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
