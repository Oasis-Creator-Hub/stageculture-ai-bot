<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera — A Living Voronoi Mosaic</title>
<meta name="description" content="An interactive Voronoi mosaic on canvas: jewel-toned tesserae reshape themselves around drifting seeds. Click or drag to set new stones and switch between enamel palettes.">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0a10}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:copy}
.plaque{position:fixed;left:50%;bottom:clamp(10px,2.4vh,24px);transform:translateX(-50%);width:min(94vw,860px);display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 18px;
  background:rgba(250,244,230,.94);color:#231c14;border:1px solid #b08d3c;outline:1px solid #b08d3c;outline-offset:-5px;box-shadow:0 14px 40px rgba(0,0,0,.6);
  font-family:"Didot","Bodoni MT","Bodoni 72","Playfair Display","Times New Roman",serif}
.plaque h1{margin:0;font-weight:400;font-style:italic;font-size:clamp(22px,3vw,30px);line-height:1;letter-spacing:.01em}
.plaque h1 small{display:block;font-style:normal;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;margin-top:5px;color:#7d6a45;font-family:"Helvetica Neue",Arial,sans-serif}
.pal{display:flex;gap:8px;margin-left:auto}
.pal button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #b08d3c;cursor:pointer;padding:0;transition:transform .2s}
.pal button[aria-pressed=true]{transform:scale(1.18);box-shadow:0 0 0 2px #231c14}
.ops{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ops button{font:11px "Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;background:none;border:1px solid #231c14;color:#231c14;padding:9px 12px;cursor:pointer}
.ops button:hover,.ops button[aria-pressed=true]{background:#231c14;color:#faf4e6}
.ops label{font:10px "Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:#7d6a45}
input[type=range]{width:90px;accent-color:#8a1f3a}
#n{font-style:italic;font-size:15px;color:#7d6a45;min-width:74px;text-align:right}
a.back{position:fixed;left:14px;top:12px;color:#faf4e6;font:11px "Helvetica Neue",Arial,sans-serif;letter-spacing:.24em;text-decoration:none;background:rgba(12,10,16,.6);padding:7px 10px;border:1px solid rgba(250,244,230,.4)}
@media(max-width:620px){.pal{margin-left:0}.plaque{padding:10px 14px}#n{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Voronoi mosaic. Click or drag to add stones."></canvas>
<a class="back" href="index.html">← 100</a>
<div class="plaque">
  <h1>Tessera<small>a mosaic that will not hold still</small></h1>
  <div class="pal" id="pal" role="group" aria-label="Palette"></div>
  <div class="ops">
    <label>Drift <input id="sp" type="range" min="0" max="100" value="40" aria-label="Drift speed"></label>
    <button id="scatter">Scatter</button><button id="thin">Thin</button><button id="lead" aria-pressed="false">Glass</button>
    <span id="n"></span>
  </div>
</div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const PAL={
 Byzantine:['#1d3fa6','#0f2a6b','#c9962c','#e8c45a','#8a1f3a','#0e6b55','#3c68d8','#f1e6c4'],
 Peacock:['#0b7a75','#12a79d','#0d3b66','#3a1f6b','#7ad1c4','#c8b34a','#145c9e','#1f8a4c'],
 Garnet:['#6e0f2c','#a3173d','#d9482b','#f08a3c','#f3c969','#3d0a2a','#c22d5a','#5a1a4a'],
 Seaglass:['#9fd9c9','#5fb6b0','#2f7f93','#d7ecd9','#7fa7c9','#3f5f8a','#bfe3ea','#e9f1dc']};
const names=Object.keys(PAL);let pal='Byzantine',seeds=[],W=0,H=0,dpr=1,speed=.4,glass=false,hx=-1,hy=-1,lastAdd=null,down=false,last=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){speed=0;document.getElementById('sp').value=0}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function tint(s){const c=hex(PAL[pal][s.k%PAL[pal].length]),j=.82+s.j*.36;s.tc=c.map(v=>Math.min(255,v*j))}
function add(x,y){if(seeds.length>=240)seeds.shift();const a=Math.random()*6.283,s={x,y,vx:Math.cos(a),vy:Math.sin(a),k:Math.random()*64|0,j:Math.random(),ph:Math.random()*6.283,born:performance.now()};tint(s);s.c=[240,230,200];seeds.push(s);count()}
function count(){document.getElementById('n').textContent=seeds.length+' stones'}
function scatter(n){seeds=[];for(let i=0;i<n;i++)add(Math.random()*W,Math.random()*H);seeds.forEach(s=>{s.c=s.tc.slice();s.born=0})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);const ow=W,oh=H;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  if(ow)seeds.forEach(s=>{s.x*=W/ow;s.y*=H/oh});else scatter(Math.max(28,Math.min(110,W*H/14000|0)))}
function cell(s){let p=[[-4,-4],[W+4,-4],[W+4,H+4],[-4,H+4]];
  let maxR=Math.hypot(Math.max(s.x,W-s.x)+4,Math.max(s.y,H-s.y)+4);
  for(let n=0;n<seeds.length;n++){const o=seeds[n];if(o===s)continue;const dx=o.x-s.x,dy=o.y-s.y,d2=dx*dx+dy*dy;if(d2>4*maxR*maxR||d2<1e-6)continue;
    const mx=s.x+dx/2,my=s.y+dy/2,q=[];let cut=false;
    for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],da=(a[0]-mx)*dx+(a[1]-my)*dy,db=(b[0]-mx)*dx+(b[1]-my)*dy;
      if(da<=0)q.push(a);if((da<0&&db>0)||(da>0&&db<0)){const t=da/(da-db);q.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);cut=true}}
    if(cut||q.length!==p.length){p=q;if(p.length<3)return null;maxR=0;for(const v of p)maxR=Math.max(maxR,Math.hypot(v[0]-s.x,v[1]-s.y))}}
  s.r=maxR;return p}
function inside(p,x,y){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  const v=speed*46;
  for(const s of seeds){s.ph+=dt*.5;s.x+=(s.vx+Math.cos(s.ph)*.6)*v*dt;s.y+=(s.vy+Math.sin(s.ph*1.3)*.6)*v*dt;
    if(hx>=0&&speed>0){const dx=s.x-hx,dy=s.y-hy,d=Math.hypot(dx,dy);if(d<90&&d>1){s.x+=dx/d*(90-d)*dt*1.5;s.y+=dy/d*(90-d)*dt*1.5}}
    if(s.x<0){s.x=0;s.vx=Math.abs(s.vx)}if(s.x>W){s.x=W;s.vx=-Math.abs(s.vx)}if(s.y<0){s.y=0;s.vy=Math.abs(s.vy)}if(s.y>H){s.y=H;s.vy=-Math.abs(s.vy)}
    for(let i=0;i<3;i++)s.c[i]+=(s.tc[i]-s.c[i])*Math.min(1,dt*3)}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=glass?'#08070b':'#16121a';ctx.fillRect(0,0,W,H);ctx.lineJoin='round';
  const grout=glass?5:Math.max(2.5,Math.min(W,H)*.006);let hot=null;
  for(const s of seeds){const p=cell(s);if(!p)continue;
    const [r,g,b]=s.c,R=s.r||60,gx=s.x-R*.35,gy=s.y-R*.4,gr=ctx.createRadialGradient(gx,gy,R*.05,s.x,s.y,R*1.05);
    if(glass){gr.addColorStop(0,`rgba(${r+70|0},${g+70|0},${b+70|0},.95)`);gr.addColorStop(.5,`rgba(${r|0},${g|0},${b|0},.9)`);gr.addColorStop(1,`rgba(${r*.45|0},${g*.45|0},${b*.45|0},.95)`)}
    else{gr.addColorStop(0,`rgb(${Math.min(255,r*1.25+18)|0},${Math.min(255,g*1.25+18)|0},${Math.min(255,b*1.25+18)|0})`);gr.addColorStop(.6,`rgb(${r|0},${g|0},${b|0})`);gr.addColorStop(1,`rgb(${r*.72|0},${g*.72|0},${b*.72|0})`)}
    ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();
    ctx.fillStyle=gr;ctx.fill();
    if(!glass){ctx.save();ctx.clip();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=grout+4;ctx.stroke();ctx.restore()}
    ctx.strokeStyle=glass?'#050407':'#16121a';ctx.lineWidth=grout;ctx.stroke();
    const age=(t-s.born)/600;if(age<1){ctx.fillStyle=`rgba(255,250,225,${(1-age)*.7})`;ctx.fill()}
    if(hx>=0&&!hot&&inside(p,hx,hy))hot=p}
  if(hot){ctx.beginPath();ctx.moveTo(hot[0][0],hot[0][1]);for(let i=1;i<hot.length;i++)ctx.lineTo(hot[i][0],hot[i][1]);ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,.16)';ctx.fill();ctx.strokeStyle='#f6dd8a';ctx.lineWidth=2;ctx.stroke()}
  if(glass)for(const s of seeds){ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(s.x,s.y,1.6,0,7);ctx.fill()}
  requestAnimationFrame(frame)}
cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);hx=e.clientX;hy=e.clientY;add(hx,hy);lastAdd=[hx,hy]});
cv.addEventListener('pointermove',e=>{hx=e.clientX;hy=e.clientY;if(down&&lastAdd&&Math.hypot(hx-lastAdd[0],hy-lastAdd[1])>46){add(hx,hy);lastAdd=[hx,hy]}});
const end=e=>{down=false;if(e.pointerType!=='mouse'||e.type==='pointerleave'){hx=hy=-1}};
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,end));
const pb=document.getElementById('pal');
pb.innerHTML=names.map(n=>{const p=PAL[n];return `<button title="${n}" aria-label="${n} palette" aria-pressed="${n===pal}" data-p="${n}" style="background:conic-gradient(${p[0]} 0 25%,${p[2]} 0 50%,${p[4]} 0 75%,${p[5]} 0)"></button>`}).join('');
pb.onclick=e=>{const n=e.target.dataset.p;if(!n)return;pal=n;[...pb.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===n));seeds.forEach(tint)};
document.getElementById('sp').oninput=e=>speed=e.target.value/100;
document.getElementById('scatter').onclick=()=>{const n=Math.min(240,seeds.length+24);while(seeds.length<n)add(Math.random()*W,Math.random()*H)};
document.getElementById('thin').onclick=()=>{seeds=seeds.filter((s,i)=>i%2===0||seeds.length<10);count()};
document.getElementById('lead').onclick=e=>{glass=!glass;e.target.setAttribute('aria-pressed',glass)};
addEventListener('resize',resize);resize();requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
</body>
</html>
