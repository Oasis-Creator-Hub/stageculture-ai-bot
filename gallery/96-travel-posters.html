<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanderlust &amp; Sons — Bureau of Imaginary Travel</title>
<meta name="description" content="A carousel of vintage flat-colour travel posters for places that do not exist: Port Saffron, Mount Ysolde, Kettle Sands, the Glass Lakes of Oru and the Nimbus Isles.">
<style>
:root{--wall:#e8dcc2;--ink:#2b2118;--acc:#b8402a;--pw:min(64vw,340px,calc(60svh * .714))}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wall);color:var(--ink);font-family:"Futura","Avenir Next","Gill Sans","Century Gothic","Trebuchet MS",sans-serif;min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden;
  background-image:repeating-linear-gradient(90deg,rgba(43,33,24,.035) 0 2px,transparent 2px 58px),linear-gradient(#efe4cc,#dfd0b0)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px clamp(16px,4vw,44px) 0;border-bottom:0}
header a{color:var(--acc);text-decoration:none;font-size:12px;letter-spacing:.2em;font-weight:700}
.brand{text-align:right}
.brand b{display:block;font-size:clamp(17px,2.6vw,26px);letter-spacing:.16em;text-transform:uppercase}
.brand span{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#7a6850}
.rail{position:relative;flex:1 1 auto;min-height:calc(var(--pw) * 1.4 + 70px);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.rail:active{cursor:grabbing}
.rail::before{content:"";position:absolute;left:0;right:0;top:22px;height:3px;background:#8a7658;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.poster{position:absolute;width:var(--pw);aspect-ratio:300/420;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s;background:#f6efdc;padding:calc(var(--pw) * .03);
  box-shadow:0 2px 0 #fff inset,0 18px 30px -8px rgba(43,33,24,.45),0 2px 4px rgba(43,33,24,.3)}
.poster::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:34px;background:#5c4c38}
.poster::after{content:"";position:absolute;left:50%;top:-8px;width:12px;height:12px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9a27a 50%,#6e5a3c)}
.poster svg{display:block;width:100%;height:100%}
.poster text{font-family:"Futura","Avenir Next Condensed","Gill Sans","Century Gothic","Trebuchet MS",sans-serif;font-weight:800}
.nav{position:absolute;top:50%;z-index:20;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:2px solid var(--ink);background:var(--wall);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.nav:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#prev{left:clamp(8px,3vw,40px)}#next{right:clamp(8px,3vw,40px)}
.stub{margin:0 auto 22px;width:min(92vw,640px);display:grid;grid-template-columns:1.5fr 1fr 1fr;background:#f6efdc;border:2px solid var(--ink);position:relative;box-shadow:5px 5px 0 var(--acc)}
.stub>div{padding:10px 14px;border-left:2px dashed var(--ink)}.stub>div:first-child{border-left:0}
.stub small{display:block;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#7a6850}
.stub b{display:block;font-size:clamp(14px,2.2vw,19px);line-height:1.15;margin-top:2px}
.stub p{grid-column:1/-1;margin:0;padding:9px 14px;border-top:2px solid var(--ink);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px}
.dots{display:flex;justify-content:center;gap:8px;margin:0 0 14px}
.dots button{width:22px;height:6px;border:0;padding:0;background:#b9a27a;cursor:pointer}.dots button[aria-current=true]{background:var(--acc)}
@media(max-width:520px){.stub{grid-template-columns:1fr 1fr}.stub>div:first-child{grid-column:1/-1;border-bottom:2px dashed var(--ink)}.stub>div:nth-child(2){border-left:0}.nav{top:auto;bottom:6px;margin:0}}
@media(prefers-reduced-motion:reduce){.poster{transition:none}}
</style>
</head>

<script>
(function(){
const INFO=[['Port Saffron','14 florins','The long dusk','A harbour town that smells of oranges and tar. The lighthouse keeper sells marmalade from the lamp room on Thursdays.'],
['Mount Ysolde','22 florins','First snow','The funicular takes forty minutes and nobody speaks. At the top there is a bench, a bell, and no reception whatsoever.'],
['Kettle Sands','9 florins','Any cool night','The express whistles like a boiling kettle as it crosses the viaduct. Bring a hat, a second hat, and something to trade for shade.'],
['The Glass Lakes of Oru','17 florins','Windless May','Water so still the swans check their reflections for mistakes. Canoes are hired by the hour, silence is free.'],
['The Nimbus Isles','31 florins','Between storms','Seven islands that have never agreed to come down. The airship docks at noon; the waterfalls end somewhere over the sea.']];
const rail=document.getElementById('rail'),P=[...rail.querySelectorAll('.poster')],n=P.length,dots=document.getElementById('dots');
let idx=0,dx=0,down=null;
INFO.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Show '+f[0]);b.onclick=()=>go(i);dots.appendChild(b)});
function lay(){const pw=P[0].offsetWidth,gap=Math.min(pw*.86,rail.offsetWidth*.42);
  P.forEach((p,i)=>{let d=((i-idx)%n+n+Math.floor(n/2))%n-Math.floor(n/2);const f=d+dx/gap,a=Math.abs(f);
    p.style.transform='translateX('+(f*gap)+'px) translateY('+(a*14)+'px) scale('+Math.max(.6,1-.2*a)+') rotate('+(f*2.6)+'deg)';
    p.style.zIndex=10-Math.round(a);p.style.opacity=a>2.2?0:1;p.style.filter=a<.5?'none':'saturate(.7) brightness(.86)';p.style.transitionDuration=down?'0s':'';
    p.setAttribute('aria-hidden',d!==0)});
  [...dots.children].forEach((b,i)=>b.setAttribute('aria-current',i===idx));
  INFO[idx].forEach((t,k)=>document.getElementById('i'+k).textContent=t)}
function go(i){idx=(i%n+n)%n;dx=0;lay()}
document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1)});
rail.addEventListener('pointerdown',e=>{if(e.target.closest('.nav'))return;down={x:e.clientX,t:e.target.closest('.poster')};rail.setPointerCapture(e.pointerId)});
rail.addEventListener('pointermove',e=>{if(down){dx=e.clientX-down.x;lay()}});
function up(){if(!down)return;const d=down;down=null;if(Math.abs(dx)>40)go(idx+(dx<0?1:-1));else{const i=P.indexOf(d.t);dx=0;if(i>=0&&i!==idx)go(i);else lay()}}
rail.addEventListener('pointerup',up);rail.addEventListener('pointercancel',up);
addEventListener('resize',lay);lay();
})();
</script>
