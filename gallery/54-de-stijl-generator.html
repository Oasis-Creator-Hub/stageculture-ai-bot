<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room 54 — Compositions in the Right Angle</title>
<meta name="description" content="A neoplastic composition generator hung on a museum wall: click the painting to recompose its planes of red, yellow and blue.">
<style>
  :root{--s:min(64vh,46vw,620px);--wall:#ebe8e1;--line:#131313}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--wall)}
  body{font-family:"Helvetica Neue",Helvetica,"Nimbus Sans",Arial,sans-serif;color:#1c1c1a;overflow-x:hidden}
  .room{min-height:100vh;display:flex;flex-direction:column;
    background:radial-gradient(ellipse 60% 70% at 38% 38%,#f8f6f1 0,rgba(248,246,241,0) 70%),linear-gradient(#e9e6df,#e2dfd7)}
  .roomno{position:absolute;top:22px;right:26px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8d8a82}
  .wall{flex:1;display:grid;grid-template-columns:auto minmax(220px,300px);gap:clamp(28px,6vw,96px);align-items:center;justify-content:center;
    padding:clamp(48px,9vh,110px) clamp(18px,4vw,60px) clamp(30px,6vh,70px)}
  .work{margin:0;width:var(--s);height:var(--s);cursor:pointer;outline:0;position:relative;
    transition:transform 1.1s cubic-bezier(.65,0,.2,1);-webkit-tap-highlight-color:transparent}
  .work.loz{transform:rotate(45deg) scale(.72)}
  .work::after{content:"";position:absolute;left:4%;right:4%;bottom:-7%;height:7%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(40,34,24,.28),transparent);filter:blur(6px);z-index:-1;transition:opacity .6s}
  .work.loz::after{opacity:0}
  .frame{position:absolute;inset:0;overflow:hidden;background:var(--line);
    box-shadow:0 0 0 calc(var(--s)*.012) #f6f4ee,0 0 0 calc(var(--s)*.016) #cfccc3,
      calc(var(--s)*.012) calc(var(--s)*.03) calc(var(--s)*.06) rgba(40,34,24,.28),0 2px 3px rgba(0,0,0,.25)}
  .work:focus-visible .frame{outline:2px solid #1c3f94;outline-offset:calc(var(--s)*.03)}
  .canvas{position:absolute;inset:calc(var(--s)*-.0085)}
  .cell{position:absolute;border:calc(var(--s)*.0085) solid var(--line);background:#f3f0e7;
    transition:left .95s cubic-bezier(.7,0,.2,1),top .95s cubic-bezier(.7,0,.2,1),width .95s cubic-bezier(.7,0,.2,1),height .95s cubic-bezier(.7,0,.2,1),background-color .7s ease .25s}
  .weave{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at 30% 20%,rgba(255,255,255,0) 40%,rgba(60,40,10,.10))}
  .label{background:#fbfaf7;padding:20px 22px 18px;box-shadow:0 1px 0 #fff inset,1px 2px 5px rgba(40,34,24,.18);font-size:12.5px;line-height:1.5;align-self:end;margin-bottom:6vh}
  .artist{margin:0 0 10px;font-weight:700;font-size:14px}
  .artist span{display:block;font-weight:400;font-size:11.5px;color:#6c6a64}
  h1{margin:0 0 4px;font-size:17px;line-height:1.25;font-weight:700;letter-spacing:-.005em}
  h1 i{font-weight:400}
  .medium{margin:0 0 12px;color:#55534e}
  .blurb{margin:0 0 12px;min-height:7.5em}
  .acc{margin:0 0 14px;font-size:10.5px;color:#8a877f;letter-spacing:.03em}
  .ctl{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #dcd9d1;padding-top:12px}
  button{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid #1c1c1a;color:#1c1c1a;padding:7px 10px;cursor:pointer;border-radius:0}
  button:hover{background:#1c1c1a;color:#fbfaf7}
  button[aria-pressed="true"]{background:#d3261e;border-color:#d3261e;color:#fff}
  .swatches{display:flex;gap:3px;margin:0 0 12px;height:8px}
  .swatches i{display:block;height:100%;transition:flex-grow .9s cubic-bezier(.7,0,.2,1);min-width:0}
  .skirting{height:14px;background:linear-gradient(#f4f2ec,#d4d1c8);border-top:1px solid #c4c1b8}
  .floor{height:clamp(46px,11vh,120px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 14px;
    background:linear-gradient(rgba(60,38,16,.42),rgba(60,38,16,0) 60%),repeating-linear-gradient(90deg,#a9814f 0 118px,#9d7543 118px 120px,#b08a58 120px 262px,#94703f 262px 264px)}
  .floor a,.floor span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#f4ecdc;text-decoration:none;text-shadow:0 1px 2px rgba(40,20,0,.6)}
  .floor a:hover{text-decoration:underline}
  @media (max-width:820px){:root{--s:min(84vw,56vh)}.wall{grid-template-columns:1fr;justify-items:center;gap:44px}.label{margin:0;max-width:420px;width:100%}}
  @media (prefers-reduced-motion:reduce){.cell,.work,.swatches i{transition:none}}
</style>
</head>
<body>
<main class="room">
  <div class="roomno">Room 54 · The Right Angle</div>
  <div class="wall">
    <figure class="work" id="work" tabindex="0" role="button" aria-label="Painting. Activate to recompose.">
      <div class="frame"><div class="canvas" id="canvas"></div><div class="weave"></div></div>
    </figure>
    <aside class="label" aria-live="polite">
      <p class="artist">Wilhelmina Aardenhout<span>Zwartewaal 1894 — Hoek van Stilte 1971</span></p>
      <h1 id="title"></h1>
      <p class="medium">Oil on canvas, repainted on request · 61 × 61 cm</p>
      <div class="swatches" id="sw" aria-hidden="true"></div>
      <p class="blurb" id="blurb"></p>
      <p class="acc">Acc. no. <span id="acc"></span> · Gift of the Friends of the Right Angle</p>
      <div class="ctl">
        <button id="re" type="button">Recompose</button>
        <button id="loz" type="button" aria-pressed="false">Hang as lozenge</button>
        <button id="auto" type="button" aria-pressed="false">Rotate works</button>
      </div>
    </aside>
  </div>
  <div class="skirting"></div>
  <div class="floor"><a href="index.html">← 100 · exit to index</a><span>Please touch the painting</span></div>
</main>
<script>
(() => {
  const N = 12, G = 24;
  const COL = { white: '#f3f0e7', red: '#d3261e', blue: '#1c3f94', yellow: '#f2c81d', black: '#151515', grey: '#d5d2c8' };
  const canvas = document.getElementById('canvas'), work = document.getElementById('work');
  const cells = Array.from({ length: N }, (_, i) => { const d = document.createElement('div'); d.className = 'cell'; d.style.transitionDelay = (i * 28) + 'ms'; canvas.appendChild(d); return d; });
  const sw = document.getElementById('sw'); const bars = {};
  Object.keys(COL).forEach(k => { const i = document.createElement('i'); i.style.background = COL[k]; i.style.flexGrow = 0; if (k === 'white') i.style.outline = '1px solid #d8d5cd'; sw.appendChild(i); bars[k] = i; });

  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  function compose(seed) {
    const R = mulberry(seed); let rs = [{ x: 0, y: 0, w: G, h: G }], guard = 0;
    while (rs.length < N && guard++ < 400) {
      // favour big planes: weight by area squared
      const tot = rs.reduce((s, r) => s + (r.w * r.h) ** 1.6, 0); let pick = R() * tot, r = rs[0];
      for (const c of rs) { pick -= (c.w * c.h) ** 1.6; if (pick <= 0) { r = c; break; } }
      const vert = r.w === r.h ? R() < .5 : (r.w > r.h ? R() < .8 : R() < .2), len = vert ? r.w : r.h;
      if (len < 5) continue;
      // asymmetry is the rule: cut near an edge, rarely near the middle
      let cut = R() < .78 ? 2 + Math.floor(R() * Math.min(4, len - 4)) : 2 + Math.floor(R() * (len - 3));
      if (R() < .5) cut = len - cut; cut = Math.max(2, Math.min(len - 2, cut));
      rs.splice(rs.indexOf(r), 1);
      if (vert) rs.push({ x: r.x, y: r.y, w: cut, h: r.h }, { x: r.x + cut, y: r.y, w: r.w - cut, h: r.h });
      else rs.push({ x: r.x, y: r.y, w: r.w, h: cut }, { x: r.x, y: r.y + cut, w: r.w, h: r.h - cut });
    }
    rs.forEach(r => r.c = 'white');
    const byArea = [...rs].sort((a, b) => b.w * b.h - a.w * a.h), prim = ['red', 'blue', 'yellow'].sort(() => R() - .5);
    byArea[1 + Math.floor(R() * 3)].c = prim[0];                          // one generous plane
    const small = byArea.slice(5).sort(() => R() - .5);
    if (R() < .9) small[0].c = prim[1];
    if (R() < .6) small[1].c = prim[2];
    if (R() < .45) small[2].c = 'black';
    if (R() < .35) small[3].c = 'grey';
    return rs.sort((a, b) => a.y - b.y || a.x - b.x);
  }

  const words = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const remarks = [
    'The artist held that a diagonal was “a vertical that has lost its nerve.”',
    'Aardenhout repainted her whites up to nine times, insisting no two were the same white.',
    'Visitors are reminded that the lines continue beyond the frame, in principle, forever.',
    'She described her method as “arguing with a rectangle until we both agree.”',
    'A studio note reads: “Yellow is loud. Give it the small room.”',
    'The black lines were ruled with a tram ticket; the artist distrusted rulers as “too certain.”'
  ];
  let seed, count = 0;

  function hang(s) {
    seed = s; const rs = compose(seed), share = {};
    rs.forEach((r, i) => {
      const st = cells[i].style;
      st.left = r.x / G * 100 + '%'; st.top = r.y / G * 100 + '%'; st.width = r.w / G * 100 + '%'; st.height = r.h / G * 100 + '%';
      st.backgroundColor = COL[r.c]; share[r.c] = (share[r.c] || 0) + r.w * r.h / (G * G);
    });
    Object.keys(bars).forEach(k => bars[k].style.flexGrow = share[k] ? Math.max(.03, share[k]) : 0);
    const used = ['red', 'yellow', 'blue'].filter(k => share[k]), extra = ['black', 'grey'].filter(k => share[k]);
    const list = a => a.length > 1 ? a.slice(0, -1).map(cap).join(', ') + ' and ' + cap(a[a.length - 1]) : cap(a[0]);
    const no = 100 + seed % 900;
    document.getElementById('title').innerHTML = `<i>Composition No. ${no}</i> with ${list(used)}`;
    const big = used.slice().sort((a, b) => share[b] - share[a])[0], coloured = rs.filter(r => r.c !== 'white').length;
    const R = mulberry(seed + 7);
    document.getElementById('blurb').textContent =
      `${cap(words[N])} planes, of which ${words[coloured]} carry colour. ${cap(big)} holds ${Math.round(share[big] * 100)}% of the surface; ` +
      `white is left ${Math.round((share.white || 0) * 100)}% to breathe${extra.length ? ', steadied by a note of ' + extra.join(' and ') : ''}. ` +
      remarks[Math.floor(R() * remarks.length)];
    document.getElementById('acc').textContent = `19${27 + seed % 40}.${String(seed % 10000).padStart(4, '0')}`;
    work.setAttribute('aria-label', `Composition No. ${no}. Activate to recompose.`);
    try { history.replaceState(null, '', '#' + seed); } catch (_) {}
  }
  const next = () => hang((Math.random() * 1e9) | 0 || ++count);

  work.addEventListener('click', next);
  work.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); } });
  document.getElementById('re').addEventListener('click', next);
  const loz = document.getElementById('loz');
  loz.addEventListener('click', () => { const on = work.classList.toggle('loz'); loz.setAttribute('aria-pressed', on); loz.textContent = on ? 'Hang square' : 'Hang as lozenge'; });
  const auto = document.getElementById('auto'); let timer = null;
  auto.addEventListener('click', () => {
    if (timer) { clearInterval(timer); timer = null; } else { next(); timer = setInterval(next, 4200); }
    auto.setAttribute('aria-pressed', !!timer);
  });

  const fromHash = parseInt(location.hash.slice(1), 10);
  // start collapsed to a single white plane, then let the first composition unfold
  cells.forEach(c => { c.style.left = c.style.top = '0%'; c.style.width = c.style.height = '100%'; });
  requestAnimationFrame(() => requestAnimationFrame(() => hang(Number.isFinite(fromHash) ? fromHash : 54054)));
})();
</script>
</body>
</html>
