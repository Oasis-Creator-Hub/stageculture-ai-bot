<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tessel Reef — Shoal Study</title>
<meta name="description" content="A living coral reef: three species of fish school with boids rules, scatter from your pointer, and swim under drifting sunlight caustics.">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a4a70}
  #sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
  .plate{position:fixed;left:clamp(16px,3vw,40px);top:clamp(16px,3vw,36px);color:#f2fffb;pointer-events:none;
    font-family:"Arial Rounded MT Bold","Varela Round","Nunito","Quicksand",ui-rounded,"Hiragino Maru Gothic ProN","Segoe UI",sans-serif;
    text-shadow:0 2px 14px rgba(0,50,80,.5)}
  .plate h1{margin:0;font-size:clamp(26px,4.4vw,58px);font-weight:700;letter-spacing:-.02em;line-height:.95}
  .plate h1 span{display:block;font-size:.3em;letter-spacing:.42em;text-transform:uppercase;opacity:.8;margin-bottom:.7em;font-weight:400}
  .plate p{margin:.9em 0 0;font-size:clamp(11px,1.1vw,14px);line-height:1.5;max-width:27em;opacity:.86;font-weight:400}
  .log{position:fixed;right:clamp(16px,3vw,40px);top:clamp(16px,3vw,36px);text-align:right;color:#eafffb;pointer-events:none;
    font:600 11px/1.8 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
  .log b{color:#ffe48a;font-weight:600}
  a.back{position:fixed;left:clamp(16px,3vw,40px);bottom:16px;color:#fff;text-decoration:none;opacity:.7;
    font:700 12px/1 "Arial Rounded MT Bold",ui-rounded,"Segoe UI",sans-serif;letter-spacing:.08em;
    padding:8px 13px;border-radius:99px;background:rgba(4,40,66,.45);backdrop-filter:blur(4px)}
  a.back:hover{opacity:1}
  @media (max-width:560px){.log{display:none}}
</style>
</head>
<body>
<canvas id="sea" aria-label="Coral reef with schooling fish"></canvas>
<div class="plate">
  <h1><span>Shoal study · station 53</span>Tessel Reef</h1>
  <p>Six metres down, mid-morning. Move through the water and the shoal parts around you; tap to startle it.</p>
</div>
<div class="log">depth <b>6.2 m</b><br>visibility <b>excellent</b><br>fish counted <b id="count">0</b><br>mood <b id="mood">unbothered</b></div>
<a class="back" href="index.html">← 100</a>
<script>
(() => {
  const cv = document.getElementById('sea'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[(Math.random() * a.length) | 0];
  let W, H, dpr, reef, fish = [], bubbles = [], weeds = [], floorY, scare = 0;
  const ptr = { x: -9999, y: -9999, on: false };
  const CW = 144, CH = 84, caus = document.createElement('canvas'); caus.width = CW; caus.height = CH;
  const cctx = caus.getContext('2d'), cimg = cctx.createImageData(CW, CH);

  const SPECIES = [
    { name: 'chromis', share: .58, len: 13, speed: 2.1, body: '#bfeaf2', back: '#3f9fc8', fin: '#e9fbff', view: 62, sep: 17 },
    { name: 'anthias', share: .32, len: 15, speed: 1.8, body: '#ff9b4a', back: '#e2542f', fin: '#ffd27a', view: 70, sep: 20 },
    { name: 'butterfly', share: .10, len: 27, speed: 1.15, body: '#ffe45c', back: '#1c2530', fin: '#fff6c2', view: 120, sep: 44, tall: true }
  ];

  // ---- static reef, painted once ------------------------------------------
  function paintReef() {
    reef = document.createElement('canvas'); reef.width = W * dpr; reef.height = H * dpr;
    const g = reef.getContext('2d'); g.scale(dpr, dpr);
    const ridge = (base, amp, f, ph) => x => base - amp * (Math.sin(x * f + ph) * .6 + Math.sin(x * f * 2.3 + ph * 2) * .4);
    // distant bommies fading into blue
    [[.62, .09, '#1a7fa6'], [.7, .07, '#146a92']].forEach(([b, a, c], i) => {
      const fn = ridge(H * b, H * a, 5 / W + i * .002, i * 2.4 + 1); g.fillStyle = c; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) g.lineTo(x, fn(x)); g.lineTo(W, H); g.fill();
    });
    const sandFn = ridge(H * .86, H * .035, 3.3 / W, .7); floorY = sandFn;
    const sand = g.createLinearGradient(0, H * .8, 0, H);
    sand.addColorStop(0, '#9cc7b8'); sand.addColorStop(.35, '#d8cfa2'); sand.addColorStop(1, '#8f8d74');
    g.fillStyle = sand; g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 8) g.lineTo(x, sandFn(x)); g.lineTo(W, H); g.fill();
    g.strokeStyle = 'rgba(90,110,100,.18)'; g.lineWidth = 1;
    for (let i = 0; i < 26; i++) { const x = rnd(0, W), y = rnd(H * .9, H), l = rnd(20, 80); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 4, x + l, y); g.stroke(); }

    const branch = (x, y, a, len, w, col, tip) => {
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
      if (len < 9) { g.fillStyle = tip; g.beginPath(); g.arc(x2, y2, w * .9, 0, TAU); g.fill(); return; }
      const n = Math.random() < .3 ? 3 : 2;
      for (let i = 0; i < n; i++) branch(x2, y2, a + rnd(-.6, .6), len * rnd(.62, .8), w * .72, col, tip);
    };
    const kinds = {
      staghorn(x, y, s) { const c = pick([['#e8588a', '#ffc2d6'], ['#f0763f', '#ffd9a8'], ['#b45ad6', '#ecc4ff']]); for (let i = 0; i < 4; i++) branch(x + rnd(-10, 10) * s, y, -Math.PI / 2 + rnd(-.7, .7), 30 * s, 6.5 * s, c[0], c[1]); },
      brain(x, y, s) {
        const rw = 44 * s, rh = 30 * s, gr = g.createRadialGradient(x - rw * .3, y - rh * .8, 2, x, y, rw);
        gr.addColorStop(0, '#f3d27c'); gr.addColorStop(1, '#a8743a'); g.fillStyle = gr;
        g.beginPath(); g.ellipse(x, y, rw, rh, 0, Math.PI, TAU); g.fill();
        g.save(); g.clip(); g.strokeStyle = 'rgba(92,52,20,.55)'; g.lineWidth = 1.6 * s;
        for (let i = 0; i < 26; i++) { const px = x + rnd(-rw, rw), py = y - rnd(0, rh); g.beginPath(); g.arc(px, py, rnd(4, 10) * s, rnd(0, TAU), rnd(0, TAU)); g.stroke(); }
        g.restore();
      },
      fan(x, y, s) {
        const c = pick(['#c5387a', '#7a48c9', '#e2552c']); g.strokeStyle = c; g.lineCap = 'round';
        for (let i = 0; i < 22; i++) { const a = -Math.PI / 2 + (i / 21 - .5) * 2.1, l = (62 + rnd(-10, 10)) * s; g.lineWidth = 1.5 * s; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + rnd(-6, 6), y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
        g.globalAlpha = .35; for (let r = 18; r < 64; r += 9) { g.lineWidth = 1 * s; g.beginPath(); g.arc(x, y, r * s, -Math.PI / 2 - 1.05, -Math.PI / 2 + 1.05); g.stroke(); } g.globalAlpha = 1;
      },
      tubes(x, y, s) {
        const c = pick([['#f6c935', '#8a6a10'], ['#48d6b4', '#136b5a'], ['#ff8fb0', '#8a2848']]);
        for (let i = 0; i < 5; i++) { const tx = x + (i - 2) * 11 * s + rnd(-3, 3), th = rnd(26, 62) * s, tw = rnd(5, 8) * s;
          const gr = g.createLinearGradient(tx - tw, 0, tx + tw, 0); gr.addColorStop(0, c[1]); gr.addColorStop(.45, c[0]); gr.addColorStop(1, c[1]);
          g.fillStyle = gr; g.beginPath(); g.roundRect(tx - tw, y - th, tw * 2, th + 4, tw); g.fill();
          g.fillStyle = 'rgba(20,20,40,.55)'; g.beginPath(); g.ellipse(tx, y - th + tw * .7, tw * .6, tw * .35, 0, 0, TAU); g.fill(); }
      },
      plates(x, y, s) {
        const c = pick([['#3fb6a8', '#1d6f74'], ['#d98a4a', '#8c4a22'], ['#8f9be8', '#474f9c']]);
        for (let i = 0; i < 4; i++) { const py = y - i * 13 * s, pw = (50 - i * 7 + rnd(-4, 4)) * s, px = x + rnd(-8, 8) * s;
          g.fillStyle = c[1]; g.beginPath(); g.ellipse(px, py + 3 * s, pw, 6 * s, 0, 0, TAU); g.fill();
          g.fillStyle = c[0]; g.beginPath(); g.ellipse(px, py, pw, 5 * s, 0, 0, TAU); g.fill(); }
      }
    };
    const names = Object.keys(kinds), n = Math.max(9, Math.round(W / 62));
    const spots = []; for (let i = 0; i < n; i++) spots.push({ x: (i + rnd(.15, .85)) / n * W, d: Math.random() });
    spots.sort((a, b) => a.d - b.d).forEach(p => {
      const s = (.55 + p.d * .75) * Math.max(.7, Math.min(1.25, W / 900)), y = sandFn(p.x) + 6 + p.d * H * .07;
      g.fillStyle = 'rgba(20,60,70,.25)'; g.beginPath(); g.ellipse(p.x, y + 2, 46 * s, 7 * s, 0, 0, TAU); g.fill();
      g.globalAlpha = .62 + p.d * .38; kinds[pick(names)](p.x, y, s); g.globalAlpha = 1;
    });
    weeds = []; for (let i = 0; i < Math.round(W / 130) + 3; i++) {
      const x = rnd(0, W), d = Math.random(), blades = [];
      for (let b = 0; b < 7; b++) blades.push({ o: rnd(-14, 14), h: rnd(40, 120) * (.6 + d * .7), ph: rnd(0, TAU), w: rnd(2.5, 5) });
      weeds.push({ x, y: sandFn(x) + 8 + d * H * .08, blades, col: pick(['#2f9c6a', '#1f7d63', '#58b85a', '#e06a8e']) });
    }
  }

  function populate() {
    const n = Math.round(Math.max(55, Math.min(170, W * H / 7200)));
    fish = [];
    SPECIES.forEach((sp, si) => { for (let i = 0; i < Math.round(n * sp.share); i++) { const a = rnd(0, TAU);
      fish.push({ sp, si, x: rnd(0, W), y: rnd(H * .15, H * .7), vx: Math.cos(a) * sp.speed, vy: Math.sin(a) * sp.speed * .4, ph: rnd(0, TAU), size: rnd(.8, 1.2) }); } });
    document.getElementById('count').textContent = fish.length;
  }

  // ---- boids ----------------------------------------------------------------
  function swim(k) {
    const top = H * .07, bot = H * .8, R = Math.max(110, Math.min(190, W * .16));
    for (const f of fish) {
      const sp = f.sp; let ax = 0, ay = 0, cx = 0, cy = 0, mx = 0, my = 0, n = 0;
      for (const o of fish) {
        if (o === f) continue; const dx = o.x - f.x, dy = o.y - f.y, d2 = dx * dx + dy * dy;
        if (d2 > sp.view * sp.view || d2 === 0) continue; const d = Math.sqrt(d2);
        const sd = (sp.sep + o.sp.sep) / 2; if (d < sd) { ax -= dx / d * (sd - d) * .05; ay -= dy / d * (sd - d) * .05; }
        if (o.si === f.si) { cx += o.x; cy += o.y; mx += o.vx; my += o.vy; n++; }
      }
      if (n) { ax += (cx / n - f.x) * .0011 + (mx / n - f.vx) * .055; ay += (cy / n - f.y) * .0011 + (my / n - f.vy) * .055; }
      const px = f.x - ptr.x, py = f.y - ptr.y, pd = Math.hypot(px, py), rr = R * (1 + scare * 1.6);
      if (pd < rr && pd > 0) { const push = (1 - pd / rr) * (1.1 + scare * 3); ax += px / pd * push; ay += py / pd * push; }
      if (f.x < 60) ax += (60 - f.x) * .004; if (f.x > W - 60) ax -= (f.x - W + 60) * .004;
      if (f.y < top) ay += (top - f.y) * .006; if (f.y > bot) ay -= (f.y - bot) * .008;
      ax += Math.cos(f.ph * .3) * .012; ay -= f.vy * .02;
      f.vx += ax; f.vy += ay;
      const v = Math.hypot(f.vx, f.vy) || .001, lim = sp.speed * (pd < rr ? 2.6 + scare : 1.25), low = sp.speed * .55;
      if (v > lim) { f.vx *= lim / v; f.vy *= lim / v; } else if (v < low) { f.vx *= low / v; f.vy *= low / v; }
      f.x += f.vx * k; f.y += f.vy * k; f.ph += (.16 + v * .09) * k;
    }
  }

  function drawFish(f) {
    const sp = f.sp, L = sp.len * f.size, a = Math.atan2(f.vy, f.vx), wag = Math.sin(f.ph) * .5, tall = sp.tall ? .62 : .3;
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(a); if (f.vx < 0) ctx.scale(1, -1);
    ctx.fillStyle = sp.fin; ctx.beginPath(); ctx.moveTo(-L * .42, 0);
    ctx.lineTo(-L * .95, -L * .34 + wag * L * .3); ctx.lineTo(-L * .78, wag * L * .22); ctx.lineTo(-L * .95, L * .34 + wag * L * .3); ctx.fill();
    ctx.fillStyle = sp.body; ctx.beginPath(); ctx.moveTo(L * .55, 0);
    ctx.bezierCurveTo(L * .3, -L * tall, -L * .25, -L * tall, -L * .5, wag * L * .06);
    ctx.bezierCurveTo(-L * .25, L * tall * .9, L * .3, L * tall * .9, L * .55, 0); ctx.fill();
    ctx.fillStyle = sp.back;
    if (sp.tall) { ctx.fillRect(L * .22, -L * .44, L * .1, L * .86); ctx.fillRect(-L * .2, -L * .52, L * .1, L * 1); ctx.beginPath(); ctx.moveTo(L * .1, -L * .5); ctx.lineTo(-L * .3, -L * .8); ctx.lineTo(-L * .3, -L * .45); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(L * .5, -L * .04); ctx.bezierCurveTo(L * .3, -L * tall, -L * .25, -L * tall, -L * .5, 0); ctx.bezierCurveTo(-L * .2, -L * .1, L * .2, -L * .1, L * .5, -L * .04); ctx.fill(); }
    ctx.fillStyle = '#0b1820'; ctx.beginPath(); ctx.arc(L * .34, -L * .05, Math.max(1, L * .055), 0, TAU); ctx.fill();
    ctx.restore();
  }

  function caustics(t) {
    const d = cimg.data; let i = 0;
    for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
      const u = x * .085 + Math.sin(y * .12 + t * .9) * 1.3, w = y * .11 + Math.sin(x * .075 - t * .7) * 1.3;
      const v = Math.abs(Math.sin(u) + Math.sin(w) + Math.sin((u + w) * .7 + t * .5)), b = Math.max(0, 1 - v * .75);
      d[i] = 220; d[i + 1] = 255; d[i + 2] = 240; d[i + 3] = b * b * b * b * 255 * (.35 + .65 * y / CH); i += 4;
    }
    cctx.putImageData(cimg, 0, 0);
  }

  function frame(ms) {
    const t = reduce ? 3 : ms / 1000, k = reduce ? .4 : 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sea = ctx.createLinearGradient(0, 0, 0, H);
    sea.addColorStop(0, '#7fe3d6'); sea.addColorStop(.28, '#2fa9c4'); sea.addColorStop(.7, '#0f5f92'); sea.addColorStop(1, '#083258');
    ctx.fillStyle = sea; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';                                   // god rays
    for (let i = 0; i < 7; i++) {
      const x = W * (.08 + i * .14) + Math.sin(t * .2 + i) * 30, w = W * (.03 + .03 * ((i * 7) % 3)), a = .05 + .035 * Math.sin(t * .5 + i * 1.7);
      const g = ctx.createLinearGradient(0, 0, 0, H * .85); g.addColorStop(0, `rgba(210,255,240,${a * 2})`); g.addColorStop(1, 'rgba(210,255,240,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w * 2.6 - W * .12, H * .85); ctx.lineTo(x - W * .16, H * .85); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(reef, 0, 0, W, H);
    for (const wd of weeds) {                                                    // swaying grass
      ctx.strokeStyle = wd.col; ctx.lineCap = 'round';
      for (const b of wd.blades) { const sway = Math.sin(t * 1.1 + b.ph + wd.x * .01) * b.h * .22; ctx.lineWidth = b.w;
        ctx.beginPath(); ctx.moveTo(wd.x + b.o, wd.y); ctx.quadraticCurveTo(wd.x + b.o - sway * .3, wd.y - b.h * .55, wd.x + b.o + sway, wd.y - b.h); ctx.stroke(); }
    }
    if (!reduce || !frame.done) { caustics(t); frame.done = true; }
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5; ctx.imageSmoothingEnabled = true;
    ctx.drawImage(caus, 0, H * .12, W, H * .88); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    swim(k); scare *= .95;
    for (const f of fish) drawFish(f);

    if (!reduce && bubbles.length < 34 && Math.random() < .12) { const wd = pick(weeds); bubbles.push({ x: wd.x + rnd(-10, 10), y: wd.y - 20, r: rnd(1.2, 4), ph: rnd(0, TAU) }); }
    ctx.strokeStyle = 'rgba(235,255,255,.65)'; ctx.lineWidth = 1;
    bubbles = bubbles.filter(b => { b.y -= .6 + b.r * .28; b.x += Math.sin(t * 3 + b.ph) * .5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(b.x - b.r * .5, b.y - b.r * .5, 1, 1); return b.y > -10; });

    if (ptr.on) {                                                               // the diver's lamp
      const g = ctx.createRadialGradient(ptr.x, ptr.y, 0, ptr.x, ptr.y, 70); g.addColorStop(0, 'rgba(255,250,210,.28)'); g.addColorStop(1, 'rgba(255,250,210,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 70, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 7 + scare * 30, 0, TAU); ctx.stroke();
    }
    const vg = ctx.createRadialGradient(W / 2, H * .4, Math.min(W, H) * .3, W / 2, H * .5, Math.max(W, H) * .78);
    vg.addColorStop(0, 'rgba(0,20,50,0)'); vg.addColorStop(1, 'rgba(0,16,46,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    requestAnimationFrame(frame);
  }

  const mood = document.getElementById('mood');
  setInterval(() => { mood.textContent = scare > .2 ? 'startled' : ptr.on ? 'wary' : 'unbothered'; }, 300);
  const at = e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; };
  cv.addEventListener('pointermove', at);
  cv.addEventListener('pointerdown', e => { at(e); scare = 1; });
  cv.addEventListener('pointerleave', () => { ptr.on = false; ptr.x = ptr.y = -9999; });
  cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') setTimeout(() => { ptr.on = false; ptr.x = ptr.y = -9999; }, 500); });

  function setup() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); paintReef(); populate(); bubbles = [];
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 150); });
  setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
