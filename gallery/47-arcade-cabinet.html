<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMET HOPPER — arcade cabinet</title>
<meta name="description" content="An original playable arcade mini-game inside a CSS cabinet: steer a little ship, dodge tumbling comets, scoop up stars. Keyboard and touch controls, score and hi-score.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--cab:#221a3a;--cab2:#16102a;--pink:#ff3d8b;--cyan:#39e6ff;--yel:#ffd23f;--px:"Courier New",ui-monospace,Menlo,Consolas,monospace}
  body{min-height:100vh;background:#0b0816;color:#fff;font-family:var(--px);display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;
    background-image:linear-gradient(rgba(255,61,139,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(57,230,255,.06) 1px,transparent 1px),radial-gradient(ellipse at 50% 0,#2a1650,#0b0816 70%);
    background-size:44px 44px,44px 44px,100% 100%;padding:14px 8px 26px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  a.back{position:fixed;left:10px;top:10px;font:700 12px var(--px);color:var(--yel);text-decoration:none;z-index:5;background:#0b0816;padding:4px 6px;border:2px solid var(--yel)}
  .cab{width:min(470px,100%);position:relative;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
  .marquee{background:linear-gradient(180deg,#ff5fa2,#ff3d8b 55%,#c2185b);border:5px solid var(--cab2);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 10px 12px;text-align:center;position:relative;overflow:hidden;
    box-shadow:inset 0 0 26px rgba(255,255,255,.5),0 0 34px rgba(255,61,139,.55)}
  .marquee::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,210,63,.35) 22px 30px)}
  .marquee h1{position:relative;font:900 italic clamp(26px,8vw,42px)/1 Impact,"Arial Black",sans-serif;letter-spacing:.04em;color:var(--yel);
    text-shadow:3px 3px 0 #16102a,-1px -1px 0 #16102a,5px 5px 0 var(--cyan)}
  .marquee p{position:relative;font-size:10px;letter-spacing:.34em;color:#16102a;font-weight:700;margin-top:6px}
  .body{background:linear-gradient(90deg,var(--cab2),var(--cab) 12%,var(--cab) 88%,var(--cab2));border:5px solid var(--cab2);border-top:0;border-bottom:0;padding:16px clamp(12px,5vw,30px) 14px;position:relative}
  .body::before,.body::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,var(--cyan) 0 14px,var(--pink) 14px 28px);opacity:.75}
  .body::before{left:3px}.body::after{right:3px}
  .bezel{background:#05040a;border-radius:22px;padding:clamp(10px,3vw,16px);box-shadow:inset 0 0 0 3px #3a2d63,inset 0 10px 30px #000}
  .tube{position:relative;border-radius:14px/18px;overflow:hidden;aspect-ratio:3/4;background:#030208;box-shadow:0 0 30px rgba(57,230,255,.18)}
  .tube canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  .tube::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%),linear-gradient(125deg,rgba(255,255,255,.09) 0,transparent 32%)}
  .deck{background:linear-gradient(180deg,#34285c,#1b1433);border:5px solid var(--cab2);border-top:6px solid #4b3b82;padding:14px clamp(12px,5vw,30px) 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;transform:perspective(700px) rotateX(14deg);transform-origin:top;margin-bottom:-8px}
  .pad{display:flex;gap:12px}
  .btn{width:clamp(56px,16vw,68px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;font:900 22px var(--px);color:#16102a;touch-action:none;
    box-shadow:0 6px 0 rgba(0,0,0,.55),inset 0 -6px 10px rgba(0,0,0,.3),inset 0 5px 8px rgba(255,255,255,.55)}
  .btn:active,.btn.down{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 -4px 8px rgba(0,0,0,.3)}
  .btn.l,.btn.r{background:var(--cyan)} .btn.go{background:var(--yel);font-size:12px;letter-spacing:.04em}
  .base{background:linear-gradient(90deg,var(--cab2),var(--cab) 12%,var(--cab) 88%,var(--cab2));border:5px solid var(--cab2);border-top:0;border-radius:0 0 10px 10px;padding:16px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;letter-spacing:.14em;color:#9c8fd0;line-height:1.7}
  .coin{border:2px solid #4b3b82;border-radius:4px;padding:8px 10px;text-align:center;color:var(--yel);background:#0d0a1c;white-space:nowrap}
  .coin i{display:block;width:4px;height:18px;background:#000;margin:0 auto 5px;border:1px solid #6d5cb0}
  @keyframes blink{50%{opacity:.25}} .coin b{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){.coin b{animation:none}}
</style>
</head>
<body>
<a class="back" href="index.html">←100</a>
<div class="cab">
  <div class="marquee"><h1>COMET HOPPER</h1><p>★ A PIXELWORKS OF NOWHERE CABINET ★</p></div>
  <div class="body"><div class="bezel"><div class="tube"><canvas id="game" width="180" height="240" aria-label="Comet Hopper game screen"></canvas></div></div></div>
  <div class="deck">
    <div class="pad"><button class="btn l" id="bl" aria-label="Move left">◀</button><button class="btn r" id="br" aria-label="Move right">▶</button></div>
    <button class="btn go" id="bg" aria-label="Start or boost">START</button>
  </div>
  <div class="base"><span>← → / A D : STEER<br>SPACE : START · DASH<br>DRAG ON SCREEN TO FLY</span><span class="coin"><i></i><b>FREE PLAY</b></span></div>
</div>
<script>
(() => {
  const cv=document.getElementById('game'), g=cv.getContext('2d');
  const W=180,H=240; g.imageSmoothingEnabled=false;
  const PAL={bg:'#07051a',ship:'#39e6ff',shipD:'#1b7fa8',pink:'#ff3d8b',yel:'#ffd23f',wh:'#f4f1ff',rock:'#a9643c',rockD:'#6a3a25',ice:'#bfe9ff'};
  // 5x5 pixel font
  const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
    A:'010101111101101',B:'110101110101110',C:'111100100100111',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'111100101101111',H:'101101111101101',I:'111010010010111',K:'101101110101101',L:'100100100100111',M:'101111111101101',
    N:'111101101101101',O:'111101101101111',P:'111101111100100',R:'110101110101101',S:'111100111001111',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',' ':'000000000000000','-':'000000111000000','+':'000010111010000','!':'010010010000010','×':'000101010101000','★':'010111111010101'};
  function text(s,x,y,col,sc=1,center=false){ s=String(s); const w=s.length*4*sc-sc; if(center) x=Math.round(x-w/2); g.fillStyle=col;
    for(let i=0;i<s.length;i++){ const m=FONT[s[i]]||FONT[' ']; for(let k=0;k<15;k++) if(m[k]==='1') g.fillRect(x+i*4*sc+(k%3)*sc,y+Math.floor(k/3)*sc,sc,sc); } }
  const SHIP=['..1..','.111.','.121.','11111','1.3.1'];
  const STAR=['..1..','.111.','11111','.111.','1...1'];
  function sprite(rows,x,y,cols){ for(let j=0;j<rows.length;j++) for(let i=0;i<rows[j].length;i++){ const c=rows[j][i]; if(c!=='.'){ g.fillStyle=cols[c]; g.fillRect(Math.round(x)+i,Math.round(y)+j,1,1); } } }

  let state='title', score=0, hi=0, lives=3, t=0, combo=0, shake=0, inv=0, dash=0, dashCd=0, flash='', flashT=0;
  try{ hi=+localStorage.getItem('cometHopperHi')||0; }catch(e){}
  const ship={x:W/2,y:H-34,vx:0}, comets=[], stars=[], bits=[], bg=[];
  for(let i=0;i<46;i++) bg.push({x:Math.random()*W,y:Math.random()*H,z:1+Math.floor(Math.random()*3)});
  const keys={l:false,r:false}; let dragX=null;

  function start(){ state='play'; score=0; lives=3; t=0; combo=0; comets.length=stars.length=bits.length=0; ship.x=W/2; ship.vx=0; inv=60; }
  function action(){ if(state!=='play') start(); else if(dashCd<=0){ dash=14; dashCd=70; beep(660,.08,'square'); } }
  function boom(x,y,col,n){ for(let i=0;i<n&&bits.length<160;i++){ const a=Math.random()*6.28,v=.4+Math.random()*2; bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:14+Math.random()*16,col}); } }

  // tiny WebAudio blips (after user gesture only)
  let ac; function beep(f,d,type='square',slide=0){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), v=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,ac.currentTime); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
    v.gain.setValueAtTime(.06,ac.currentTime); v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d); o.connect(v); v.connect(ac.destination); o.start(); o.stop(ac.currentTime+d); }catch(e){} }

  function update(){
    t++;
    for(const s of bg){ s.y+=s.z*.35*(state==='play'?1+Math.min(2,t/2400):.6); if(s.y>H){ s.y=0; s.x=Math.random()*W; } }
    for(let i=bits.length-1;i>=0;i--){ const b=bits[i]; b.x+=b.vx; b.y+=b.vy; b.vy+=.04; if(--b.l<=0) bits.splice(i,1); }
    if(shake>0) shake--; if(flashT>0) flashT--;
    if(state!=='play') return;
    const lvl=1+Math.floor(t/600), acc=dash>0?.9:.42, max=dash>0?4.6:2.5;
    if(dragX!==null){ const d=dragX-ship.x; ship.vx=Math.max(-max,Math.min(max,d*.25)); }
    else { if(keys.l) ship.vx-=acc; if(keys.r) ship.vx+=acc; if(!keys.l&&!keys.r) ship.vx*=.8; ship.vx=Math.max(-max,Math.min(max,ship.vx)); }
    ship.x=Math.max(5,Math.min(W-5,ship.x+ship.vx));
    if(dash>0) dash--; if(dashCd>0) dashCd--; if(inv>0) inv--;
    if(t%2===0) bits.push({x:ship.x+(Math.random()*2-1),y:ship.y+5,vx:0,vy:1.2,l:8,col:dash>0?PAL.yel:PAL.pink});
    // spawn
    if(t%Math.max(9,34-lvl*3)===0&&comets.length<26){ const r=2+Math.floor(Math.random()*Math.min(5,2+lvl*.6)); comets.push({x:8+Math.random()*(W-16),y:-10,r,vx:(Math.random()-.5)*(.4+lvl*.12),vy:.7+Math.random()*.8+lvl*.13,ice:Math.random()<.18,rot:Math.random()*6}); }
    if(t%52===0) stars.push({x:10+Math.random()*(W-20),y:-6,vy:.8+Math.random()*.5,ph:Math.random()*6});
    for(let i=comets.length-1;i>=0;i--){ const c=comets[i]; c.x+=c.vx; c.y+=c.vy; if(c.x<c.r||c.x>W-c.r) c.vx*=-1;
      if(t%3===0&&bits.length<160) bits.push({x:c.x+(Math.random()-.5)*c.r,y:c.y-c.r,vx:0,vy:-.2,l:10,col:c.ice?PAL.ice:PAL.yel});
      if(c.y>H+12){ comets.splice(i,1); score+=1; continue; }
      if(inv<=0&&Math.hypot(c.x-ship.x,c.y-ship.y)<c.r+3){ comets.splice(i,1); boom(ship.x,ship.y,PAL.pink,26); boom(c.x,c.y,PAL.rock,14); lives--; combo=0; shake=14; inv=90; beep(180,.35,'sawtooth',-140);
        if(lives<=0){ state='over'; t=0; if(score>hi){ hi=score; try{ localStorage.setItem('cometHopperHi',hi); }catch(e){} } } } }
    for(let i=stars.length-1;i>=0;i--){ const s=stars[i]; s.y+=s.vy; s.x+=Math.sin(t*.05+s.ph)*.4;
      if(s.y>H+6){ stars.splice(i,1); combo=0; continue; }
      if(Math.hypot(s.x-ship.x,s.y-ship.y)<8){ stars.splice(i,1); combo++; const pts=10*Math.min(9,combo); score+=pts; boom(s.x,s.y,PAL.yel,10); flash='+'+pts; flashT=30; beep(520+combo*60,.09,'square',200); } }
  }
  function draw(){
    g.setTransform(1,0,0,1,0,0); g.fillStyle=PAL.bg; g.fillRect(0,0,W,H);
    if(shake>0) g.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*4));
    // nebula bands + planet
    g.fillStyle='#120a33'; g.fillRect(0,150,W,90); g.fillStyle='#1c0f45'; for(let x=0;x<W;x+=2) g.fillRect(x,196+Math.round(Math.sin(x*.07+t*.004)*6),2,44);
    g.fillStyle='#2a1560'; for(let j=-12;j<=12;j++){ const w=Math.round(Math.sqrt(144-j*j)); g.fillRect(142-w,52+j,w*2,1); } g.fillStyle='#ff3d8b'; g.fillRect(124,50,36,1); g.fillRect(128,54,30,1); g.fillStyle='#3d2385'; g.fillRect(134,44,10,2);
    for(const s of bg){ g.fillStyle=s.z===3?PAL.wh:s.z===2?'#8b80c9':'#4a4380'; g.fillRect(Math.round(s.x),Math.round(s.y),1,s.z===3?2:1); }
    for(const b of bits){ g.fillStyle=b.col; g.fillRect(Math.round(b.x),Math.round(b.y),1,1); }
    for(const s of stars){ sprite(STAR,s.x-2,s.y-2,{'1':t%8<4?PAL.yel:PAL.wh}); }
    for(const c of comets){ const r=c.r; for(let j=-r;j<=r;j++) for(let i=-r;i<=r;i++){ const d=i*i+j*j; if(d<=r*r+1){ const edge=(i+j>r*.5); g.fillStyle=c.ice?(edge?'#6fb6e0':PAL.ice):(edge?PAL.rockD:PAL.rock); if((i*7+j*13+Math.floor(c.rot))%5===0&&d<r*r-2) g.fillStyle=c.ice?PAL.wh:'#3d2114'; g.fillRect(Math.round(c.x)+i,Math.round(c.y)+j,1,1); } } }
    if(state==='play'&&(inv<=0||t%6<3)) sprite(SHIP,ship.x-2,ship.y-2,{'1':dash>0?PAL.yel:PAL.ship,'2':PAL.wh,'3':PAL.pink});
    g.setTransform(1,0,0,1,0,0);
    // HUD
    text('SCORE',4,4,PAL.pink); text(String(score).padStart(5,'0'),4,11,PAL.wh);
    text('HI',W-23,4,PAL.pink); text(String(Math.max(hi,score)).padStart(5,'0'),W-23,11,PAL.yel);
    for(let i=0;i<lives;i++) sprite(SHIP,W/2-10+i*8-2,5,{'1':PAL.ship,'2':PAL.wh,'3':PAL.pink});
    if(state==='play'){ g.fillStyle='#2a1560'; g.fillRect(4,H-5,40,2); g.fillStyle=dashCd<=0?PAL.yel:PAL.ship; g.fillRect(4,H-5,Math.round(40*(1-dashCd/70)),2);
      if(combo>1) text('×'+Math.min(9,combo),W-12,H-9,PAL.yel);
      if(flashT>0) text(flash,ship.x,ship.y-12-(30-flashT)/3,PAL.yel,1,true);
      if(t<110) text('LEVEL 1 - HOP!',W/2,H/2-20,PAL.wh,1,true); else if(t%600<90) text('LEVEL '+(1+Math.floor(t/600)),W/2,H/2-20,PAL.wh,1,true); }
    if(state==='title'){ text('COMET',W/2,62,PAL.yel,4,true); text('HOPPER',W/2,88,PAL.ship,4,true);
      sprite(SHIP,W/2-2,126+Math.round(Math.sin(t*.08)*3),{'1':PAL.ship,'2':PAL.wh,'3':PAL.pink});
      text('DODGE THE COMETS',W/2,150,PAL.wh,1,true); text('GRAB THE ★ STARS',W/2,160,PAL.wh,1,true);
      if(t%50<32) text('PRESS START',W/2,186,PAL.pink,2,true); }
    if(state==='over'){ text('GAME',W/2,70,PAL.pink,4,true); text('OVER',W/2,96,PAL.pink,4,true); text('SCORE '+score,W/2,134,PAL.wh,2,true);
      if(score>=hi&&score>0) text('NEW HI SCORE!',W/2,154,PAL.yel,1,true); if(t>40&&t%50<32) text('PRESS START',W/2,186,PAL.ship,2,true); }
  }
  let last=0, accT=0;
  function loop(ts){ const dt=Math.min(50,ts-last||16); last=ts; accT+=dt; let n=0; while(accT>=16.67&&n++<4){ update(); accT-=16.67; } draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a'){ keys.l=true; e.preventDefault(); } else if(k==='arrowright'||k==='d'){ keys.r=true; e.preventDefault(); }
    else if((k===' '||k==='enter')&&!e.repeat){ e.preventDefault(); if(state==='over'&&t<40) return; action(); } });
  addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(k==='arrowleft'||k==='a') keys.l=false; if(k==='arrowright'||k==='d') keys.r=false; });
  const hold=(id,key)=>{ const b=document.getElementById(id); const on=e=>{ e.preventDefault(); keys[key]=true; b.classList.add('down'); if(state!=='play') action(); }, off=()=>{ keys[key]=false; b.classList.remove('down'); };
    b.addEventListener('pointerdown',on); ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off)); };
  hold('bl','l'); hold('br','r');
  document.getElementById('bg').addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='over'&&t<40) return; action(); });
  const toX=e=>{ const r=cv.getBoundingClientRect(); return (e.clientX-r.left)/r.width*W; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); if(state!=='play'){ if(!(state==='over'&&t<40)) start(); } dragX=toX(e); try{cv.setPointerCapture(e.pointerId)}catch(_){} });
  cv.addEventListener('pointermove',e=>{ if(dragX!==null) dragX=toX(e); });
  ['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{ dragX=null; }));
  addEventListener('blur',()=>{ keys.l=keys.r=false; });
})();
</script>
</body>
</html>
