<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fish Who Ate the Moon — a shadow play</title>
<meta name="description" content="A shadow-puppet theatre behind a glowing cloth screen: an old fisher, a hungry fish and a stolen moon, performed on rods in a short looping tale. You work the crane.">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#0d0705;color:#e8c98a;font-family:"Hoefler Text","Baskerville","Palatino Linotype",Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;padding:16px 12px 26px;
  background-image:radial-gradient(ellipse at 50% 42%,#3a1c0c 0,#1a0c06 46%,#080403 100%)}
.back{position:fixed;left:14px;top:12px;color:#b98d4c;font-size:13px;letter-spacing:.2em;text-decoration:none;opacity:.8}
.back:hover{opacity:1}
.booth{width:min(100%,1080px,calc((100svh - 190px) * 1.62));min-width:300px}
.pelmet{text-align:center;padding:14px 10px 12px;background:linear-gradient(#5b2d14,#34170a);border:2px solid #7c4a22;border-bottom:0;border-radius:140px 140px 0 0/38px 38px 0 0;box-shadow:inset 0 2px 0 rgba(255,210,140,.18)}
.pelmet small{display:block;font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:#b98d4c}
h1{margin:4px 0 0;font-weight:400;font-style:italic;font-size:clamp(21px,4.4vw,44px);line-height:1.05;color:#f3d79a;text-shadow:0 0 22px rgba(255,170,60,.35)}
.frame{padding:clamp(8px,1.6vw,18px);background:repeating-linear-gradient(92deg,#4a2410 0 7px,#55290f 7px 9px,#40200d 9px 17px);border:2px solid #7c4a22;box-shadow:0 30px 70px #000,inset 0 0 0 1px #2a1206}
svg{display:block;width:100%;height:auto;aspect-ratio:5/3;touch-action:none;cursor:none;box-shadow:0 0 0 2px #1d0c04,0 0 60px rgba(255,150,40,.28);background:#c56a1c}
.sill{background:linear-gradient(#3a1a0b,#22100a);border:2px solid #7c4a22;border-top:0;padding:14px 18px 16px;text-align:center}
#cap{margin:0;min-height:3.1em;font-size:clamp(15px,2.2vw,21px);font-style:italic;color:#f0d8a8;transition:opacity .6s}
.dots{display:flex;gap:9px;justify-content:center;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;border:1px solid #b98d4c;transition:background .4s}
.dots i.on{background:#f3d79a;box-shadow:0 0 8px #ffb84d}
.hint{margin:12px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8d6a3a;text-align:center}
</style>
</head>
<body>
<a class="back" href="index.html">← 100</a>
<div class="booth">
  <div class="pelmet"><small>The Paper Lantern Company presents</small><h1>The Fish Who Ate the Moon</h1></div>
  <div class="frame">
  <svg id="s" viewBox="0 0 1000 600" role="img" aria-label="Shadow puppets of a fisher in a boat, a great fish, a crane and the moon, moving behind a lit cloth screen">
    <defs>
      <radialGradient id="lamp" cx="50%" cy="56%" r="72%"><stop offset="0" stop-color="#fff0b8"/><stop offset=".3" stop-color="#ffc85a"/><stop offset=".68" stop-color="#d97a20"/><stop offset="1" stop-color="#5a2206"/></radialGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#fff6d0" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d0" stop-opacity="0"/></radialGradient>
      <filter id="weave" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .04" numOctaves="2" seed="4" result="a"/><feTurbulence type="fractalNoise" baseFrequency=".04 .9" numOctaves="2" seed="9" result="b"/>
        <feBlend in="a" in2="b" mode="multiply"/><feColorMatrix values="0 0 0 0 .22 0 0 0 0 .09 0 0 0 0 0 0 0 0 -1.5 1.05"/></filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
      <filter id="far" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter>
    </defs>
    <rect width="1000" height="600" fill="url(#lamp)"/>
    <rect id="flick" width="1000" height="600" fill="#ffe9a6" opacity="0"/>
    <rect width="1000" height="600" filter="url(#weave)" opacity=".5"/>
    <circle id="glow" cx="590" cy="130" r="150" fill="url(#halo)"/>
    <rect id="dark" width="1000" height="600" fill="#1c0700" opacity="0"/>
    <g fill="#190b04" stroke="none">
      <g filter="url(#far)" opacity=".8">
        <g id="moon"><line x1="0" y1="0" x2="26" y2="700" stroke="#190b04" stroke-width="4" opacity=".6"/><circle r="52"/><path d="M14,-40 A42,42 0 1,0 14,40 A31,31 0 1,1 14,-40Z" fill="#fff1c0"/>
          <path d="M-70,-48 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4z M66,30 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3z"/></g>
      </g>
      <g filter="url(#soft)">
        <g id="reedL" transform="translate(40,560)"><path d="M0,0 C-8,-120 4,-220 30,-300 C16,-200 14,-110 14,0Z M22,0 C30,-90 56,-160 96,-210 C64,-150 46,-80 40,0Z M-18,0 C-30,-70 -52,-120 -78,-150 C-48,-110 -34,-60 -30,0Z"/><ellipse cx="33" cy="-308" rx="7" ry="26" transform="rotate(12 33 -308)"/></g>
        <g id="reedR" transform="translate(955,560)"><path d="M0,0 C6,-130 -6,-230 -36,-330 C-18,-220 -14,-110 -14,0Z M-24,0 C-34,-80 -62,-150 -104,-190 C-70,-140 -50,-70 -42,0Z M18,0 C24,-60 34,-110 50,-140 C40,-100 34,-50 32,0Z"/><ellipse cx="-39" cy="-338" rx="7" ry="26" transform="rotate(-12 -39 -338)"/></g>
        <g id="fish"><line x1="0" y1="20" x2="-10" y2="700" stroke="#190b04" stroke-width="5" opacity=".55"/>
          <g id="ftail" transform="translate(58,0)"><path d="M-4,-18 C30,-10 52,-52 82,-60 C68,-22 68,22 82,60 C52,52 30,10 -4,18Z"/></g>
          <path d="M-112,2 C-92,-48 -10,-56 62,-18 L62,18 C-10,54 -92,46 -100,10 L-80,4Z"/><path d="M-52,-40 C-34,-78 8,-74 30,-32Z"/><path d="M-30,40 C-22,62 0,64 10,40Z"/>
          <circle cx="-80" cy="-12" r="6" fill="#ffd27a"/><path d="M-42,-18 q14,20 0,40 M-12,-22 q16,22 0,44 M18,-18 q13,18 0,36" fill="none" stroke="#ffc96b" stroke-width="4" stroke-linecap="round"/>
          <circle id="belly" cx="-22" cy="6" r="24" fill="#fff3c4" opacity="0"/></g>
        <g id="boat"><line x1="0" y1="0" x2="0" y2="700" stroke="#190b04" stroke-width="5" opacity=".55"/>
          <path d="M-132,-24 L132,-24 C104,36 -104,36 -132,-24Z M130,-24 C152,-42 152,-64 136,-70 C143,-52 136,-38 116,-24Z"/>
          <path d="M-70,-10 h140 M-50,6 h100" stroke="#ffc96b" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 14"/>
          <path d="M-30,-24 C-34,-72 -20,-98 0,-100 C22,-98 32,-72 30,-24Z"/><circle cx="2" cy="-114" r="15"/><path d="M-42,-120 L2,-154 L46,-120Z"/>
          <g id="arm" transform="translate(14,-84)"><path d="M0,-7 L52,-20 L54,-9 L0,9Z"/><path d="M46,-13 L200,-124" stroke="#190b04" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M200,-124 L204,6" stroke="#190b04" stroke-width="1.6" fill="none"/><circle cx="204" cy="10" r="5"/></g></g>
        <g id="crane"><line x1="6" y1="10" x2="30" y2="760" stroke="#190b04" stroke-width="4" opacity=".55"/>
          <g id="w2" transform="translate(4,-8)"><path d="M-16,2 C-6,-58 48,-96 104,-100 C80,-64 56,-28 26,6Z" opacity=".8"/></g>
          <path d="M-48,0 C-40,-22 30,-24 52,-4 C30,22 -30,22 -48,0Z"/><path d="M42,-10 L92,-20 86,-4 96,6 44,10Z"/><path d="M36,6 L140,26 142,31 36,14Z"/>
          <g id="neck" transform="translate(-38,-4)"><path d="M4,-6 C-28,-12 -42,-40 -68,-46 L-122,-40 L-70,-34 C-52,-28 -36,-6 0,10Z"/><circle cx="-70" cy="-41" r="2.6" fill="#ffd27a"/></g>
          <g id="w1" transform="translate(0,-8)"><path d="M-18,2 C-12,-66 44,-108 98,-118 C76,-74 54,-30 26,6Z"/><path d="M6,-20 C20,-52 44,-76 70,-90" stroke="#ffc96b" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 10"/></g></g>
        <path id="wv1" d=""/><path id="wv2" d="" opacity=".75"/>
      </g>
    </g>
  </svg>
  </div>
  <div class="sill"><p id="cap"></p><div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div></div>
  <p class="hint">Move the pointer (or a finger) across the cloth — you are the crane</p>
</div>
<script>
(function(){
const $=id=>document.getElementById(id),svg=$('s'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,LOOP=30;
const TALE=[[0,'An old fisher rowed out each night to catch her supper.'],[7,'One night the river held a fish as long as her boat, and hungry for light.'],
[14.5,'It leapt, and swallowed the moon whole. The river went dark.'],[19,'But a crane came down and tickled its belly, until it laughed the moon back out.'],[25,'And the fisher rowed home by moonlight, supper quite forgotten.']];
const ss=u=>u*u*(3-2*u);
function kf(t,p){if(t<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(t<=p[i][0]){const a=p[i-1],b=p[i];return a[1]+(b[1]-a[1])*ss((t-a[0])/(b[0]-a[0]))}return p[p.length-1][1]}
function wave(y,amp,w){let d='M-200,640 L-200,'+y;for(let x=-200;x<1200;x+=w)d+=' q'+w/2+','+(-amp)+' '+w+',0';return d+' L1200,640Z'}
$('wv1').setAttribute('d',wave(548,20,70));$('wv2').setAttribute('d',wave(572,16,54));
const T=(el,s)=>el.setAttribute('transform',s);
let cx=780,cy=210,tx=780,ty=210,user=0,pvx=0,scene=-1,t0=performance.now(),tFix=reduce?11:null;
function pt(e){const r=svg.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*1000;ty=Math.min(470,Math.max(60,(e.clientY-r.top)/r.height*600));user=performance.now()}
svg.addEventListener('pointermove',pt);svg.addEventListener('pointerdown',pt);
function frame(now){const sec=now/1000,t=tFix!=null?tFix:((now-t0)/1000)%LOOP;
  let s=0;TALE.forEach((c,i)=>{if(t>=c[0])s=i});
  if(s!==scene){scene=s;const cap=$('cap');cap.style.opacity=0;setTimeout(()=>{cap.textContent=TALE[s][1];cap.style.opacity=1},reduce?0:350);[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i===s))}
  /* boat & fisher */
  const bx=kf(t,[[0,-220],[4.5,175],[25.5,175],[29.5,-240]]),by=512+Math.sin(sec*1.7)*5,br=Math.sin(sec*1.7+1)*2.4;
  T($('boat'),'translate('+bx+','+by+') rotate('+br+')');
  const arm=kf(t,[[4,18],[5.4,-38],[6.6,8],[14.8,8],[15.8,-46],[18.5,-30],[20,6],[25,6],[26.5,24]])+Math.sin(sec*2.3)*3;
  T($('arm'),'translate(14,-84) rotate('+arm+')');
  /* fish */
  let fx,fy,fr;
  if(t<15){fx=kf(t,[[7,1180],[10.5,760]])+(t>10.5?Math.sin((t-10.5)*1.4)*34:0);fy=534+Math.sin(sec*2)*6;fr=Math.sin(sec*2+.6)*5}
  else if(t<18){const u=(t-15)/3;fx=760-340*u;fy=534-400*Math.sin(Math.PI*u);fr=Math.atan2(-400*Math.PI*Math.cos(Math.PI*u),-340)*180/Math.PI-180}
  else{const lg=t>19.5&&t<23.6?1:0;fx=420+Math.sin(sec*1.1)*14-kf(t,[[25,0],[28,120]]);fy=530+Math.sin(sec*2)*6+lg*Math.sin(sec*19)*5+kf(t,[[25,0],[28,190]]);fr=Math.sin(sec*2+.6)*5+lg*Math.sin(sec*23)*7}
  T($('fish'),'translate('+fx+','+fy+') rotate('+fr+')');
  T($('ftail'),'translate(58,0) rotate('+Math.sin(sec*(t>15&&t<18?14:5))*20+')');
  const eaten=t>16.45&&t<23.6;$('belly').setAttribute('opacity',eaten?.75+Math.sin(sec*6)*.2:0);
  /* moon */
  let mx=590,my=132+Math.sin(sec*.8)*4,ms=1;
  if(eaten){ms=0}else if(t>=23.6&&t<25.6){const u=ss((t-23.6)/2);mx=fx-96+(590-(fx-96))*u;my=fy-10+(132-(fy-10))*u;ms=.25+.75*u}
  T($('moon'),'translate('+mx+','+my+') scale('+ms+')');
  const dk=kf(t,[[16.3,0],[16.9,.56],[23.6,.56],[25.2,0]]);$('dark').setAttribute('opacity',dk);
  const g=$('glow');g.setAttribute('cx',mx);g.setAttribute('cy',my);g.setAttribute('opacity',ms*.9);
  $('flick').setAttribute('opacity',reduce?0:.05+.04*Math.sin(sec*9.1)*Math.sin(sec*3.7));
  /* crane: pointer, or autopilot */
  if(now-user>2600||!user){if(t>19.2&&t<23.6){tx=fx+70+Math.sin(sec*5)*24;ty=fy-92+Math.sin(sec*9)*10}else{tx=760+Math.sin(sec*.5)*150;ty=220+Math.sin(sec*.83)*90}}
  const ox=cx;cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;pvx=pvx*.9+(cx-ox)*.1;
  const flap=Math.sin(sec*(reduce?0:7.5));
  T($('crane'),'translate('+cx+','+cy+') rotate('+Math.max(-22,Math.min(22,pvx*2.2))+') scale('+(pvx>.6?-1:1)+',1)');
  T($('w1'),'translate(0,-8) rotate('+(8+flap*34)+')');T($('w2'),'translate(4,-8) rotate('+(-4+flap*30)+')');
  T($('neck'),'translate(-38,-4) rotate('+(Math.sin(sec*2.1)*6-flap*4)+')');
  T($('reedL'),'translate(40,560) rotate('+Math.sin(sec*.9)*2.5+')');T($('reedR'),'translate(955,560) rotate('+Math.sin(sec*.9+1.4)*2.5+')');
  T($('wv1'),'translate('+Math.sin(sec*.6)*34+',0)');T($('wv2'),'translate('+Math.sin(sec*.6+2)*-40+','+Math.sin(sec*1.3)*3+')');
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
