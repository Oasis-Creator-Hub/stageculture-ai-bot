<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TORUS.EXE — a doughnut over the character plains</title>
<meta name="description" content="A real-time ASCII renderer: a shaded 3D torus turning above a scrolling voxel terrain, drawn entirely in a monospace character grid.">
<style>
  :root { --bg: #140d06; --fg: #ffb347; --dim: #8a5a1c; --hot: #fff1c9; --glow: rgba(255,160,40,.45); }
  [data-theme="phosphor"] { --bg: #04110a; --fg: #5dff9a; --dim: #1f7a48; --hot: #e6fff0; --glow: rgba(60,255,150,.4); }
  [data-theme="paper"] { --bg: #ece6d6; --fg: #1c1a17; --dim: #8d8672; --hot: #c2351f; --glow: transparent; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; transition: background .4s, color .4s; }
  body { font-family: "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace; font-size: 13px; }
  main { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: clamp(8px, 1.6vw, 18px); gap: 8px; }
  header, footer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; white-space: nowrap; }
  header { justify-content: space-between; border-bottom: 1px dashed var(--dim); padding-bottom: 8px; }
  h1 { margin: 0; font-size: 1em; font-weight: 700; letter-spacing: .12em; color: var(--hot); }
  h1 span { color: var(--fg); font-weight: 400; }
  .stat { color: var(--dim); letter-spacing: .06em; }
  .stat b { color: var(--fg); font-weight: 400; }
  header a { color: var(--dim); text-decoration: none; letter-spacing: .1em; }
  header a:hover, header a:focus-visible { color: var(--hot); }
  .screen { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  .screen:active { cursor: grabbing; }
  pre { margin: 0; position: absolute; inset: 0; font: inherit; font-size: var(--fs, 13px); line-height: 1; letter-spacing: 0; white-space: pre; overflow: hidden; text-shadow: 0 0 6px var(--glow); user-select: none; -webkit-user-select: none; }
  .probe { position: absolute; visibility: hidden; font-size: var(--fs, 13px); line-height: 1; white-space: pre; }
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.14) 2px 3px), radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.45)); }
  [data-theme="paper"] .screen::after { background: none; }
  footer { border-top: 1px dashed var(--dim); padding-top: 8px; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; align-items: center; gap: 4px; min-width: 0; }
  legend { float: left; padding: 0; margin-right: 6px; color: var(--dim); letter-spacing: .1em; }
  button { font: inherit; color: var(--fg); background: none; border: 1px solid var(--dim); padding: .32em .7em; cursor: pointer; letter-spacing: .04em; }
  button:hover, button:focus-visible { border-color: var(--hot); color: var(--hot); outline: none; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: clamp(90px, 14vw, 160px); height: 1.4em; background: none; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--dim); }
  input[type=range]::-moz-range-track { height: 1px; background: var(--dim); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: .8em; height: 1.3em; margin-top: -.65em; background: var(--fg); border: 0; }
  input[type=range]::-moz-range-thumb { width: .8em; height: 1.3em; background: var(--fg); border: 0; border-radius: 0; }
  input[type=range]:focus-visible { outline: 1px dashed var(--hot); }
  @media (max-width: 620px) { body { font-size: 11px; } .hide-s { display: none; } }
</style>
</head>
<body data-theme="amber">
<main>
  <header>
    <h1>TORUS.EXE <span>// doughnut over the character plains</span></h1>
    <span class="stat"><b id="dims">0x0</b> cells <span class="hide-s">&middot; <b id="fps">--</b> fps &middot; drag to tumble</span></span>
    <a href="index.html">[&larr; 100]</a>
  </header>
  <div class="screen" id="screen"><span class="probe" id="probe">MMMMMMMMMMMMMMMMMMMM</span><pre id="out" aria-label="ASCII rendering of a rotating torus above scrolling terrain"></pre></div>
  <footer>
    <fieldset id="scene"><legend>scene</legend><button data-v="both" aria-pressed="true">both</button><button data-v="torus" aria-pressed="false">torus</button><button data-v="terrain" aria-pressed="false">terrain</button></fieldset>
    <fieldset id="chars"><legend>glyphs</legend><button data-v="classic" aria-pressed="true">.:-=+*#%@</button><button data-v="blocks" aria-pressed="false">&#9617;&#9618;&#9619;&#9608;</button><button data-v="binary" aria-pressed="false">0101</button><button data-v="slant" aria-pressed="false">/\|X</button></fieldset>
    <fieldset><legend>speed</legend><input id="speed" type="range" min="0" max="3" step="0.05" value="1" aria-label="Speed"></fieldset>
    <fieldset id="theme"><legend>tube</legend><button data-v="amber" aria-pressed="true">amber</button><button data-v="phosphor" aria-pressed="false">p1</button><button data-v="paper" aria-pressed="false">print</button></fieldset>
  </footer>
</main>
<script>
(() => {
  const RAMPS = { classic: ' .,:-=+*#%@', blocks: ' ░▒▓█', binary: ' 0011', slant: ' .\'/\\|XN#' };
  const out = document.getElementById('out'), screen = document.getElementById('screen'), probe = document.getElementById('probe');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cols = 0, rows = 0, buf, zbuf, aspect = 2, ramp = RAMPS.classic, scene = 'both', speed = 1;
  let A = 1.1, B = .4, travel = 0, spin = 0, dragA = 0, dragB = 0;

  function measure() {
    const small = innerWidth < 620;
    screen.style.setProperty('--fs', (small ? 10 : innerWidth < 1100 ? 12 : 14) + 'px');
    const pr = probe.getBoundingClientRect(), cw = pr.width / 20, ch = pr.height;
    aspect = ch / cw;
    cols = Math.max(20, Math.min(220, Math.floor(screen.clientWidth / cw)));
    rows = Math.max(12, Math.min(90, Math.floor(screen.clientHeight / ch)));
    buf = new Array(cols * rows); zbuf = new Float32Array(cols * rows);
    document.getElementById('dims').textContent = cols + 'x' + rows;
  }
  const height = (x, z) => {
    const h = .5 + .26 * Math.sin(x * .33 + Math.sin(z * .19) * 1.4) + .19 * Math.sin(z * .37 + x * .12) + .07 * Math.sin(x * 1.07 + z * .83);
    return h < 0 ? 0 : h > 1 ? 1 : h;
  };
  // terrain: one ray fan per column, front to back, filling upward (voxel-space)
  function terrain() {
    const last = ramp.length - 1, hz = rows * (scene === 'terrain' ? .34 : .5), camH = 1.75, sy = rows * 1.15, DEPTH = 64;
    for (let c = 0; c < cols; c++) {
      const sx = (c / cols - .5) * 1.5 * (cols / rows / aspect);
      let ymax = rows, dz = .9;
      for (let i = 0; i < DEPTH && ymax > 0; i++, dz *= 1.062) {
        const wx = sx * dz + Math.sin(travel * .07) * 6, wz = travel + dz, h = height(wx, wz);
        const row = Math.floor(hz + (camH - h * 1.5) / dz * sy);
        if (row < ymax) {
          const slope = (h - height(wx - .35, wz + .2)) * 5, fog = 1 - i / DEPTH;
          let lum = (.22 + h * .5 + slope) * fog; lum = lum < .04 ? .04 : lum > 1 ? 1 : lum;
          const ch = ramp[Math.max(1, Math.round(lum * last))];
          for (let r = Math.max(0, row); r < ymax; r++) buf[r * cols + c] = (r === row && h > .78) ? ramp[last] : ch;
          ymax = Math.max(0, row);
        }
      }
    }
    // a few fixed stars in whatever sky is left
    for (let i = 0; i < 40; i++) { const p = (i * 7919 + 13) % (cols * Math.floor(hz)); if (buf[p] === ' ') buf[p] = i % 5 ? '.' : '+'; }
  }
  function torus() {
    const last = ramp.length - 1, R1 = 1, R2 = 2, K2 = 6.5, cy = rows * (scene === 'torus' ? .5 : .34);
    const K1 = Math.min(rows * (scene === 'torus' ? .42 : .3), cols / aspect * .42) * K2 / (R1 + R2);
    const cA = Math.cos(A + dragA), sA = Math.sin(A + dragA), cB = Math.cos(B + dragB), sB = Math.sin(B + dragB);
    const dT = Math.max(.03, 2.2 / K1), dP = Math.max(.012, .9 / K1);
    zbuf.fill(0);
    for (let th = 0; th < 6.2832; th += dT) {
      const ct = Math.cos(th), st = Math.sin(th), cx0 = R2 + R1 * ct, cy0 = R1 * st;
      for (let ph = 0; ph < 6.2832; ph += dP) {
        const cp = Math.cos(ph), sp = Math.sin(ph);
        // revolve about Y, tilt about X by A, roll about Z by B
        const x1 = cx0 * cp, z1 = -cx0 * sp, y2 = cy0 * cA - z1 * sA, z2 = cy0 * sA + z1 * cA, x3 = x1 * cB - y2 * sB, y3 = x1 * sB + y2 * cB;
        const ooz = 1 / (z2 + K2), xp = Math.round(cols / 2 + K1 * aspect * ooz * x3), yp = Math.round(cy - K1 * ooz * y3);
        if (xp < 0 || xp >= cols || yp < 0 || yp >= rows) continue;
        const k = yp * cols + xp;
        if (ooz > zbuf[k]) {
          zbuf[k] = ooz;
          const nx1 = ct * cp, nz1 = -ct * sp, ny2 = st * cA - nz1 * sA, nz2 = st * sA + nz1 * cA, ny3 = nx1 * sB + ny2 * cB, nx3 = nx1 * cB - ny2 * sB;
          const L = ny3 * .64 - nz2 * .64 - nx3 * .42;
          buf[k] = ramp[L > 0 ? Math.max(1, Math.min(last, Math.round(L * last * 1.02))) : 1];
        }
      }
    }
  }
  function render() {
    buf.fill(' ');
    if (scene !== 'torus') terrain();
    if (scene !== 'terrain') torus();
    let s = '';
    for (let r = 0; r < rows; r++) s += buf.slice(r * cols, (r + 1) * cols).join('') + (r < rows - 1 ? '\n' : '');
    out.textContent = s;
  }
  let prev = 0, frames = 0, fpsAt = 0;
  function loop(ms) {
    const dt = Math.min(.05, (ms - prev) / 1000 || .016); prev = ms;
    spin += dt * speed; A = 1.1 + spin * .9; B = .4 + spin * .45; travel += dt * speed * 5;
    render();
    frames++; if (ms - fpsAt > 600) { document.getElementById('fps').textContent = Math.round(frames * 1000 / (ms - fpsAt)); frames = 0; fpsAt = ms; }
    requestAnimationFrame(loop);
  }
  const once = () => { if (reduce) render(); };
  function group(id, fn) {
    const g = document.getElementById(id);
    g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; g.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', o === b)); fn(b.dataset.v); once(); });
  }
  group('scene', v => scene = v);
  group('chars', v => ramp = RAMPS[v]);
  group('theme', v => document.body.dataset.theme = v);
  document.getElementById('speed').addEventListener('input', e => { speed = +e.target.value; });
  let drag = null;
  screen.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY, dragA, dragB]; screen.setPointerCapture(e.pointerId); });
  screen.addEventListener('pointermove', e => { if (!drag) return; dragB = drag[3] + (e.clientX - drag[0]) * .01; dragA = drag[2] + (e.clientY - drag[1]) * .01; once(); });
  const up = () => { drag = null; }; screen.addEventListener('pointerup', up); screen.addEventListener('pointercancel', up);
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { measure(); once(); }, 100); });
  measure();
  if (reduce) render(); else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
