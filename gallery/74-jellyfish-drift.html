<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Drift — jellyfish at 238 metres</title>
<meta name="description" content="A quiet canvas dive: translucent jellyfish pulse upward through dark water, trailing verlet tentacles through marine snow. Move to stir the current, tap to startle.">
<style>
  html,body{margin:0;height:100%;background:#010a12;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .log{position:fixed;left:clamp(16px,4vw,44px);bottom:clamp(16px,4vh,40px);color:#bfe9e6;pointer-events:none;max-width:min(78vw,420px)}
  .log h1{font:italic 400 clamp(30px,5.4vw,58px)/.95 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;margin:0 0 12px;letter-spacing:-.01em;
    color:#e9fffb;text-shadow:0 0 30px rgba(90,220,220,.35)}
  .log p{font:12px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;margin:0;letter-spacing:.12em;text-transform:uppercase;opacity:.62}
  .log p b{font-weight:400;color:#ffd7a8}
  .log .hint{margin-top:8px;opacity:.38;letter-spacing:.08em;text-transform:none}
  a{position:fixed;right:clamp(14px,3vw,30px);top:clamp(12px,3vh,26px);font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#8fd6d2;
    text-decoration:none;opacity:.6;border-bottom:1px solid rgba(143,214,210,.4);padding-bottom:3px}
  a:hover{opacity:1}
  .gauge{position:fixed;right:clamp(14px,3vw,30px);bottom:clamp(16px,4vh,40px);height:38vh;width:1px;background:linear-gradient(transparent,rgba(190,235,230,.5),transparent);pointer-events:none}
  .gauge i{position:absolute;left:-4px;width:9px;height:1px;background:#ffd7a8;top:62%;box-shadow:0 0 8px #ffd7a8}
</style>
</head>
<body>
<canvas id="sea" aria-label="Animated jellyfish drifting in dark water"></canvas>
<div class="log">
  <h1>Night drift</h1>
  <p>Station <b>Ys-11</b> · depth <b id="depth">238.0</b> m · <b>6.1</b> °C</p>
  <p class="hint">Move through the water to stir it. Tap near a bell to startle it.</p>
</div>
<div class="gauge"><i></i></div>
<a href="index.html">← 100</a>
<script>
(function(){
  const cv=document.getElementById('sea'),ctx=cv.getContext('2d'),depthEl=document.getElementById('depth');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,SP=reduce?.3:1;
  let W=0,H=0,dpr=1,t=0,jel=[],snow=[],rip=[],bg=null;
  const ptr={x:-999,y:-999,vx:0,vy:0,on:false};
  const R=(a,b)=>a+Math.random()*(b-a);

  function chain(n,seg,x,y){const p=[];for(let i=0;i<n;i++)p.push({x:x,y:y+i*seg,px:x,py:y+i*seg});return p}
  function makeJelly(i,any){
    const z=R(.45,1.15),s=(Math.min(W,H)*.075+18)*z,j={z,s,x:R(.08,.92)*W,y:any?R(.1,1)*H:H+s*4,
      vx:0,vy:0,ang:R(-.35,.35),ph:Math.random(),rate:R(.0042,.0068)/Math.sqrt(z),hue:[178,196,322,268,24,188][i%6]+R(-8,8),seed:R(0,99),tents:[],arms:[]};
    const nt=7+Math.round(z*4);
    for(let k=0;k<nt;k++){const n=10+Math.round(R(0,7));j.tents.push({a:-0.92+1.84*k/(nt-1),seg:s*R(.13,.2),k:R(0,9),pts:chain(n,s*.16,j.x,j.y)})}
    for(let k=0;k<4;k++)j.arms.push({a:-.3+.2*k,seg:s*.14,k:R(0,9),pts:chain(8,s*.14,j.x,j.y)});
    return j}
  function build(){
    const n=Math.max(4,Math.min(9,Math.round(W*H/150000)));jel=[];for(let i=0;i<n;i++)jel.push(makeJelly(i,true));jel.sort((a,b)=>a.z-b.z);
    const m=Math.min(reduce?70:190,Math.round(W*H/7000));snow=[];
    for(let i=0;i<m;i++)snow.push({x:R(0,W),y:R(0,H),z:R(.2,1),k:R(0,9)});
    bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07394a');bg.addColorStop(.45,'#042232');bg.addColorStop(1,'#010a12')}
  function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);build()}

  function pulse(p){return p<.28?Math.sin(p/.28*Math.PI/2):Math.pow(Math.cos((p-.28)/.72*Math.PI/2),1.6)}
  function simChain(c,ax,ay,j,stiff){
    const p=c.pts;p[0].x=ax;p[0].y=ay;
    for(let i=1;i<p.length;i++){const q=p[i],vx=(q.x-q.px)*.9,vy=(q.y-q.py)*.9;q.px=q.x;q.py=q.y;
      q.x+=vx+Math.sin(t*.9+c.k+i*.55)*.06*j.z*SP;q.y+=vy+.035*j.z*SP;
      const dx=q.x-ptr.x,dy=q.y-ptr.y,d2=dx*dx+dy*dy;
      if(d2<16000){const f=(1-d2/16000)*.12;q.x+=ptr.vx*f+dx*f*.01;q.y+=ptr.vy*f+dy*f*.01}}
    for(let it=0;it<2;it++)for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-c.seg*stiff)/d;b.x-=dx*f;b.y-=dy*f}}
  function strokeChain(p,w0,w1,col,alpha){
    for(let i=1;i<p.length;i++){const f=i/p.length;ctx.globalAlpha=alpha*(1-f*.85);ctx.lineWidth=w0+(w1-w0)*f;ctx.beginPath();
      const a=p[i-1],b=p[i],mx0=i>1?(p[i-2].x+a.x)/2:a.x,my0=i>1?(p[i-2].y+a.y)/2:a.y;
      ctx.moveTo(mx0,my0);ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);ctx.strokeStyle=col;ctx.stroke()}
    ctx.globalAlpha=1}

  function stepJelly(j){
    j.ph+=j.rate*SP;if(j.ph>=1)j.ph-=1;
    const c=pulse(j.ph),ux=Math.sin(j.ang),uy=-Math.cos(j.ang);
    if(j.ph<.28){const th=.055*j.z*SP;j.vx+=ux*th;j.vy+=uy*th}
    j.vy+=.004*SP;j.vx*=.985;j.vy*=.985;
    j.ang+=Math.sin(t*.13+j.seed)*.0016*SP+(-j.ang)*.0006;
    const dx=j.x-ptr.x,dy=j.y-ptr.y,d=Math.hypot(dx,dy);
    if(d<j.s*3.2&&ptr.on){j.vx+=dx/d*.02;j.vy+=dy/d*.02;j.ang+=(dx>0?1:-1)*.002}
    if(j.x<j.s)j.ang+=.003;if(j.x>W-j.s)j.ang-=.003;
    j.x+=j.vx*SP;j.y+=j.vy*SP;
    if(j.y<-j.s*7||j.x<-j.s*4||j.x>W+j.s*4){const i=jel.indexOf(j),n=makeJelly(i,false);n.z=j.z;jel[i]=n;return}
    j.c=c;j.w=j.s*(1-.24*c);j.h=j.s*.92*(1+.14*c);
    const ca=Math.cos(j.ang),sa=Math.sin(j.ang);
    j.tents.forEach(tn=>{const lx=tn.a*j.w*.94,ly=j.s*.05;simChain(tn,j.x+lx*ca-ly*sa,j.y+lx*sa+ly*ca,j,1-.25*c)});
    j.arms.forEach(a=>{const lx=a.a*j.w,ly=-j.h*.12;simChain(a,j.x+lx*ca-ly*sa,j.y+lx*sa+ly*ca,j,1)})}

  function drawJelly(j){
    const {s,w,h,hue:hu,z,c}=j,dim=.35+.65*Math.min(1,z);
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    j.tents.forEach(tn=>strokeChain(tn.pts,1.3*z,.4,'hsl('+hu+',75%,74%)',.38*dim));
    j.arms.forEach(a=>{strokeChain(a.pts,s*.13,s*.02,'hsl('+(hu+18)+',70%,62%)',.13*dim);strokeChain(a.pts,1.6*z,.5,'hsl('+(hu+18)+',85%,84%)',.45*dim)});
    ctx.save();ctx.translate(j.x,j.y);ctx.rotate(j.ang);
    // halo
    let g=ctx.createRadialGradient(0,-h*.45,0,0,-h*.45,s*2.3);g.addColorStop(0,'hsla('+hu+',90%,65%,'+(.16+.1*c)*dim+')');g.addColorStop(1,'hsla('+hu+',90%,60%,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-h*.45,s*2.3,0,7);ctx.fill();
    // bell
    const sc=7,dip=s*(.07+.05*c);
    ctx.beginPath();ctx.moveTo(-w,0);ctx.bezierCurveTo(-w*1.08,-h*.82,-w*.56,-h,0,-h);ctx.bezierCurveTo(w*.56,-h,w*1.08,-h*.82,w,0);
    for(let i=0;i<sc;i++){const x1=w-(i+1)*2*w/sc,xm=w-(i+.5)*2*w/sc;ctx.quadraticCurveTo(xm,dip*1.6,x1,i<sc-1?-dip*.25:0)}
    ctx.closePath();
    g=ctx.createRadialGradient(0,-h*.62,s*.05,0,-h*.4,s*1.12);
    g.addColorStop(0,'hsla('+hu+',85%,88%,'+.5*dim+')');g.addColorStop(.55,'hsla('+hu+',80%,62%,'+.2*dim+')');g.addColorStop(1,'hsla('+(hu+20)+',85%,58%,'+.34*dim+')');
    ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='hsla('+hu+',90%,86%,'+.55*dim+')';ctx.lineWidth=1.1*z;ctx.stroke();
    // radial canals
    ctx.strokeStyle='hsla('+hu+',80%,85%,'+.14*dim+')';ctx.lineWidth=.7;ctx.beginPath();
    for(let i=-4;i<=4;i++){const f=i/4.6;ctx.moveTo(f*w*.18,-h*.9);ctx.quadraticCurveTo(f*w*.8,-h*.75,f*w*.98,-s*.02)}ctx.stroke();
    // four-leaf gonads
    ctx.strokeStyle='hsla('+(hu+150)+',90%,78%,'+.7*dim+')';ctx.lineWidth=2.2*z;
    for(let i=0;i<4;i++){const gx=(i-1.5)*w*.27,gy=-h*(.6-.05*Math.abs(i-1.5));ctx.beginPath();ctx.arc(gx,gy,s*.1,Math.PI*.15,Math.PI*.85,true);ctx.stroke()}
    // highlight
    ctx.strokeStyle='hsla(0,0%,100%,'+.32*dim+')';ctx.lineWidth=1.6*z;ctx.beginPath();ctx.moveTo(-w*.74,-h*.4);ctx.quadraticCurveTo(-w*.62,-h*.86,-w*.2,-h*.93);ctx.stroke();
    ctx.restore();ctx.globalCompositeOperation='source-over'}

  function frame(){
    t+=.016;
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // light shafts
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<4;i++){const x=W*(.15+i*.24)+Math.sin(t*.07*SP+i*2)*W*.06,wd=W*(.05+.03*Math.sin(t*.1+i)),g=ctx.createLinearGradient(0,0,0,H*.8);
      g.addColorStop(0,'rgba(120,220,225,.07)');g.addColorStop(1,'rgba(120,220,225,0)');ctx.fillStyle=g;
      ctx.beginPath();ctx.moveTo(x-wd,0);ctx.lineTo(x+wd,0);ctx.lineTo(x+wd*3-W*.12,H*.8);ctx.lineTo(x-wd*3-W*.12,H*.8);ctx.fill()}
    // marine snow
    ctx.fillStyle='#d8fff8';
    for(const p of snow){p.y+=(.12+p.z*.4)*SP;p.x+=Math.sin(t*.5+p.k)*.18*p.z;
      const dx=p.x-ptr.x,dy=p.y-ptr.y,d2=dx*dx+dy*dy;if(d2<9000){p.x+=ptr.vx*.05;p.y+=ptr.vy*.05}
      if(p.y>H+4){p.y=-4;p.x=R(0,W)}if(p.x<-4)p.x=W+4;if(p.x>W+4)p.x=-4;
      ctx.globalAlpha=.1+p.z*.4;const r=.5+p.z*1.3;ctx.fillRect(p.x,p.y,r,r)}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    for(let i=0;i<jel.length;i++)stepJelly(jel[i]);
    for(let i=0;i<jel.length;i++)if(jel[i].w)drawJelly(jel[i]);
    // startle ripples
    for(let i=rip.length-1;i>=0;i--){const r=rip[i];r.r+=2.2;r.a*=.95;ctx.strokeStyle='rgba(190,255,245,'+r.a+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();if(r.a<.02)rip.splice(i,1)}
    // vignette
    const v=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.3,W/2,H*.5,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,4,10,.6)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    ptr.vx*=.9;ptr.vy*=.9;
    if((t*60|0)%20===0)depthEl.textContent=(238+Math.sin(t*.11)*1.6).toFixed(1);
    requestAnimationFrame(frame)}

  function move(e){const nx=e.clientX,ny=e.clientY;if(ptr.on){ptr.vx=Math.max(-14,Math.min(14,nx-ptr.x));ptr.vy=Math.max(-14,Math.min(14,ny-ptr.y))}ptr.x=nx;ptr.y=ny;ptr.on=true}
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerdown',e=>{move(e);rip.push({x:e.clientX,y:e.clientY,r:6,a:.5});
    let best=null,bd=1e9;jel.forEach(j=>{const d=Math.hypot(j.x-e.clientX,j.y-j.s*.4-e.clientY);if(d<bd){bd=d;best=j}});
    if(best&&bd<best.s*4){best.ph=0;const dx=best.x-e.clientX,dy=best.y-e.clientY,d=Math.hypot(dx,dy)||1;best.vx+=dx/d*.9;best.vy+=dy/d*.9;best.ang+=Math.max(-.4,Math.min(.4,dx/d*.35))}});
  cv.addEventListener('pointerleave',()=>{ptr.on=false;ptr.x=ptr.y=-999});
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,120)});
  resize();
  for(let i=0;i<240;i++){t+=.016;jel.forEach(stepJelly)}   // let the tentacles settle before first paint
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
